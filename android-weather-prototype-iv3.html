<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>안드로이드 날씨 앱 (가칭) — 인터랙티브 프로토타입</title>
  <style>
    /* ==========================================================================
       1. 시맨틱 디자인 토큰 (Light / Dark / High-Contrast — TASK-001, A1/A3)
       ========================================================================== */
    :root {
      /* Showcase & Simulator Chrome (앱 UI 외부) */
      --stage-bg: #e8eef6;
      --stage-panel: #ffffff;
      --stage-border: #cbd5e1;
      --stage-text: #0f172a;
      --stage-muted: #475569;

      /* App Semantic Tokens — Light */
      --bg-ground: #f2f5fa;
      --bg-surface: #ffffff;
      --bg-tonal: #e8eff8;
      --bg-tonal-strong: #dce6f5;
      --bg-hero-start: #dce9fb;
      --bg-hero-end: #f2f5fa;
      --border-subtle: #d6e0ee;
      --border-strong: #94a3b8;

      --text-primary: #0f172a;
      --text-secondary: #3f4f66; /* >= 7.5:1 on #fff, >= 6.8:1 on #f2f5fa */
      --text-tertiary: #52627a;  /* >= 5.5:1 on #fff, >= 5.0:1 on #f2f5fa */
      --text-on-accent: #ffffff;

      --accent-primary: #1d4ed8;       /* >= 6.7:1 with #fff */
      --accent-primary-hover: #1e40af;
      --accent-soft: #dbeafe;
      --accent-on-soft: #1e3a8a;

      --temp-warm: #b9380b;            /* >= 5.7:1 on #fff */
      --temp-cool: #0369a1;            /* >= 5.9:1 on #fff */
      --rain-color: #1d4ed8;

      --grade-good-bg: #dcfce7;
      --grade-good-fg: #14532d;        /* >= 8.5:1 */
      --grade-mod-bg: #dbeafe;
      --grade-mod-fg: #1e3a8a;         /* >= 8.5:1 */
      --grade-bad-bg: #ffedd5;
      --grade-bad-fg: #9a3412;         /* >= 7.0:1 */
      --grade-vbad-bg: #fee2e2;
      --grade-vbad-fg: #991b1b;        /* >= 7.2:1 */

      --status-warn-bg: #fef3c7;
      --status-warn-fg: #78350f;
      --status-warn-border: #d97706;
      --status-err-bg: #fee2e2;
      --status-err-fg: #991b1b;
      --status-err-border: #dc2626;
      --destructive: #b91c1c;
      --destructive-hover: #991b1b;

      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.05), 0 4px 12px rgba(15, 23, 42, 0.04);
      --shadow-sheet: 0 -8px 28px rgba(15, 23, 42, 0.16);
      --focus-ring: #1d4ed8;

      /* Scale & Spacing Rhythm (4/8px) */
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 999px;
      --nav-height: 68px;
      --app-font-scale: 1;
      --app-max-width: 412px;
      --motion-fast: 160ms;
      --motion-med: 240ms;
    }

    html[data-theme="dark"] {
      --stage-bg: #070b14;
      --stage-panel: #111827;
      --stage-border: #26334a;
      --stage-text: #f1f5f9;
      --stage-muted: #94a3b8;

      --bg-ground: #0c1322;
      --bg-surface: #152033;
      --bg-tonal: #1d2b44;
      --bg-tonal-strong: #253654;
      --bg-hero-start: #182b4d;
      --bg-hero-end: #0c1322;
      --border-subtle: #283854;
      --border-strong: #4b6186;

      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-tertiary: #9fb0c7;  /* >= 6.8:1 on #152033 */
      --text-on-accent: #081226;

      --accent-primary: #7cb3ff;
      --accent-primary-hover: #9cc6ff;
      --accent-soft: #1e355c;
      --accent-on-soft: #dbeafe;

      --temp-warm: #fb923c;
      --temp-cool: #60a5fa;
      --rain-color: #7cb3ff;

      --grade-good-bg: #123324;
      --grade-good-fg: #86efac;
      --grade-mod-bg: #172e54;
      --grade-mod-fg: #93c5fd;
      --grade-bad-bg: #43230f;
      --grade-bad-fg: #fdba74;
      --grade-vbad-bg: #45161b;
      --grade-vbad-fg: #fca5a5;

      --status-warn-bg: #3b2a0e;
      --status-warn-fg: #fde68a;
      --status-warn-border: #f59e0b;
      --status-err-bg: #421519;
      --status-err-fg: #fecaca;
      --status-err-border: #f87171;
      --destructive: #f87171;
      --destructive-hover: #fca5a5;

      --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.28);
      --shadow-sheet: 0 -8px 32px rgba(0, 0, 0, 0.55);
      --focus-ring: #93c5fd;
    }

    html[data-theme="high-contrast"] {
      --stage-bg: #000000;
      --stage-panel: #000000;
      --stage-border: #ffffff;
      --stage-text: #ffffff;
      --stage-muted: #e5e5e5;

      --bg-ground: #000000;
      --bg-surface: #0a0a0a;
      --bg-tonal: #141414;
      --bg-tonal-strong: #1f1f1f;
      --bg-hero-start: #0a0a0a;
      --bg-hero-end: #000000;
      --border-subtle: #ffffff;
      --border-strong: #ffffff;

      --text-primary: #ffffff;
      --text-secondary: #f5f5f5;
      --text-tertiary: #e0e0e0;
      --text-on-accent: #000000;

      --accent-primary: #ffe600;
      --accent-primary-hover: #fff266;
      --accent-soft: #1a1a00;
      --accent-on-soft: #ffe600;

      --temp-warm: #ff9966;
      --temp-cool: #7ad7ff;
      --rain-color: #7ad7ff;

      --grade-good-bg: #000000;
      --grade-good-fg: #7dff9b;
      --grade-mod-bg: #000000;
      --grade-mod-fg: #7ad7ff;
      --grade-bad-bg: #000000;
      --grade-bad-fg: #ffbe5c;
      --grade-vbad-bg: #000000;
      --grade-vbad-fg: #ff7a7a;

      --status-warn-bg: #000000;
      --status-warn-fg: #ffe600;
      --status-warn-border: #ffe600;
      --status-err-bg: #000000;
      --status-err-fg: #ff7a7a;
      --status-err-border: #ff7a7a;
      --destructive: #ff6b6b;
      --destructive-hover: #ff9494;

      --shadow-card: none;
      --shadow-sheet: 0 -2px 0 #ffffff;
      --focus-ring: #ffe600;
    }

    /* ==========================================================================
       2. 기본 리셋 · 타이포 · 접근성 하한 (A4, A5)
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--stage-bg);
      color: var(--stage-text);
      font-family: "Pretendard Variable", "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    button, input, select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    :focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       3. 외부 스테이지 & 비침범 시뮬레이터 레이아웃 (G5 — 본 UI 분리)
       ========================================================================== */
    .prototype-stage {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 24px;
      padding: 20px 16px;
    }

    .sim-drawer {
      width: 312px;
      flex: 0 0 312px;
      background: var(--stage-panel);
      border: 1px solid var(--stage-border);
      border-radius: 16px;
      padding: 16px;
      position: sticky;
      top: 20px;
      max-height: calc(100dvh - 40px);
      overflow-y: auto;
      font-size: 13px;
    }

    .sim-drawer summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      min-height: 44px;
    }
    .sim-drawer summary::-webkit-details-marker { display: none; }

    .sim-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--accent-soft);
      color: var(--accent-on-soft);
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    html[data-theme="high-contrast"] .sim-badge {
      border-color: var(--accent-primary);
    }

    .sim-group {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--stage-border);
    }

    .sim-group-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--stage-muted);
      margin: 0 0 8px 0;
    }

    .sim-btn-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .sim-btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sim-btn {
      min-height: 36px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--stage-border);
      background: transparent;
      color: var(--stage-text);
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      transition: background var(--motion-fast), border-color var(--motion-fast);
    }
    .sim-btn:hover {
      background: var(--bg-tonal);
    }
    .sim-btn[aria-pressed="true"] {
      background: var(--accent-primary);
      color: var(--text-on-accent);
      border-color: var(--accent-primary);
    }

    .sim-note {
      margin: 10px 0 0;
      font-size: 12px;
      color: var(--stage-muted);
      line-height: 1.45;
    }

    /* ==========================================================================
       4. 안드로이드 앱 셸 (Device Viewport — 320px~760dp 대응)
       ========================================================================== */
    .device-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: var(--app-max-width);
      min-width: 0;
      transition: max-width var(--motion-med);
    }

    .app-shell {
      width: 100%;
      min-height: 780px;
      height: min(860px, calc(100dvh - 40px));
      background: var(--bg-ground);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 28px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.14);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      font-size: calc(15px * var(--app-font-scale));
    }

    html[data-theme="high-contrast"] .app-shell {
      border: 2px solid #ffffff;
      box-shadow: none;
    }

    /* 200% font scale simulation inside app (NFR-A11Y-001, A5) */
    .app-shell.scale-200 {
      --app-font-scale: 1.8;
    }
    .app-shell.scale-200 .hero-temp {
      font-size: 3.1rem;
    }
    .app-shell.scale-200 .hero-metrics {
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .app-shell.scale-200 .detail-kv-grid,
    .app-shell.scale-200 .theme-seg,
    .app-shell.narrow-320 .theme-seg {
      grid-template-columns: 1fr;
    }
    .app-shell.scale-200 .loc-row {
      flex-wrap: wrap;
    }
    .app-shell.scale-200 .history-day-btn,
    .app-shell.narrow-320 .history-day-btn {
      grid-template-columns: 1fr;
      gap: 4px;
    }

    /* Narrow viewport (실제 모바일 / 320px / 200% 브라우저 확대) — 외부 크롬 제거, 가로 넘침 0건 */
    @media (max-width: 899px) {
      .prototype-stage {
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 0;
      }
      .sim-drawer {
        width: 100%;
        flex: none;
        position: static;
        max-height: none;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        border-top: 0;
        padding: 6px 12px;
      }
      .device-column {
        max-width: 100%;
      }
      .app-shell {
        min-height: calc(100dvh - 58px);
        height: auto;
        border-radius: 0;
        border: 0;
        box-shadow: none;
      }
    }

    /* Top App Bar */
    .app-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px 8px;
      background: var(--bg-hero-start);
      position: relative;
      z-index: 4;
      flex-shrink: 0;
    }
    .app-topbar.solid-bar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .loc-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      min-width: 0;
      flex: 1;
      padding: 6px 10px 6px 6px;
      border: 0;
      border-radius: var(--radius-md);
      background: transparent;
      text-align: left;
    }
    .loc-trigger:hover {
      background: var(--bg-tonal);
    }
    .loc-trigger svg {
      flex-shrink: 0;
    }

    .loc-title-wrap {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .loc-name {
      font-size: 1.05em;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-primary);
    }
    .loc-meta {
      font-size: 0.76em;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--text-primary);
      transition: background var(--motion-fast);
    }
    .icon-btn:hover {
      background: var(--bg-tonal);
    }
    html[data-theme="high-contrast"] .icon-btn {
      border-color: var(--border-subtle);
    }

    /* Progress bar for background refresh (캐시 유지 갱신) */
    .refresh-progress {
      height: 3px;
      width: 100%;
      background: var(--bg-tonal);
      overflow: hidden;
      flex-shrink: 0;
      display: none;
    }
    .refresh-progress.active {
      display: block;
    }
    .refresh-progress-bar {
      height: 100%;
      width: 42%;
      background: var(--accent-primary);
      animation: indeterminate 1.2s ease-in-out infinite;
    }
    @keyframes indeterminate {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }

    /* Main Scroll Viewport */
    .app-main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 20px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }

    .tab-panel {
      display: none;
    }
    .tab-panel.active {
      display: block;
    }

    /* Banners (Offline / Quota / Permission) */
    .status-banner {
      margin: 8px 14px 0;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--status-warn-border);
      background: var(--status-warn-bg);
      color: var(--status-warn-fg);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.85em;
      line-height: 1.45;
    }
    .status-banner.error {
      border-color: var(--status-err-border);
      background: var(--status-err-bg);
      color: var(--status-err-fg);
    }
    .status-banner-body {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      min-width: 0;
      flex: 1;
    }

    .inline-action-btn {
      min-height: 36px;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      font-size: 0.85em;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .inline-action-btn:hover {
      opacity: 0.85;
    }

    /* ==========================================================================
       5. 홈 탭 — 1차 Hero · 2차 비교/시간별/주간/미세먼지 (위계 차등, G1~G3)
       ========================================================================== */
    .hero-stage {
      background: linear-gradient(180deg, var(--bg-hero-start) 0%, var(--bg-hero-end) 100%);
      padding: 10px 18px 18px;
    }

    .hero-primary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero-temp-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hero-temp {
      font-size: 4.1rem;
      font-weight: 300;
      line-height: 0.96;
      letter-spacing: -0.04em;
      color: var(--text-primary);
      margin: 0;
    }

    .hero-sky-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.96em;
      font-weight: 600;
      color: var(--text-primary);
    }
    .hero-hilo {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .hero-icon-wrap {
      width: 78px;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Hero inline metrics — 중첩 박스 없이 구분선으로 정리 (A2) */
    .hero-metrics {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .hero-metric-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .hero-metric-label {
      font-size: 0.78em;
      color: var(--text-secondary);
    }
    .hero-metric-value {
      font-size: 0.95em;
      font-weight: 700;
      color: var(--text-primary);
    }

    .hero-release-note {
      margin-top: 10px;
      font-size: 0.76em;
      color: var(--text-tertiary);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
    }

    /* Content Stack */
    .section-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 4px 14px 12px;
    }

    /* Comparison Highlight Strip (차별 핵심: 어제·작년 비교) */
    .compare-strip {
      width: 100%;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-card);
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color var(--motion-fast), transform var(--motion-fast);
    }
    .compare-strip:hover {
      border-color: var(--accent-primary);
    }
    .compare-strip-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .compare-kicker {
      font-size: 0.78em;
      font-weight: 700;
      color: var(--accent-primary);
    }
    .compare-headline {
      font-size: 0.98em;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.4;
    }
    .compare-deltas {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .delta-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: var(--bg-tonal);
      font-size: 0.82em;
      font-weight: 600;
      color: var(--text-primary);
    }
    .delta-pill.warm { color: var(--temp-warm); }
    .delta-pill.cool { color: var(--temp-cool); }
    html[data-theme="high-contrast"] .delta-pill {
      border: 1px solid var(--border-subtle);
    }

    .compare-station-meta {
      font-size: 0.76em;
      color: var(--text-tertiary);
    }

    /* Section Surface (단일 계층, 중첩 카드 금지 A2) */
    .surface-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-card);
    }
    html[data-theme="high-contrast"] .surface-card,
    html[data-theme="high-contrast"] .compare-strip {
      border-width: 2px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .section-title {
      font-size: 0.96em;
      font-weight: 700;
      margin: 0;
      color: var(--text-primary);
    }
    .section-sub {
      font-size: 0.78em;
      color: var(--text-tertiary);
    }

    /* Hourly Forecast with Integrated SVG Spline (FR-002, G3) */
    .hourly-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .scroll-mini-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-tonal);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .hourly-viewport {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 6px;
      scrollbar-width: thin;
    }

    .hourly-canvas {
      position: relative;
      display: flex;
      flex-direction: column;
      width: max-content;
    }

    .hourly-row-top, .hourly-row-bottom {
      display: flex;
    }

    .hourly-cell {
      width: 58px;
      flex: 0 0 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 4px;
      padding: 4px 2px;
    }
    .hourly-cell.is-now {
      background: var(--bg-tonal);
      border-radius: var(--radius-sm);
    }

    .hourly-time {
      font-size: 0.76em;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .hourly-tag {
      font-size: 0.65em;
      font-weight: 700;
      color: var(--accent-primary);
      height: 14px;
    }
    .hourly-temp {
      font-size: 0.9em;
      font-weight: 700;
      color: var(--text-primary);
    }
    .hourly-pop {
      font-size: 0.74em;
      font-weight: 600;
      color: var(--rain-color);
      min-height: 16px;
    }
    .hourly-pop.zero {
      color: var(--text-tertiary);
      font-weight: 500;
    }

    .hourly-spline-svg {
      display: block;
      height: 44px;
      overflow: visible;
    }

    /* Air Quality Section (FR-004, DATA-002 — 색+아이콘+텍스트 병기) */
    .air-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .app-shell.scale-200 .air-grid,
    .app-shell.narrow-320 .air-grid {
      grid-template-columns: 1fr;
    }
    @media (max-width: 350px) {
      .air-grid { grid-template-columns: 1fr; }
    }

    .air-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }
    .air-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .air-label {
      font-size: 0.82em;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .grade-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-size: 0.76em;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .grade-chip.good { background: var(--grade-good-bg); color: var(--grade-good-fg); }
    .grade-chip.mod  { background: var(--grade-mod-bg);  color: var(--grade-mod-fg); }
    .grade-chip.bad  { background: var(--grade-bad-bg);  color: var(--grade-bad-fg); }
    .grade-chip.vbad { background: var(--grade-vbad-bg); color: var(--grade-vbad-fg); }
    html[data-theme="high-contrast"] .grade-chip { border-color: currentColor; }

    .air-val {
      font-size: 1.45em;
      font-weight: 700;
      line-height: 1.15;
    }
    .air-unit {
      font-size: 0.56em;
      font-weight: 500;
      color: var(--text-secondary);
      margin-left: 2px;
    }

    /* 4-step segmented scale bar */
    .air-scale {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
      height: 6px;
      margin-top: 2px;
    }
    .air-scale-seg {
      border-radius: 3px;
      opacity: 0.35;
    }
    .air-scale-seg.active { opacity: 1; }
    .air-scale-seg.s1 { background: #16a34a; }
    .air-scale-seg.s2 { background: #2563eb; }
    .air-scale-seg.s3 { background: #ea580c; }
    .air-scale-seg.s4 { background: #dc2626; }

    .air-footnote {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.76em;
      color: var(--text-tertiary);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .air-fallback-note {
      color: var(--status-warn-fg);
      background: var(--status-warn-bg);
      border: 1px solid var(--status-warn-border);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }

    /* 10-Day Weekly Forecast with Proportional Range Bars (FR-003, G3) */
    .weekly-list {
      display: flex;
      flex-direction: column;
    }
    .weekly-row {
      display: grid;
      grid-template-columns: 74px 66px 32px minmax(52px, 1fr) 32px;
      align-items: center;
      gap: 6px;
      padding: 9px 0;
      border-top: 1px solid var(--border-subtle);
    }
    .weekly-row:first-child {
      border-top: 0;
      padding-top: 2px;
    }
    .weekly-day {
      font-size: 0.86em;
      font-weight: 600;
      color: var(--text-primary);
    }
    .weekly-day small {
      display: block;
      font-size: 0.78em;
      font-weight: 500;
      color: var(--text-tertiary);
    }
    .weekly-sky {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.76em;
      color: var(--rain-color);
      font-weight: 600;
    }
    .weekly-min {
      font-size: 0.86em;
      color: var(--temp-cool);
      font-weight: 600;
      text-align: right;
    }
    .weekly-max {
      font-size: 0.86em;
      color: var(--temp-warm);
      font-weight: 700;
      text-align: left;
    }
    .range-track {
      height: 7px;
      border-radius: var(--radius-pill);
      background: var(--bg-tonal);
      position: relative;
      overflow: hidden;
    }
    .range-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: var(--radius-pill);
      background: linear-gradient(90deg, var(--temp-cool), var(--temp-warm));
    }

    .app-shell.narrow-320 .weekly-row {
      grid-template-columns: 62px 54px 28px minmax(36px, 1fr) 28px;
      gap: 4px;
    }
    .app-shell.scale-200 .weekly-row {
      grid-template-columns: auto minmax(56px, 1fr) auto;
      row-gap: 8px;
      column-gap: 8px;
    }
    .app-shell.scale-200 .weekly-row .weekly-day {
      grid-column: 1 / 3;
    }
    .app-shell.scale-200 .weekly-row .weekly-sky {
      grid-column: 3 / 4;
      justify-self: end;
    }
    .app-shell.scale-200 .weekly-row .weekly-min {
      grid-column: 1 / 2;
      text-align: left;
    }
    .app-shell.scale-200 .weekly-row .range-track {
      grid-column: 2 / 3;
      height: 9px;
    }
    .app-shell.scale-200 .weekly-row .weekly-max {
      grid-column: 3 / 4;
      text-align: right;
    }

    /* Section Inline Error & Empty States */
    .section-error-box {
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px dashed var(--status-err-border);
      background: var(--status-err-bg);
      color: var(--status-err-fg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.84em;
    }

    .empty-state-panel {
      margin: 24px 16px;
      padding: 28px 18px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .empty-state-panel h2 {
      margin: 0;
      font-size: 1.08em;
    }
    .empty-state-panel p {
      margin: 0;
      font-size: 0.88em;
      color: var(--text-secondary);
      max-width: 28ch;
    }

    /* Skeleton Loading (레이아웃 시프트 방지) */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-tonal) 25%, var(--bg-tonal-strong) 50%, var(--bg-tonal) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.3s ease-in-out infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ==========================================================================
       6. 과거 날씨 탭 — 비교 표 · 기간 선택 · 복합 선/막대 그래프 (FR-005, FR-006)
       ========================================================================== */
    .page-pad {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .compare-table-wrap {
      overflow-x: auto;
    }
    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84em;
    }
    .compare-table th, .compare-table td {
      padding: 8px 6px;
      text-align: right;
      border-bottom: 1px solid var(--border-subtle);
    }
    .compare-table th:first-child, .compare-table td:first-child {
      text-align: left;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .compare-table thead th {
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 0.9em;
    }
    .compare-table tr:last-child td {
      border-bottom: 0;
    }

    .leap-note {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      color: var(--accent-on-soft);
      font-size: 0.8em;
      font-weight: 600;
    }

    /* Quick Range Chips & Date Inputs */
    .preset-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .chip-btn {
      min-height: 44px;
      padding: 0 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-tonal);
      color: var(--text-primary);
      font-size: 0.85em;
      font-weight: 600;
    }
    .chip-btn[aria-pressed="true"] {
      background: var(--accent-primary);
      color: var(--text-on-accent);
      border-color: var(--accent-primary);
    }

    .date-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      align-items: end;
    }
    .app-shell.scale-200 .date-form-grid,
    .app-shell.narrow-320 .date-form-grid {
      grid-template-columns: 1fr;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .field-label {
      font-size: 0.78em;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .text-input {
      min-height: 44px;
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg-ground);
      color: var(--text-primary);
      font-size: 0.88em;
    }
    .text-input[aria-invalid="true"] {
      border-color: var(--status-err-border);
      background: var(--status-err-bg);
    }

    .field-error {
      margin-top: 8px;
      font-size: 0.82em;
      font-weight: 600;
      color: var(--status-err-fg);
      background: var(--status-err-bg);
      border: 1px solid var(--status-err-border);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
    }

    .primary-btn {
      min-height: 44px;
      padding: 0 16px;
      border-radius: var(--radius-pill);
      border: 1px solid transparent;
      background: var(--accent-primary);
      color: var(--text-on-accent);
      font-size: 0.9em;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .primary-btn:hover {
      background: var(--accent-primary-hover);
    }

    .secondary-btn {
      min-height: 44px;
      padding: 0 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text-primary);
      font-size: 0.88em;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .secondary-btn:hover {
      background: var(--bg-tonal);
    }

    .destructive-btn {
      min-height: 44px;
      padding: 0 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--destructive);
      background: transparent;
      color: var(--destructive);
      font-size: 0.88em;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .destructive-btn:hover {
      background: var(--status-err-bg);
    }
    .destructive-btn.solid {
      background: var(--destructive);
      color: #ffffff;
    }
    html[data-theme="dark"] .destructive-btn.solid,
    html[data-theme="high-contrast"] .destructive-btn.solid {
      color: #000000;
    }

    /* History Dual Chart Container */
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.78em;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .legend-swatch {
      width: 12px;
      height: 4px;
      border-radius: 2px;
    }
    .legend-swatch.bar {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    .chart-scroll {
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .history-svg {
      display: block;
      width: 100%;
      min-width: 280px;
      height: 210px;
    }
    .chart-hit-dot {
      cursor: pointer;
    }

    .chart-summary-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-tonal);
      font-size: 0.8em;
      color: var(--text-primary);
    }

    .history-day-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
    }
    .history-day-btn {
      width: 100%;
      min-height: 44px;
      padding: 8px 6px;
      border: 0;
      border-top: 1px solid var(--border-subtle);
      background: transparent;
      display: grid;
      grid-template-columns: 82px 1fr auto;
      align-items: center;
      gap: 8px;
      text-align: left;
      font-size: 0.84em;
    }
    .history-day-btn:hover {
      background: var(--bg-tonal);
    }

    /* ==========================================================================
       7. 지역 검색 · 즐겨찾기 탭 (FR-007, FR-008)
       ========================================================================== */
    .search-box-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .search-hint {
      margin: 6px 0 0;
      font-size: 0.78em;
      color: var(--text-tertiary);
    }

    .loc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 0;
      border-top: 1px solid var(--border-subtle);
    }
    .loc-row:first-child {
      border-top: 0;
      padding-top: 2px;
    }

    .loc-row-main {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 4px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }
    .loc-row-title {
      font-size: 0.92em;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .loc-row-sub {
      font-size: 0.78em;
      color: var(--text-secondary);
    }

    .primary-pill {
      font-size: 0.72em;
      padding: 1px 7px;
      border-radius: var(--radius-pill);
      background: var(--accent-soft);
      color: var(--accent-on-soft);
      font-weight: 700;
    }

    .loc-row-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .icon-btn.danger {
      color: var(--destructive);
    }
    .icon-btn.danger:hover {
      background: var(--status-err-bg);
    }

    /* ==========================================================================
       8. 정보 · 설정 탭 (DATA-001, DATA-002, SEC-001, FR-009)
       ========================================================================== */
    .info-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 11px 0;
      border-top: 1px solid var(--border-subtle);
    }
    .info-row:first-child {
      border-top: 0;
      padding-top: 0;
    }
    .info-row-title {
      font-size: 0.88em;
      font-weight: 700;
      color: var(--text-primary);
    }
    .info-row-desc {
      font-size: 0.82em;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .theme-seg {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    /* ==========================================================================
       9. 하단 내비게이션 바 (홈 · 과거 · 지역 · 정보 — Material 3)
       ========================================================================== */
    .bottom-nav {
      min-height: var(--nav-height);
      flex-shrink: 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      padding: 4px 6px max(6px, env(safe-area-inset-bottom));
      z-index: 5;
    }

    .nav-btn {
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 48px;
      padding: 4px 2px;
      color: var(--text-secondary);
      font-size: 0.76em;
      font-weight: 600;
      border-radius: var(--radius-md);
    }
    .nav-pill {
      width: 52px;
      height: 28px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--motion-fast);
    }
    .nav-btn[aria-current="page"] {
      color: var(--text-primary);
      font-weight: 700;
    }
    .nav-btn[aria-current="page"] .nav-pill {
      background: var(--accent-soft);
      color: var(--accent-on-soft);
    }
    html[data-theme="high-contrast"] .nav-btn[aria-current="page"] .nav-pill {
      border: 2px solid var(--accent-primary);
    }

    /* ==========================================================================
       10. 스낵바 (Undo 복구) & 모달/바텀시트 (배경 잠금 · Esc · 포커스 복귀)
       ========================================================================== */
    .snackbar {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: calc(var(--nav-height) + 12px);
      background: #1e293b;
      color: #f8fafc;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.85em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      z-index: 20;
    }
    .snackbar.visible {
      display: flex;
    }
    html[data-theme="high-contrast"] .snackbar {
      background: #000000;
      border: 2px solid #ffe600;
      color: #ffffff;
    }
    .snackbar-action {
      min-height: 36px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #93c5fd;
      font-weight: 700;
      flex-shrink: 0;
    }
    html[data-theme="high-contrast"] .snackbar-action {
      color: #ffe600;
      border: 1px solid #ffe600;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.56);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 30;
      padding: 12px;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .sheet-dialog {
      width: 100%;
      max-height: 85%;
      overflow-y: auto;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow-sheet);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    html[data-theme="high-contrast"] .sheet-dialog {
      border: 2px solid #ffffff;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .sheet-title {
      margin: 0;
      font-size: 1.05em;
      font-weight: 700;
    }

    .detail-kv-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .detail-kv {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-tonal);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .detail-kv-label {
      font-size: 0.76em;
      color: var(--text-secondary);
    }
    .detail-kv-val {
      font-size: 1.02em;
      font-weight: 700;

    function showSnackbar(message, actionLabel = null, onAction = null) {
      const bar = document.getElementById("snackbar");

    function skyLabel(sky) {
      return { clear: "맑음", partly: "구름많음", cloudy: "흐림", rain: "비" }[sky] || "구름많음";
    }

    // 미세먼지 등급 (색 + 아이콘 기호 + 텍스트 — FR-004, A4)
    function pmGrade(type, val) {
      const limits = type === "pm10" ? [30, 80, 150] : [15, 35, 75];
      if (val <= limits[0]) return { idx: 1, cls: "good", label: "좋음", symbol: "●" };
      if (val <= limits[1]) return { idx: 2, cls: "mod", label: "보통", symbol: "◐" };
      if (val <= limits[2]) return { idx: 3, cls: "bad", label: "나쁨", symbol: "▲" };
      return { idx: 4, cls: "vbad", label: "매우나쁨", symbol: "◆" };
    }

    // 결정적 의사난수 (지역/날짜별 일관된 현실적 기상 시계열 생성)
    function seededWave(seed, step) {
      const x = Math.sin(seed * 12.9898 + step * 78.233) * 43758.5453;
      return x - Math.floor(x);
    }

    function buildHourlyData(region) {
      const list = [];
      const seed = region.nx * 7 + region.ny;
      const startHour = 21;
      const startDiurnal = -Math.cos(((startHour - 5) / 24) * Math.PI * 2) * 4.4;
      for (let i = 0; i < 48; i++) {
        const h = (startHour + i) % 24;
        const dayOffset = Math.floor((startHour + i) / 24);
        const diurnal = -Math.cos(((h - 5) / 24) * Math.PI * 2) * 4.4 - startDiurnal;
        const temp = i === 0
          ? region.baseTemp
          : Number((region.baseTemp + diurnal + (seededWave(seed, i) - 0.5) * 1.2).toFixed(1));
        const popRaw = region.sky === "rain" ? (i < 10 ? 70 : 30) : (seededWave(seed + 5, i) > 0.72 ? 40 : (seededWave(seed + 2, i) > 0.5 ? 20 : 0));
        const pop = i === 0 && region.rn1 === 0 ? 10 : Math.round(popRaw / 10) * 10;
        const sky = i === 0 ? region.sky : (pop >= 60 ? "rain" : pop >= 30 ? "cloudy" : (h >= 7 && h <= 17 ? (pop >= 20 ? "partly" : "clear") : "partly"));
        list.push({
          idx: i,
          label: i === 0 ? "지금" : (h === 0 ? (dayOffset === 1 ? "내일 0시" : "모레 0시") : `${h}시`),
          isUltra: i < 6,
          temp,
          pop,
          sky
        });
      }
      return list;
    }

    function buildWeeklyData(region) {
      const days = ["오늘", "내일", "토", "일", "월", "화", "수", "목", "금", "토", "일"];
      const seed = region.nx + region.ny * 3;
      const result = [];
      const baseDate = new Date("2026-11-19T00:00:00+09:00");
      for (let d = 0; d <= 10; d++) {
        const dt = new Date(baseDate.getTime() + d * 86400000);
        const mm = dt.getMonth() + 1;
        const dd = dt.getDate();
        const trend = Math.sin(d * 0.7 + seed) * 2.8;
        const min = Number((region.lo + trend - d * 0.15).toFixed(0));
        const max = Number((region.hi + trend - d * 0.12).toFixed(0));
        const amPop = d === 0 && region.sky === "rain" ? 70 : (seededWave(seed + 11, d) > 0.65 ? 60 : (seededWave(seed + 3, d) > 0.4 ? 20 : 10));
        const pmPop = seededWave(seed + 19, d) > 0.7 ? 70 : (seededWave(seed + 7, d) > 0.45 ? 30 : 10);
        const sky = Math.max(amPop, pmPop) >= 60 ? "rain" : Math.max(amPop, pmPop) >= 30 ? "cloudy" : "clear";
        result.push({
          d,
          dayLabel: days[d],
          dateLabel: `${mm}.${dd}`,
          isMid: d >= 4,
          min,
          max,
          amPop,
          pmPop,
          sky
        });
      }
      return result;
    }

    function buildComparisonData(region) {
      const seed = region.nx * 3 + region.ny;
      const yMax = Number((region.hi + 2.6 + (seededWave(seed, 1) - 0.5)).toFixed(1));
      const yMin = Number((region.lo + 1.8 + (seededWave(seed, 2) - 0.5)).toFixed(1));
      const yAvg = Number(((yMax + yMin) / 2).toFixed(1));
      const yRain = seededWave(seed, 3) > 0.6 ? Number((seededWave(seed, 4) * 9.5).toFixed(1)) : 0.0;

      const lyMax = Number((region.hi - 1.4 + (seededWave(seed, 5) - 0.5)).toFixed(1));
      const lyMin = Number((region.lo - 1.1 + (seededWave(seed, 6) - 0.5)).toFixed(1));
      const lyAvg = Number(((lyMax + lyMin) / 2).toFixed(1));
      const lyRain = seededWave(seed, 7) > 0.55 ? Number((seededWave(seed, 8) * 14.2).toFixed(1)) : 0.0;

      const todayAvg = Number(((region.hi + region.lo) / 2).toFixed(1));
      return {
        today: { label: state.leapYearDemo ? "오늘 (2028-02-29)" : `오늘 (${TODAY_STR})`, max: region.hi, min: region.lo, avg: todayAvg, rain: region.rn1 },
        yesterday: { label: state.leapYearDemo ? "어제 (2028-02-28)" : `어제 (${YESTERDAY_STR})`, max: yMax, min: yMin, avg: yAvg, rain: yRain },
        lastYear: {
          label: state.leapYearDemo ? "작년 (2027-02-28 대체)" : "작년 (2025-11-19)",
          max: lyMax, min: lyMin, avg: lyAvg, rain: lyRain
        },
        diffYesterday: Number((region.hi - yMax).toFixed(1)),
        diffLastYear: Number((region.hi - lyMax).toFixed(1))
      };
    }

    function formatDeltaText(label, delta) {
      if (Math.abs(delta) < 0.05) return `${label}와 비슷`;
      return `${label}보다 ${Math.abs(delta).toFixed(1)}℃ ${delta > 0 ? "높음" : "낮음"}`;
    }

    function buildHistorySeries(region, startStr, endStr) {
      const start = new Date(`${startStr}T00:00:00+09:00`);
      const end = new Date(`${endStr}T00:00:00+09:00`);
      const diffDays = Math.round((end - start) / 86400000) + 1;
      const seed = Number(region.asosId) || 108;
      const rows = [];
      for (let i = 0; i < diffDays; i++) {
        const dt = new Date(start.getTime() + i * 86400000);
        const iso = dt.toISOString().slice(0, 10);
        const seasonal = (diffDays - i) * 0.09; // 가을→초겨울 하강 추세
        const wave = Math.sin(i * 0.42 + seed) * 3.1;
        const maxTa = Number((region.hi + seasonal + wave).toFixed(1));
        const minTa = Number((region.lo + seasonal + wave - 0.6).toFixed(1));
        const avgTa = Number(((maxTa + minTa) / 2).toFixed(1));
        const rainChance = seededWave(seed + 13, i);
        const sumRn = rainChance > 0.78 ? Number((seededWave(seed + 29, i) * 24 + 0.5).toFixed(1)) : 0.0;
        // 결측 데이터 1건 정직하게 시뮬레이션 (DATA 정직성, TASK-007)
        const isMissingWind = i === Math.floor(diffDays / 2) && diffDays >= 10;
        rows.push({
          date: iso,
          shortDate: `${dt.getMonth() + 1}.${dt.getDate()}`,
          avgTa,
          maxTa,
          minTa,
          sumRn,
          avgWs: isMissingWind ? null : Number((1.4 + seededWave(seed + 41, i) * 3.8).toFixed(1)),
          avgRhm: Math.round(42 + seededWave(seed + 53, i) * 44)
        });
      }
      return rows;
    }

      const tMax = Math.max(...temps);
      const tSpan = Math.max(tMax - tMin, 2);
      const points = hourly.map((h, i) => {

        <div class="section-stack">

          <!-- 2차: 시간별 예보 48시간 + 기온 추세 곡선 (FR-002) -->

            <div class="section-header">

          <!-- 2차: 주간 예보 10일 (FR-003) -->

      // Bind home interactions
      document.getElementById("homeCompareBtn").onclick = () => switchTab("history");

      const hv = document.getElementById("hourlyViewport");

      document.getElementById("hourlyNextBtn").onclick = () => hv.scrollBy({ left: 232, behavior: "smooth" });

      const retryMid = document.getElementById("retryMidBtn");
      if (retryMid) {
        retryMid.onclick = () => {
          state.sectionErrors.midForecast = false;
          renderHome();
          announce("중기예보 구간을 정상적으로 다시 불러왔습니다.");

          showSnackbar("미세먼지 측정 자료를 다시 불러왔습니다.");

    function renderWeeklyRow(w, globalMin, span) {
      const leftPct = ((w.min - globalMin) / span) * 100;
      const widthPct = Math.max(((w.max - w.min) / span) * 100, 10);
      const maxPop = Math.max(w.amPop, w.pmPop);
      return `
        <div class="weekly-row" aria-label="${w.dayLabel} ${w.dateLabel}, 최저 ${w.min}도, 최고 ${w.max}도, 오전 강수확률 ${w.amPop}%, 오후 강수확률 ${w.pmPop}%">
          <div class="weekly-day tabular">${w.dayLabel}<small>${w.dateLabel}</small></div>
          <div class="weekly-sky tabular">
            ${weatherIconSvg(w.sky, 22)}
            <span>${maxPop}%</span>
          </div>
          <div class="weekly-min tabular">${w.min}°</div>
          <div class="range-track" aria-hidden="true">
            <div class="range-fill" style="left:${leftPct.toFixed(1)}%; width:${widthPct.toFixed(1)}%;"></div>
          </div>
          <div class="weekly-max tabular">${w.max}°</div>
        </div>
      `;
    }

    /* ==========================================================================
       5. 과거 날씨 탭 렌더링 (FR-005, FR-006, TEST-006, TEST-007)
       ========================================================================== */
    function renderHistory() {
      const el = document.getElementById("historyContent");
      const region = getActiveRegion();
      const comp = buildComparisonData(region);

      // Validate range
      const valid = !state.historyError;
      const series = valid ? buildHistorySeries(region, state.historyStart, state.historyEnd) : [];

      let chartBlock = "";
      if (valid && series.length > 0) {
        const maxTemp = Math.max(...series.map(r => r.maxTa));
        const minTemp = Math.min(...series.map(r => r.minTa));
        const maxRain = Math.max(...series.map(r => r.sumRn), 10);
        const totalRain = series.reduce((a, b) => a + b.sumRn, 0);
        const warmest = series.reduce((a, b) => (b.maxTa > a.maxTa ? b : a), series[0]);
        const coldest = series.reduce((a, b) => (b.minTa < a.minTa ? b : a), series[0]);

        const svgW = Math.max(300, Math.min(series.length * 18, 920));
        const svgH = 210;
        const padL = 34, padR = 14, padT = 18, padB = 30;
        const plotW = svgW - padL - padR;
        const plotH = svgH - padT - padB;
        const tSpan = Math.max(maxTemp - minTemp, 4);

        const xAt = (i) => padL + (series.length === 1 ? plotW / 2 : (i / (series.length - 1)) * plotW);
        const yTemp = (t) => padT + plotH - ((t - minTemp) / tSpan) * (plotH * 0.78) - plotH * 0.16;
        const barMaxH = plotH * 0.32;

        const maxPath = series.map((r, i) => `${i === 0 ? "M" : "L"}${xAt(i).toFixed(1)},${yTemp(r.maxTa).toFixed(1)}`).join(" ");
        const minPath = series.map((r, i) => `${i === 0 ? "M" : "L"}${xAt(i).toFixed(1)},${yTemp(r.minTa).toFixed(1)}`).join(" ");
        const areaPath = `${maxPath} ` + [...series].reverse().map((r, ri) => {
          const i = series.length - 1 - ri;
          return `L${xAt(i).toFixed(1)},${yTemp(r.minTa).toFixed(1)}`;
        }).join(" ") + " Z";

        const barW = Math.max(3, Math.min(10, plotW / Math.max(series.length, 1) * 0.55));
        const barsSvg = series.map((r, i) => {
          if (r.sumRn <= 0) return "";
          const h = Math.max(3, (r.sumRn / maxRain) * barMaxH);
          const x = xAt(i) - barW / 2;
          const y = padT + plotH - h;
          return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--rain-color)" opacity="0.45"/>`;
        }).join("");

        const tickStep = Math.max(1, Math.ceil(series.length / 5));
        const xTicks = series.map((r, i) => {
          if (i !== 0 && i !== series.length - 1 && i % tickStep !== 0) return "";
          return `<text x="${xAt(i).toFixed(1)}" y="${svgH - 8}" text-anchor="middle" font-size="10" fill="var(--text-tertiary)">${r.shortDate}</text>`;
        }).join("");

        const yTicks = [maxTemp, (maxTemp + minTemp) / 2, minTemp].map(t => {
          const y = yTemp(t);
          return `
            <line x1="${padL}" y1="${y.toFixed(1)}" x2="${svgW - padR}" y2="${y.toFixed(1)}" stroke="var(--border-subtle)" stroke-dasharray="3 3"/>
            <text x="${padL - 5}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-tertiary)">${Math.round(t)}°</text>
          `;
        }).join("");

        const hitTargets = series.map((r, i) => {
          const cx = xAt(i);
          const cy = yTemp(r.maxTa);
          const showDot = series.length <= 35 || i % 3 === 0 || i === series.length - 1;
          return `
            <g class="chart-hit-dot" data-history-date="${r.date}" tabindex="0" role="button" aria-label="${r.date} 최고 ${r.maxTa}도, 최저 ${r.minTa}도, 강수량 ${r.sumRn}mm 상세 보기">
              <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${showDot ? 4 : 2.5}" fill="var(--temp-warm)"/>
              <circle cx="${cx.toFixed(1)}" cy="${yTemp(r.minTa).toFixed(1)}" r="${showDot ? 3.2 : 2}" fill="var(--temp-cool)"/>
              <rect x="${(cx - Math.max(8, barW)).toFixed(1)}" y="${padT}" width="${Math.max(16, barW * 2).toFixed(1)}" height="${plotH}" fill="transparent"/>
            </g>
          `;
        }).join("");

        const recentSlice = [...series].reverse().slice(0, 7);

        chartBlock = `
          <div class="chart-legend">
            <span class="legend-item"><span class="legend-swatch" style="background:var(--temp-warm);"></span>최고기온</span>
            <span class="legend-item"><span class="legend-swatch" style="background:var(--temp-cool);"></span>최저기온</span>
            <span class="legend-item"><span class="legend-swatch bar" style="background:var(--rain-color); opacity:0.6;"></span>일강수량(mm)</span>
          </div>

          <div class="chart-scroll">
            <svg class="history-svg" viewBox="0 0 ${svgW} ${svgH}" role="img" aria-label="선택 기간 ${series.length}일간 최고·최저기온 선 그래프 및 일강수량 막대 그래프">
              ${yTicks}
              <path d="${areaPath}" fill="var(--accent-primary)" opacity="0.1"/>
              ${barsSvg}
              <path d="${maxPath}" fill="none" stroke="var(--temp-warm)" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="${minPath}" fill="none" stroke="var(--temp-cool)" stroke-width="2.2" stroke-linejoin="round"/>
              ${xTicks}
              ${hitTargets}
            </svg>
          </div>

          <div class="chart-summary-box tabular" aria-live="polite">
            <strong>기간 요약 (${series.length}일):</strong> 최고 ${warmest.maxTa.toFixed(1)}℃(${warmest.shortDate}) · 최저 ${coldest.minTa.toFixed(1)}℃(${coldest.shortDate}) · 누적 강수 ${totalRain.toFixed(1)}mm
            <div style="margin-top:4px; color:var(--text-secondary);">그래프의 날짜 점이나 아래 일별 목록을 누르면 상세 관측값을 확인할 수 있습니다.</div>
          </div>

          <div class="history-day-list" aria-label="최근 일별 관측 기록">
            ${recentSlice.map(r => `
              <button type="button" class="history-day-btn tabular" data-history-date="${r.date}">
                <strong>${r.date}</strong>
                <span>최저 <strong style="color:var(--temp-cool);">${r.minTa.toFixed(1)}°</strong> / 최고 <strong style="color:var(--temp-warm);">${r.maxTa.toFixed(1)}°</strong></span>
                <span style="color:var(--text-secondary);">${r.sumRn > 0 ? `💧 ${r.sumRn.toFixed(1)}mm` : "0.0mm"} ›</span>
              </button>
            `).join("")}
          </div>
        `;
      }

      el.innerHTML = `
        <!-- 어제 · 작년 같은 날 비교 표 (FR-005) -->
        <article class="surface-card" aria-label="어제 및 작년 같은 날 비교">
          <div class="section-header">
            <div>
              <h2 class="section-title">어제 · 작년 같은 날 비교</h2>
              <span class="section-sub tabular">ASOS ${region.asosName}(${region.asosId}) 관측소 · 거리 약 ${region.asosDistKm}km</span>
            </div>
          </div>

          <div class="compare-table-wrap">
            <table class="compare-table tabular">
              <thead>
                <tr>
                  <th scope="col">구분</th>
                  <th scope="col">최고</th>
                  <th scope="col">최저</th>
                  <th scope="col">평균</th>
                  <th scope="col">일강수</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>${comp.today.label}</td>
                  <td><strong style="color:var(--temp-warm);">${comp.today.max.toFixed(1)}°</strong></td>
                  <td><strong style="color:var(--temp-cool);">${comp.today.min.toFixed(1)}°</strong></td>
                  <td>${comp.today.avg.toFixed(1)}°</td>
                  <td>${comp.today.rain.toFixed(1)}mm</td>
                </tr>
                <tr>
                  <td>${comp.yesterday.label}</td>
                  <td>${comp.yesterday.max.toFixed(1)}°</td>
                  <td>${comp.yesterday.min.toFixed(1)}°</td>
                  <td>${comp.yesterday.avg.toFixed(1)}°</td>
                  <td>${comp.yesterday.rain.toFixed(1)}mm</td>
                </tr>
                <tr>
                  <td>${comp.lastYear.label}</td>
                  <td>${comp.lastYear.max.toFixed(1)}°</td>
                  <td>${comp.lastYear.min.toFixed(1)}°</td>
                  <td>${comp.lastYear.avg.toFixed(1)}°</td>
                  <td>${comp.lastYear.rain.toFixed(1)}mm</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="compare-deltas tabular" style="margin-top:12px;">
            <span class="delta-pill">${formatDeltaText("어제", comp.diffYesterday)}</span>
            <span class="delta-pill">${formatDeltaText("작년 같은 날", comp.diffLastYear)}</span>
          </div>

          ${state.leapYearDemo ? `
            <div class="leap-note" role="note">
              윤년 2월 29일 안내: 작년에는 2월 29일이 없어 <strong>2027-02-28</strong> 관측 자료로 대체 비교했습니다.
            </div>
          ` : ""}
        </article>

        <!-- 과거 날씨 기간 조회 · 복합 그래프 (FR-006) -->
        <article class="surface-card" aria-label="과거 날씨 기간 조회 및 그래프">
          <div class="section-header">
            <div>
              <h2 class="section-title">기간별 추이 그래프</h2>
              <span class="section-sub">종료일 최대 어제(${YESTERDAY_STR}) · 최대 366일</span>
            </div>
          </div>

          <div class="preset-row" role="group" aria-label="빠른 기간 선택">
            <button type="button" class="chip-btn" data-preset="1w" aria-pressed="${state.historyPreset === "1w"}">1주</button>
            <button type="button" class="chip-btn" data-preset="1m" aria-pressed="${state.historyPreset === "1m"}">1개월</button>
            <button type="button" class="chip-btn" data-preset="3m" aria-pressed="${state.historyPreset === "3m"}">3개월</button>
          </div>

          <form id="historyRangeForm" novalidate>
            <div class="date-form-grid">
              <div class="field-group">
                <label class="field-label" for="histStartInput">시작일</label>
                <input type="date" id="histStartInput" class="text-input tabular" value="${state.historyStart}" aria-invalid="${Boolean(state.historyError)}" aria-describedby="historyRangeErr"/>
              </div>
              <div class="field-group">
                <label class="field-label" for="histEndInput">종료일 (최대 어제)</label>
                <input type="date" id="histEndInput" class="text-input tabular" value="${state.historyEnd}" aria-invalid="${Boolean(state.historyError)}" aria-describedby="historyRangeErr"/>
              </div>
            </div>
            <div style="margin-top:10px; display:flex; justify-content:flex-end;">
              <button type="submit" class="primary-btn">기간 조회</button>
            </div>
            ${state.historyError ? `<div id="historyRangeErr" class="field-error" role="alert">${state.historyError}</div>` : `<div id="historyRangeErr" class="sr-only"></div>`}
          </form>

          <div style="margin-top:14px;">
            ${chartBlock}
          </div>
        </article>
      `;

      // Bind preset buttons
      el.querySelectorAll("[data-preset]").forEach(btn => {
        btn.onclick = () => {
          const p = btn.dataset.preset;
          const endDt = new Date(`${YESTERDAY_STR}T00:00:00+09:00`);
          const daysBack = p === "1w" ? 6 : p === "1m" ? 29 : 89;
          const startDt = new Date(endDt.getTime() - daysBack * 86400000);
          state.historyPreset = p;
          state.historyStart = startDt.toISOString().slice(0, 10);
          state.historyEnd = YESTERDAY_STR;
          state.historyError = "";
          renderHistory();
          announce(`${btn.textContent} 과거 날씨 그래프를 불러왔습니다.`);
        };
      });

      // Bind custom range validation (FR-006, TEST-007)
      document.getElementById("historyRangeForm").onsubmit = (e) => {
        e.preventDefault();
        const sVal = document.getElementById("histStartInput").value;
        const eVal = document.getElementById("histEndInput").value;
        state.historyStart = sVal;
        state.historyEnd = eVal;
        state.historyPreset = "custom";

        if (!sVal || !eVal) {
          state.historyError = "시작일과 종료일을 모두 입력해 주세요.";
        } else if (eVal > YESTERDAY_STR) {
          state.historyError = `종료일은 어제(${YESTERDAY_STR})까지만 선택할 수 있습니다. (ASOS 일자료는 전날까지 제공)`;
        } else if (sVal > eVal) {
          state.historyError = "시작일은 종료일보다 같거나 이전이어야 합니다.";
        } else {
          const days = Math.round((new Date(eVal) - new Date(sVal)) / 86400000) + 1;
          if (days > 366) {
            state.historyError = `선택한 기간이 ${days}일입니다. 기간 조회는 최대 366일까지 가능합니다.`;
          } else {
            state.historyError = "";
          }
        }
        renderHistory();
        if (state.historyError) announce(state.historyError);
      };

      // Bind chart & list date detail sheet
      el.querySelectorAll("[data-history-date]").forEach(node => {
        const openDetail = () => {
          const dateStr = node.dataset.historyDate;
          const row = series.find(r => r.date === dateStr);
          if (row) openDateDetailSheet(region, row, node);
        };
        node.onclick = openDetail;
        node.onkeydown = (ev) => {
          if (ev.key === "Enter" || ev.key === " ") {
            ev.preventDefault();
            openDetail();
          }
        };
      });
    }

    function openDateDetailSheet(region, row, triggerEl) {
      const bodyHtml = `
        <p style="margin:0; font-size:0.86em; color:var(--text-secondary);" class="tabular">
          ASOS ${region.asosName}(${region.asosId}) 관측소 · 거리 약 ${region.asosDistKm}km · 일자료(불변 캐시)
        </p>
        <div class="detail-kv-grid tabular">
          <div class="detail-kv"><span class="detail-kv-label">평균기온</span><span class="detail-kv-val">${row.avgTa.toFixed(1)}℃</span></div>
          <div class="detail-kv"><span class="detail-kv-label">일강수량</span><span class="detail-kv-val">${row.sumRn.toFixed(1)}mm</span></div>
          <div class="detail-kv"><span class="detail-kv-label">최고기온</span><span class="detail-kv-val" style="color:var(--temp-warm);">${row.maxTa.toFixed(1)}℃</span></div>
          <div class="detail-kv"><span class="detail-kv-label">최저기온</span><span class="detail-kv-val" style="color:var(--temp-cool);">${row.minTa.toFixed(1)}℃</span></div>
          <div class="detail-kv"><span class="detail-kv-label">평균풍속</span><span class="detail-kv-val">${row.avgWs === null ? "결측 (관측 없음)" : `${row.avgWs.toFixed(1)}m/s`}</span></div>
          <div class="detail-kv"><span class="detail-kv-label">평균습도</span><span class="detail-kv-val">${row.avgRhm}%</span></div>
        </div>
        <div class="sheet-actions">
          <button type="button" class="primary-btn" id="closeDateDetailBtn">확인</button>
        </div>
      `;
      openModal(`${row.date} 관측 상세`, bodyHtml, triggerEl);
      document.getElementById("closeDateDetailBtn").onclick = closeModal;
    }

    /* ==========================================================================
       6. 지역 검색 · 즐겨찾기 탭 렌더링 (FR-007, FR-008, TEST-010)
       ========================================================================== */
    function renderLocations() {
      const el = document.getElementById("locationsContent");
      const q = state.searchQuery;
      const trimmedLen = q.trim().length;

      let searchResultHtml = "";
      if (trimmedLen === 1) {
        searchResultHtml = `<p class="search-hint" role="status">2글자 이상 입력하면 내장 행정구역 격자표에서 즉시 검색합니다.</p>`;
      } else if (trimmedLen >= 2) {
        const matches = REGION_CATALOG.filter(r => r.name.includes(q.trim()) || r.shortName.includes(q.trim()));
        if (matches.length === 0) {
          searchResultHtml = `
            <div style="padding:14px 0; text-align:center;">
              <p style="margin:0 0 8px; font-size:0.88em; color:var(--text-secondary);">'${escapeHtml(q.trim())}'에 해당하는 국내 행정구역이 없습니다.</p>
              <button type="button" class="secondary-btn" id="clearSearchBtn">검색어 지우기</button>
            </div>
          `;
        } else {
          searchResultHtml = `
            <div role="list" aria-label="지역 검색 결과 ${matches.length}건" style="margin-top:8px;">
              ${matches.map(r => {
                const isFav = state.favorites.includes(r.id);
                return `
                  <div class="loc-row" role="listitem">
                    <button type="button" class="loc-row-main" data-select-region="${r.id}">
                      <span class="loc-row-title">${r.name}</span>
                      <span class="loc-row-sub tabular">격자 (${r.nx}, ${r.ny}) · ASOS ${r.asosName} · 현재 ${r.baseTemp.toFixed(1)}°</span>
                    </button>
                    <button type="button" class="secondary-btn" data-toggle-fav="${r.id}" aria-label="${r.shortName} ${isFav ? "즐겨찾기 됨" : "즐겨찾기 추가"}">
                      ${isFav ? "저장됨" : "즐겨찾기 +"}
                    </button>
                  </div>
                `;
              }).join("")}
            </div>
          `;
        }
      } else {
        searchResultHtml = `<p class="search-hint">예: 강남, 부산, 제주, 강릉, 울릉, 백령, 서귀포 (국내 행정구역 2~30자)</p>`;
      }

      const permText = state.scenario === "perm-denied"
        ? "권한 거부 또는 위치 서비스 꺼짐 — 아래 검색으로 선택"
        : "대략적 위치(COARSE) 허용됨 · 원본 위경도 미저장";

      const favRegions = state.favorites
        .map(id => REGION_CATALOG.find(r => r.id === id))
        .filter(Boolean);

      el.innerHTML = `
        <!-- 지역 검색 (FR-008) -->
        <article class="surface-card" aria-label="국내 지역 검색">
          <div class="section-header">
            <h2 class="section-title">지역 검색</h2>
            <span class="section-sub">내장 격자표 오프라인 검색</span>
          </div>
          <label class="sr-only" for="regionSearchInput">시, 군, 구, 읍면동 검색</label>
          <div class="search-box-wrap">
            <input
              type="search"
              id="regionSearchInput"
              class="text-input"
              maxlength="30"
              placeholder="시·군·구·읍면동 입력 (2글자 이상)"
              value="${escapeHtml(state.searchQuery)}"
            />
          </div>
          ${searchResultHtml}
        </article>

        <!-- 현재 위치 행 (FR-007, SEC-001) -->
        <article class="surface-card" aria-label="현재 위치 상태">
          <div class="loc-row" style="padding:0; border:0;">
            <button type="button" class="loc-row-main" id="useCurrentLocBtn">
              <span class="loc-row-title">
                <span>현재 위치 자동 인식</span>
                ${state.isUsingCurrentLocation && state.scenario !== "perm-denied" ? `<span class="primary-pill">사용 중</span>` : ""}
              </span>
              <span class="loc-row-sub">${permText}</span>
            </button>
            <button type="button" class="secondary-btn" id="openPermGuideBtn">권한 안내</button>
          </div>
        </article>

        <!-- 즐겨찾기 목록 (최대 10개 · 대표 지정 · 삭제+Undo — FR-008) -->
        <article class="surface-card" aria-label="즐겨찾기 지역 목록">
          <div class="section-header">
            <h2 class="section-title">즐겨찾기</h2>
            <span class="section-sub tabular">${favRegions.length} / 10개 (별표 = 홈 위젯 대표 위치)</span>
          </div>

          ${favRegions.length === 0 ? `
            <p style="margin:6px 0; font-size:0.86em; color:var(--text-secondary);">저장된 즐겨찾기가 없습니다. 위에서 지역을 검색해 추가해 보세요.</p>
          ` : `
            <div role="list">
              ${favRegions.map(r => {
                const isPrimary = state.primaryRegionId === r.id;
                const isSelected = state.selectedRegionId === r.id && !state.isUsingCurrentLocation;
                return `
                  <div class="loc-row" role="listitem">
                    <button type="button" class="loc-row-main" data-select-region="${r.id}">
                      <span class="loc-row-title">
                        <span>${r.shortName}</span>
                        ${isPrimary ? `<span class="primary-pill">대표 위치</span>` : ""}
                        ${isSelected ? `<span class="section-sub">(표시 중)</span>` : ""}
                      </span>
                      <span class="loc-row-sub tabular">${r.name} · ${r.baseTemp.toFixed(1)}° (${skyLabel(r.sky)})</span>
                    </button>
                    <div class="loc-row-actions">
                      <button
                        type="button"
                        class="icon-btn"
                        data-set-primary="${r.id}"
                        aria-label="${r.shortName} 대표 위치로 지정"
                        aria-pressed="${isPrimary}"
                        title="대표 위치 지정"
                      >
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="${isPrimary ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" aria-hidden="true">
                          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                      </button>
                      <button
                        type="button"
                        class="icon-btn danger"
                        data-delete-fav="${r.id}"
                        aria-label="${r.shortName} 즐겨찾기 삭제"
                        title="즐겨찾기 삭제"
                      >
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
                        </svg>
                      </button>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          `}
        </article>
      `;

      // Search binding without losing focus
      const searchInput = document.getElementById("regionSearchInput");
      searchInput.oninput = (e) => {
        const pos = e.target.selectionStart;
        state.searchQuery = e.target.value;
        renderLocations();
        const fresh = document.getElementById("regionSearchInput");
        fresh.focus();
        fresh.setSelectionRange(pos, pos);
      };

      const clearBtn = document.getElementById("clearSearchBtn");
      if (clearBtn) {
        clearBtn.onclick = () => {
          state.searchQuery = "";
          renderLocations();
          document.getElementById("regionSearchInput").focus();
        };
      }

      document.getElementById("openPermGuideBtn").onclick = (e) => openPermissionModal(e.currentTarget);

      document.getElementById("useCurrentLocBtn").onclick = () => {
        if (state.scenario === "perm-denied") {
          openPermissionModal(document.getElementById("useCurrentLocBtn"));
          return;
        }
        state.selectedRegionId = "seoul-jongno";
        state.isUsingCurrentLocation = true;
        switchTab("home");
        showSnackbar("현재 위치(서울 종로구) 날씨로 전환했습니다.");
      };

      el.querySelectorAll("[data-select-region]").forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.selectRegion;
          if (state.scenario === "longest") state.scenario = "normal";
          state.selectedRegionId = id;
          state.isUsingCurrentLocation = false;
          switchTab("home");
          const r = REGION_CATALOG.find(x => x.id === id);
          if (r) showSnackbar(`${r.shortName} 날씨로 전환했습니다.`);
        };
      });

      el.querySelectorAll("[data-toggle-fav]").forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.toggleFav;
          const r = REGION_CATALOG.find(x => x.id === id);
          if (state.favorites.includes(id)) {
            showSnackbar(`${r.shortName}은(는) 이미 즐겨찾기에 저장되어 있습니다.`);
            return;
          }
          if (state.favorites.length >= 10) {
            showSnackbar("즐겨찾기는 최대 10개까지 저장할 수 있습니다. 기존 지역 삭제 후 추가해 주세요.");
            announce("즐겨찾기 최대 10개 한도에 도달했습니다.");
            return;
          }
          state.favorites.push(id);
          renderLocations();
          showSnackbar(`${r.shortName}을(를) 즐겨찾기에 추가했습니다. (${state.favorites.length}/10)`);
        };
      });

      el.querySelectorAll("[data-set-primary]").forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.setPrimary;
          state.primaryRegionId = id;
          const r = REGION_CATALOG.find(x => x.id === id);
          renderLocations();
          showSnackbar(`${r.shortName}을(를) 대표 위치(위젯 기준)로 지정했습니다.`);
        };
      });

      el.querySelectorAll("[data-delete-fav]").forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.deleteFav;
          const idx = state.favorites.indexOf(id);
          if (idx === -1) return;
          const r = REGION_CATALOG.find(x => x.id === id);
          const wasPrimary = state.primaryRegionId === id;
          state.favorites.splice(idx, 1);
          if (wasPrimary && state.favorites.length > 0) {
            state.primaryRegionId = state.favorites[0];
          }
          state.lastDeletedFavorite = { id, index: idx, wasPrimary };
          renderLocations();
          showSnackbar(`${r.shortName}을(를) 즐겨찾기에서 삭제했습니다.`, "되돌리기", () => {
            if (!state.lastDeletedFavorite) return;
            const d = state.lastDeletedFavorite;
            state.favorites.splice(d.index, 0, d.id);
            if (d.wasPrimary) state.primaryRegionId = d.id;
            state.lastDeletedFavorite = null;
            renderLocations();
            announce(`${r.shortName} 즐겨찾기를 복구했습니다.`);
          });
        };
      });
    }
