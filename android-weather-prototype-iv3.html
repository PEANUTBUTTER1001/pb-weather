    }

    /* ==========================================================================
       8. 모달 / 시트 (권한 안내 · 캐시 삭제 확인 · 위젯 미리보기)
       ========================================================================== */
    function openModal(title, bodyHtml, triggerEl = null) {
      lastFocusedElement = triggerEl || document.activeElement;
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = bodyHtml;
      const backdrop = document.getElementById("modalBackdrop");
      backdrop.classList.add("open");
      backdrop.setAttribute("aria-hidden", "false");
      document.getElementById("modalDialog").focus();
    }

    function closeModal() {
      const backdrop = document.getElementById("modalBackdrop");
      if (!backdrop.classList.contains("open")) return;
      backdrop.classList.remove("open");
      backdrop.setAttribute("aria-hidden", "true");
      if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
        lastFocusedElement.focus();
      }
      lastFocusedElement = null;
    }

    function openPermissionModal(triggerEl) {
      const bodyHtml = `
        <p style="margin:0; font-size:0.9em; line-height:1.55;">
          현재 계신 지역의 날씨와 근접 미세먼지 측정소를 찾기 위해 <strong>대략적 위치 권한(ACCESS_COARSE_LOCATION)</strong>을 사용합니다.
        </p>
        <ul style="margin:0; padding-left:18px; font-size:0.84em; color:var(--text-secondary); line-height:1.55;">
          <li>정밀 위치(GPS) 및 백그라운드 위치는 요청하지 않습니다.</li>
          <li>기상청 5km 격자(nx, ny)와 관측소 변환에만 사용하며 원본 위경도는 저장·전송하지 않습니다.</li>
          <li>거부해도 국내 행정구역 검색으로 모든 기능을 정상 이용할 수 있습니다.</li>
        </ul>
        <div class="sheet-actions">
          <button type="button" class="secondary-btn" id="permDenyBtn">거부 · 지역 검색</button>
          <button type="button" class="primary-btn" id="permAllowBtn">대략적 위치 허용</button>
        </div>
      `;
      openModal("위치 사용 목적 안내", bodyHtml, triggerEl);
      document.getElementById("permAllowBtn").onclick = () => {
        state.permissionStatus = "granted";
        state.isUsingCurrentLocation = true;
        if (state.scenario === "perm-denied") state.scenario = "normal";
        closeModal();
        renderAll();
        showSnackbar("대략적 위치 권한이 허용되어 현재 위치 날씨를 표시합니다.");
      };
      document.getElementById("permDenyBtn").onclick = () => {
        state.permissionStatus = "denied";
        state.isUsingCurrentLocation = false;
        state.scenario = "perm-denied";
        closeModal();
        switchTab("locations");
        showSnackbar("위치 권한 없이 지역 검색으로 계속합니다.");
      };
    }

    function openCacheClearConfirm(triggerEl) {
      const bodyHtml = `
        <p style="margin:0; font-size:0.9em; line-height:1.55;">
          기기에 저장된 날씨 스냅샷과 과거 관측 캐시(<strong>${state.cacheSizeMb.toFixed(1)} MB</strong>)를 모두 삭제하시겠습니까? 즐겨찾기 지역과 대표 위치 설정은 유지됩니다.
        </p>
        <div class="sheet-actions">
          <button type="button" class="secondary-btn" id="cancelClearCacheBtn">취소</button>
          <button type="button" class="destructive-btn solid" id="confirmClearCacheBtn">캐시 삭제</button>
        </div>
      `;
      openModal("로컬 캐시 삭제 확인", bodyHtml, triggerEl);
      document.getElementById("cancelClearCacheBtn").onclick = closeModal;
      document.getElementById("confirmClearCacheBtn").onclick = () => {
        const clearedMb = state.cacheSizeMb.toFixed(1);
        state.cacheSizeMb = 0.0;
        closeModal();
        renderInfo();
        announce(`로컬 날씨 캐시 ${clearedMb}MB를 삭제했습니다. 즐겨찾기는 보존되었습니다.`);
        showSnackbar(`로컬 캐시(${clearedMb}MB)를 삭제했습니다. 즐겨찾기는 유지됩니다.`);
      };
    }

    function openWidgetModal(triggerEl) {
      const primary = getPrimaryRegion();
      const bodyHtml = `
        <p style="margin:0; font-size:0.84em; color:var(--text-secondary);">
          안드로이드 홈 화면에 배치되는 Jetpack Glance 위젯 미리보기입니다. 위젯을 탭하면 앱 홈으로 이동합니다.
        </p>
        <div class="android-wallpaper-mock">
          <button type="button" class="glance-widget" id="tapGlanceWidgetBtn" aria-label="${primary.shortName} 홈 위젯, 현재 ${primary.baseTemp}도 ${skyLabel(primary.sky)}, 최고 ${primary.hi}도 최저 ${primary.lo}도, 눌러서 앱 홈 열기">
            <div class="glance-top">
              <div>
                <div style="font-size:0.86em; font-weight:700;">${primary.shortName}</div>
                <div class="glance-temp tabular">${primary.baseTemp.toFixed(1)}°</div>
                <div style="font-size:0.82em; color:var(--text-secondary); margin-top:4px;" class="tabular">
                  ${skyLabel(primary.sky)} · 최고 ${primary.hi.toFixed(0)}° / 최저 ${primary.lo.toFixed(0)}°
                </div>
              </div>
              <div>${weatherIconSvg(primary.sky, 48)}</div>
            </div>
            <div class="glance-meta tabular">
              <span id="widgetStatusSpan">${state.widgetStatusNote}</span>
              <span>갱신 ${state.widgetLastUpdated}</span>
            </div>
          </button>
        </div>
        <div class="sheet-actions">
          <button type="button" class="secondary-btn" id="simWidgetFailBtn">갱신 실패 테스트</button>
          <button type="button" class="primary-btn" id="simWidgetRefreshBtn">지금 위젯 갱신</button>
        </div>
      `;
      openModal("홈 화면 위젯 미리보기 (FR-009)", bodyHtml, triggerEl);

      document.getElementById("tapGlanceWidgetBtn").onclick = () => {
        closeModal();
        state.selectedRegionId = primary.id;
        switchTab("home");
        showSnackbar(`위젯에서 ${primary.shortName} 홈 화면을 열었습니다.`);
      };
      document.getElementById("simWidgetFailBtn").onclick = () => {
        state.widgetStatusNote = "갱신 실패 · 마지막 성공 값 유지";
        document.getElementById("widgetStatusSpan").textContent = state.widgetStatusNote;
        announce("위젯 갱신에 실패하여 마지막 성공 값과 시각을 유지합니다.");
      };
      document.getElementById("simWidgetRefreshBtn").onclick = () => {
        state.widgetLastUpdated = "20:47";
        state.widgetStatusNote = "WorkManager 60분 주기 · 방금 갱신됨";
        openWidgetModal(triggerEl);
        announce("위젯을 최신 날씨로 갱신했습니다.");
      };
    }

    /* ==========================================================================
       9. 내비게이션 · 테마 · 시뮬레이터 상태 제어
       ========================================================================== */
    function switchTab(tabId) {
      state.activeTab = tabId;
      document.querySelectorAll(".tab-panel").forEach(p => {
        p.classList.toggle("active", p.id === `tab-${tabId}`);
      });
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.setAttribute("aria-current", btn.dataset.tab === tabId ? "page" : "false");
      });
      document.getElementById("appMain").scrollTop = 0;
      renderTopbar();
    }

    function setTheme(theme) {
      state.theme = theme;
      document.documentElement.setAttribute("data-theme", theme);
      renderInfo();
      syncSimulatorButtons();
    }

    function setScenario(scenario) {
      state.scenario = scenario;
      state.quotaExceeded = (scenario === "partial-fail");
      state.sectionErrors.midForecast = (scenario === "partial-fail");
      state.sectionErrors.airQualityFallback = (scenario === "partial-fail");
      state.sectionErrors.airQualityHardFail = false;

      if (scenario === "offline-cached") {
        state.lastUpdatedMinutesAgo = 14;
      } else if (scenario === "normal") {
        state.lastUpdatedMinutesAgo = 1;
        state.permissionStatus = "granted";
      } else if (scenario === "perm-denied") {
        state.permissionStatus = "denied";
      }
      renderAll();
    }

    function syncSimulatorButtons() {
      document.querySelectorAll("[data-scenario]").forEach(btn => {
        btn.setAttribute("aria-pressed", String(btn.dataset.scenario === state.scenario));
      });
      document.querySelectorAll("[data-theme-pick]").forEach(btn => {
        btn.setAttribute("aria-pressed", String(btn.dataset.themePick === state.theme));
      });
      document.querySelectorAll("[data-width]").forEach(btn => {
        btn.setAttribute("aria-pressed", String(Number(btn.dataset.width) === state.widthPreset));
      });
      document.getElementById("simLeapBtn").setAttribute("aria-pressed", String(state.leapYearDemo));
      document.getElementById("simScale200Btn").setAttribute("aria-pressed", String(state.scale200));
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[ch]));
    }

    /* ==========================================================================
       10. 초기 이벤트 바인딩
       ========================================================================== */
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.onclick = () => switchTab(btn.dataset.tab);
    });

    document.getElementById("topbarLocationBtn").onclick = () => switchTab("locations");

    document.getElementById("refreshBtn").onclick = () => {
      if (state.scenario === "offline-cached" || state.scenario === "empty") {
        showSnackbar("오프라인 상태입니다. 네트워크 연결 후 다시 시도해 주세요.");
        return;
      }
      const prev = state.scenario;
      state.scenario = "refreshing";
      renderTopbar();
      announce("날씨 자료를 갱신하는 중입니다.");
      setTimeout(() => {
        state.scenario = prev === "refreshing" ? "normal" : prev;
        state.lastUpdatedMinutesAgo = 0;
        renderAll();
        showSnackbar("최신 기상청·에어코리아 자료로 갱신했습니다.");
      }, 650);
    };

    // Modal close handlers (Esc + backdrop click + X button)
    document.getElementById("modalCloseBtn").onclick = closeModal;
    document.getElementById("modalBackdrop").onclick = (e) => {
      if (e.target === e.currentTarget) closeModal();
    };
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    // Simulator controls
    document.querySelectorAll("[data-scenario]").forEach(btn => {
      btn.onclick = () => {
        setScenario(btn.dataset.scenario);
        if (btn.dataset.scenario !== "perm-denied" && state.activeTab !== "home") {
          switchTab("home");
        }
      };
    });

    document.querySelectorAll("[data-theme-pick]").forEach(btn => {
      btn.onclick = () => setTheme(btn.dataset.themePick);
    });

    document.querySelectorAll("[data-width]").forEach(btn => {
      btn.onclick = () => {
        const w = Number(btn.dataset.width);
        state.widthPreset = w;
        document.documentElement.style.setProperty("--app-max-width", `${w}px`);
        document.getElementById("appShell").classList.toggle("narrow-320", w <= 320);
        syncSimulatorButtons();
      };
    });

    document.getElementById("simScale200Btn").onclick = () => {
      state.scale200 = !state.scale200;
      document.getElementById("appShell").classList.toggle("scale-200", state.scale200);
      syncSimulatorButtons();
    };

    document.getElementById("simLeapBtn").onclick = () => {
      state.leapYearDemo = !state.leapYearDemo;
      renderAll();
      if (state.leapYearDemo) {
        switchTab("history");
        showSnackbar("윤년 2/29 비교 모드를 켰습니다. 작년 2/28 대체 표기를 확인하세요.");
      }
    };

    document.getElementById("simPermModalBtn").onclick = (e) => openPermissionModal(e.currentTarget);
    document.getElementById("simWidgetBtn").onclick = (e) => openWidgetModal(e.currentTarget);

    // Narrow mobile defaults: collapse simulator drawer so app UI appears unobstructed immediately
    if (window.matchMedia("(max-width: 899px)").matches) {
      document.getElementById("simDrawer").open = false;
    }

    // Initial render
    renderAll();
  </script>
</body>
</html>
