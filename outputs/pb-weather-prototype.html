    /* ==========================================================================
       2. 기본 리셋 · 타이포 · 접근성 하한 (P8, P13, P14, A4, A5)
       ========================================================================== */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--stage-bg);
      color: var(--stage-text);
      font-family: "Pretendard Variable", "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .tabular { font-variant-numeric: tabular-nums; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.48; }
    :focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       3. 외부 검수용 상태 시뮬레이터 (본 서비스 화면과 완전 분리)
       ========================================================================== */
    .prototype-stage {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 24px;
      padding: 20px 16px;
    }

    .sim-drawer {
      width: 324px;
      flex: 0 0 324px;
      background: var(--stage-panel);
      border: 1px solid var(--stage-border);
      border-radius: 16px;
      padding: 16px;
      position: sticky;
      top: 20px;
      max-height: calc(100dvh - 40px);
      overflow-y: auto;
      font-size: 13px;
    }

    .sim-drawer summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      min-height: 40px;
    }
    .sim-drawer summary::-webkit-details-marker { display: none; }

    .sim-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--accent-soft);
      color: var(--accent-on-soft);
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    html[data-theme="high-contrast"] .sim-badge { border-color: var(--accent-primary); }

    .sim-group { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--stage-border); }
    .sim-group-title { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; color: var(--stage-muted); margin: 0 0 8px 0; }
    .sim-btn-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
    .sim-btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .sim-btn {
      min-height: 34px;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--stage-border);
      background: transparent;
      color: var(--stage-text);
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      transition: background var(--motion-fast), border-color var(--motion-fast);
    }
    .sim-btn:hover { background: var(--bg-tonal); }
    .sim-btn[aria-pressed="true"] {
      background: var(--accent-primary);
      color: var(--text-on-accent);
      border-color: var(--accent-primary);
    }
    .sim-swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: -1px;
      border: 1px solid rgba(15, 23, 42, 0.2);
    }
    .sim-note { margin: 8px 0 0; font-size: 12px; color: var(--stage-muted); line-height: 1.45; }

    /* ==========================================================================
       4. 안드로이드 앱 셸 (Material 3 Compact Viewport — P13 글씨 크기 상속)
       ========================================================================== */
    .device-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: var(--app-max-width);
      min-width: 0;
      transition: max-width var(--motion-med);
    }

    .app-shell {
      width: 100%;
      min-height: 780px;
      height: min(860px, calc(100dvh - 40px));
      background: var(--bg-ground);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 28px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.14);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      font-size: calc(15px * var(--app-font-scale));
    }
    html[data-theme="high-contrast"] .app-shell { border: 2px solid #ffffff; box-shadow: none; }

    /* 글씨 크기 단계 (설정 화면 + 시뮬레이터 200% — 시트/문서 창까지 동일 상속 P13) */
    .app-shell.font-lg { --app-font-scale: 1.18; }
    .app-shell.font-xl { --app-font-scale: 1.42; }
    .app-shell.scale-200 { --app-font-scale: 1.75; }

    .app-shell.scale-200 .hero-temp { font-size: 2.95rem; }
    .app-shell.scale-200 .hero-metrics { grid-template-columns: 1fr; gap: 10px; }
    .app-shell.narrow-320 .hero-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .app-shell.scale-200 .hero-air-grid-btn,
    .app-shell.narrow-320 .hero-air-grid-btn,
    .app-shell.scale-200 .detail-kv-grid,
    .app-shell.scale-200 .date-form-grid,
    .app-shell.narrow-320 .date-form-grid { grid-template-columns: 1fr; }
    .app-shell.scale-200 .history-day-btn,
    .app-shell.narrow-320 .history-day-btn { grid-template-columns: 1fr; gap: 4px; }
    .app-shell.scale-200 .loc-row { flex-wrap: wrap; }

    @media (max-width: 899px) {
      .prototype-stage { flex-direction: column; align-items: stretch; gap: 0; padding: 0; }
      .sim-drawer {
        width: 100%; flex: none; position: static; max-height: none;
        border-radius: 0; border-left: 0; border-right: 0; border-top: 0; padding: 6px 12px;
      }
      .device-column { max-width: 100%; }
      .app-shell { min-height: calc(100dvh - 54px); height: auto; border-radius: 0; border: 0; box-shadow: none; }
    }

    /* 상단 앱바 (P8 정렬선 · P12 이어지는 배경 · P4/§3 도움말 ? 진입점) */
    .app-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 8px var(--page-gutter);
      background: var(--hero-active-start, var(--bg-hero-start));
      position: relative;
      z-index: 4;
      flex-shrink: 0;
      min-height: 58px;
      transition: background var(--motion-med);
    }
    .app-topbar.solid-bar {
      background: var(--bg-ground);
      border-bottom: 1px solid var(--border-subtle);
    }

    .topbar-page-title {
      font-size: 1.12em;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
      line-height: 1.3;
    }

    .loc-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      min-width: 0;
      flex: 1;
      padding: 4px 8px 4px 0;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      text-align: left;
    }
    .loc-trigger:hover { background: var(--bg-tonal); }
    .loc-trigger svg { flex-shrink: 0; }
    .loc-title-wrap { display: flex; flex-direction: column; min-width: 0; }
    .loc-name {
      font-size: 1.02em;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .loc-meta { font-size: 0.76em; color: var(--text-secondary); line-height: 1.3; }

    .topbar-actions {
      display: inline-flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      margin-right: -12px; /* P8: 아이콘 끝을 페이지 정렬선에 일치 (44-20)/2 = 12px */
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--text-primary);
      transition: background var(--motion-fast);
    }
    .icon-btn:hover { background: var(--bg-tonal); }
    html[data-theme="high-contrast"] .icon-btn { border-color: var(--border-subtle); }

    /* P8: 행 끝 아이콘 버튼의 시각적 끝을 구분선 끝에 일치 */
    .edge-icon-group {
      display: inline-flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      margin-right: -12px;
    }

    .refresh-progress { height: 3px; width: 100%; background: var(--bg-tonal); overflow: hidden; flex-shrink: 0; display: none; }
    .refresh-progress.active { display: block; }
    .refresh-progress-bar { height: 100%; width: 42%; background: var(--accent-primary); animation: indeterminate 1.2s ease-in-out infinite; }
    @keyframes indeterminate { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }

    .app-main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 20px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* 상태 배너 */
    .status-banner {
      margin: 8px var(--page-gutter) 0;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--status-warn-border);
      background: var(--status-warn-bg);
      color: var(--status-warn-fg);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.84em;
      line-height: 1.45;
    }
    .status-banner.error { border-color: var(--status-err-border); background: var(--status-err-bg); color: var(--status-err-fg); }
    .status-banner-body { display: flex; gap: 8px; align-items: flex-start; min-width: 0; flex: 1; }

    .inline-action-btn {
      min-height: 36px;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      font-size: 0.84em;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .meta-trigger-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      padding: 3px 6px 3px 0;
      min-height: 32px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-tertiary);
      font-size: 0.76em;
      text-align: left;
      line-height: 1.35;
    }
    .meta-trigger-btn:hover { color: var(--accent-primary); }

    .stale-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: var(--radius-pill);
      background: var(--status-warn-bg);
      color: var(--status-warn-fg);
      border: 1px solid var(--status-warn-border);
      font-size: 0.9em;
      font-weight: 700;
    }

    /* ==========================================================================
       5. 홈 탭 — Hero (C안 배경 + 미세먼지 1안 통합) · 구분선 기반 섹션
       ========================================================================== */
    .hero-stage {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, var(--hero-active-start, var(--bg-hero-start)) 0%, var(--bg-hero-end) 100%);
      padding: 8px var(--page-gutter) 16px;
      isolation: isolate;
    }
    .hero-stage.sky-clear  { --hero-active-start: var(--hero-clear-start); }
    .hero-stage.sky-partly { --hero-active-start: var(--hero-partly-start); }
    .hero-stage.sky-cloudy { --hero-active-start: var(--hero-cloudy-start); }
    .hero-stage.sky-rain   { --hero-active-start: var(--hero-rain-start); }
    .hero-stage.sky-sleet  { --hero-active-start: var(--hero-sleet-start); }

    .hero-content { position: relative; z-index: 2; }
    .hero-ambient { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .hero-scrim {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(180deg, var(--hero-scrim-top) 0%, var(--hero-scrim-bottom) 92%);
    }
    html[data-theme="high-contrast"] .hero-ambient,
    html[data-theme="high-contrast"] .hero-scrim { display: none !important; }

    /* A안 / B안 비교용 대기 레이어 & C안 Canvas */
    .amb-sun-halo {
      position: absolute; top: -46px; right: -32px; width: 210px; height: 210px; border-radius: 50%;
      background: radial-gradient(circle, var(--hero-sun-core) 0%, var(--hero-sun-halo) 48%, transparent 74%);
      filter: blur(18px); animation: ambSunPulse 9s ease-in-out infinite;
    }
    .amb-sun-beam {
      position: absolute; top: -30px; right: 12px; width: 150px; height: 220px;
      background: linear-gradient(205deg, var(--hero-sun-halo) 0%, transparent 72%);
      transform: rotate(18deg); filter: blur(20px); animation: ambBeamSway 12s ease-in-out infinite;
    }
    .amb-cloud { position: absolute; border-radius: 999px; background: var(--hero-cloud-fill); filter: blur(16px); }
    .amb-cloud.dim { background: var(--hero-cloud-dim); }
    .amb-cloud.c1 { top: 10px; left: -18%; width: 200px; height: 62px; animation: ambCloudDriftA 22s ease-in-out infinite alternate; }
    .amb-cloud.c2 { top: 52px; right: -14%; width: 230px; height: 70px; opacity: 0.85; animation: ambCloudDriftB 28s ease-in-out infinite alternate; }
    .amb-cloud.c3 { top: 98px; left: 8%; width: 260px; height: 64px; opacity: 0.72; animation: ambCloudDriftA 32s ease-in-out infinite alternate-reverse; }
    .amb-rain-drop {
      position: absolute; top: -28px; width: 2px; height: 28px; border-radius: 999px;
      background: linear-gradient(180deg, transparent 0%, var(--hero-rain-streak) 100%);
      filter: blur(0.6px); transform: rotate(12deg);
      animation: ambRainFall var(--dur, 1.8s) linear var(--delay, 0s) infinite;
    }
    .amb-snow-dot {
      position: absolute; top: -14px; width: var(--sz, 6px); height: var(--sz, 6px); border-radius: 50%;
      background: var(--hero-snow-dot); filter: blur(1.4px);
      animation: ambSnowFall var(--dur, 4.4s) ease-in-out var(--delay, 0s) infinite;
    }
    .hero-ambient.mode-b * { animation: none !important; }
    .hero-ambient.mode-b .amb-rain-drop { top: var(--static-y, 32%); opacity: 0.55; }
    .hero-ambient.mode-b .amb-snow-dot { top: var(--static-y, 36%); opacity: 0.6; }
    .hero-particle-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    @keyframes ambSunPulse { 0%, 100% { transform: scale(1); opacity: 0.86; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes ambBeamSway { 0%, 100% { transform: rotate(16deg) translateX(0); opacity: 0.55; } 50% { transform: rotate(22deg) translateX(-10px); opacity: 0.82; } }
    @keyframes ambCloudDriftA { 0% { transform: translateX(0); } 100% { transform: translateX(46px); } }
    @keyframes ambCloudDriftB { 0% { transform: translateX(0); } 100% { transform: translateX(-52px); } }
    @keyframes ambRainFall { 0% { transform: translate3d(12px, -30px, 0) rotate(12deg); opacity: 0; } 15% { opacity: 0.85; } 85% { opacity: 0.7; } 100% { transform: translate3d(-24px, 260px, 0) rotate(12deg); opacity: 0; } }
    @keyframes ambSnowFall { 0% { transform: translate3d(0, -16px, 0); opacity: 0; } 20% { opacity: 0.85; } 50% { transform: translate3d(14px, 120px, 0); opacity: 0.8; } 100% { transform: translate3d(-10px, 250px, 0); opacity: 0; } }

    .hero-primary-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .hero-temp-block { display: flex; flex-direction: column; gap: 4px; }
    .hero-temp { font-size: 4.1rem; font-weight: 300; line-height: 0.96; letter-spacing: -0.04em; color: var(--text-primary); margin: 0; }
    .hero-sky-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.95em; font-weight: 600; color: var(--text-primary); }
    .hero-hilo { color: var(--text-secondary); font-weight: 500; }
    .hero-sky-note { font-size: 0.75em; color: var(--text-tertiary); font-weight: 500; }
    .hero-icon-wrap { width: 74px; height: 74px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .hero-metrics {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 12px;
    }
    .hero-metric-item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .hero-metric-btn {
      display: flex; flex-direction: column; gap: 2px; min-width: 0;
      padding: 4px 6px; margin: -4px -6px; border: 0; border-radius: var(--radius-sm);
      background: transparent; text-align: left; transition: background var(--motion-fast);
    }
    .hero-metric-btn:hover { background: var(--bg-tonal); }
    .hero-metric-label { font-size: 0.77em; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 4px; }
    .hero-metric-value { font-size: 0.94em; font-weight: 700; color: var(--text-primary); }
    .hero-metric-value.muted-val { color: var(--text-secondary); font-weight: 600; font-size: 0.86em; }

    .hero-release-row { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }

    /* 미세먼지 히어로 하단 통합 1안 (확정) */
    .hero-air-band {
      margin-top: 10px;
      padding-top: 11px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hero-air-grid-btn {
      border: 0;
      padding: 6px 8px;
      margin: -4px -8px 0;
      width: calc(100% + 16px);
      border-radius: var(--radius-md);
      background: transparent;
      text-align: left;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 14px;
      transition: background var(--motion-fast);
    }
    .hero-air-grid-btn:hover { background: var(--bg-tonal); }
    .hero-air-col { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .hero-air-col-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
    .hero-air-val { font-size: 1.15em; font-weight: 700; line-height: 1.2; color: var(--text-primary); }
    .hero-air-meta-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
    .hero-air-cue-btn {
      border: 0; background: transparent; padding: 4px 0; min-height: 32px;
      font-size: 0.78em; font-weight: 700; color: var(--accent-primary);
      display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0;
    }
    .hero-air-cue-btn:hover { text-decoration: underline; }

    .air-label { font-size: 0.8em; font-weight: 600; color: var(--text-secondary); }
    .air-unit { font-size: 0.62em; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }
    .grade-chip {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px;
      border-radius: var(--radius-pill); font-size: 0.74em; font-weight: 700; border: 1px solid transparent;
    }
    .grade-chip.good { background: var(--grade-good-bg); color: var(--grade-good-fg); }
    .grade-chip.mod  { background: var(--grade-mod-bg);  color: var(--grade-mod-fg); }
    .grade-chip.bad  { background: var(--grade-bad-bg);  color: var(--grade-bad-fg); }
    .grade-chip.vbad { background: var(--grade-vbad-bg); color: var(--grade-vbad-fg); }
    .grade-chip.none { background: var(--bg-tonal); color: var(--text-secondary); }
    html[data-theme="high-contrast"] .grade-chip { border-color: currentColor; }

    .air-fallback-note {
      color: var(--status-warn-fg); background: var(--status-warn-bg); border: 1px solid var(--status-warn-border);
      padding: 6px 10px; border-radius: var(--radius-sm); font-size: 0.78em; font-weight: 600; margin-bottom: 4px;
    }

    /* 홈 본문 섹션 (P6 상자 남발 절제 · 구분선 정렬 P8) */
    .section-stack { display: flex; flex-direction: column; gap: 14px; padding: 6px var(--page-gutter) 12px; }

    .compare-strip {
      width: 100%; border: 1px solid var(--border-subtle); background: var(--bg-surface);
      border-radius: var(--radius-lg); padding: 14px 16px; box-shadow: var(--shadow-card);
      text-align: left; display: flex; flex-direction: column; gap: 7px; transition: border-color var(--motion-fast);
    }
    .compare-strip:hover { border-color: var(--accent-primary); }
    .compare-strip-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .compare-kicker { font-size: 0.78em; font-weight: 700; color: var(--accent-primary); }
    .compare-headline { font-size: 0.96em; font-weight: 700; color: var(--text-primary); line-height: 1.4; }
    .compare-deltas { display: flex; flex-wrap: wrap; gap: 8px; }
    .delta-pill {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px;
      border-radius: var(--radius-pill); background: var(--bg-tonal); font-size: 0.8em; font-weight: 600; color: var(--text-primary);
    }
    .delta-pill.warm { color: var(--temp-warm); }
    .delta-pill.cool { color: var(--temp-cool); }
    html[data-theme="high-contrast"] .delta-pill { border: 1px solid var(--border-subtle); }
    .compare-station-meta { font-size: 0.76em; color: var(--text-tertiary); }

    .surface-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 15px 16px;
      box-shadow: var(--shadow-card);
    }
    html[data-theme="high-contrast"] .surface-card,
    html[data-theme="high-contrast"] .compare-strip { border-width: 2px; }

    .section-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .section-title { font-size: 0.95em; font-weight: 700; margin: 0; color: var(--text-primary); }
    .section-sub { font-size: 0.77em; color: var(--text-tertiary); }

    /* ENH-004 예보 한 줄 요약 */
    .hourly-summary-line {
      margin: 0 0 10px; padding: 8px 10px; border-radius: var(--radius-sm);
      background: var(--bg-tonal); color: var(--text-primary); font-size: 0.83em; font-weight: 600; line-height: 1.45;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .hourly-summary-btn { width: 100%; border: 0; text-align: left; transition: background var(--motion-fast); }
    .hourly-summary-btn:hover { background: var(--bg-tonal-strong); }

    /* 시간별 예보 */
    .hourly-controls { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .scroll-mini-btn {
      width: 32px; height: 32px; border-radius: var(--radius-pill); border: 1px solid var(--border-subtle);
      background: var(--bg-tonal); color: var(--text-primary); display: inline-flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .hourly-viewport { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; scrollbar-width: thin; }
    .hourly-canvas { position: relative; display: flex; flex-direction: column; width: max-content; }
    .hourly-row-top, .hourly-row-bottom { display: flex; }
    .hourly-cell-btn {
      width: 60px; flex: 0 0 60px; display: flex; flex-direction: column; align-items: center; text-align: center;
      gap: 4px; padding: 6px 2px; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent;
      transition: background var(--motion-fast), border-color var(--motion-fast);
    }
    .hourly-cell-btn:hover { background: var(--bg-tonal); }
    .hourly-cell-btn.is-now { background: var(--bg-tonal); }
    .hourly-cell-btn.is-selected { background: var(--accent-soft); border-color: var(--accent-primary); }
    .hourly-cell-foot { width: 60px; flex: 0 0 60px; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 2px 2px 4px; }
    .hourly-time { font-size: 0.75em; font-weight: 600; color: var(--text-secondary); }
    .hourly-tag { font-size: 0.64em; font-weight: 700; color: var(--accent-primary); height: 14px; }
    .hourly-temp { font-size: 0.9em; font-weight: 700; color: var(--text-primary); }
    .hourly-pop { font-size: 0.74em; font-weight: 600; color: var(--rain-color); min-height: 16px; }
    .hourly-pop.zero { color: var(--text-tertiary); font-weight: 500; }
    .hourly-spline-svg { display: block; height: 44px; overflow: visible; }

    /* 주간 예보 11일 (P8: 내용 좌우 끝 = 구분선 좌우 끝) */
    .weekly-list { display: flex; flex-direction: column; }
    .weekly-row-btn {
      width: 100%; border: 0; border-top: 1px solid var(--border-subtle); background: transparent;
      display: grid; grid-template-columns: 74px 72px 32px minmax(48px, 1fr) 32px;
      align-items: center; gap: 6px; padding: 9px 0; text-align: left;
      transition: background var(--motion-fast);
    }
    .weekly-row-btn:first-child { border-top: 0; padding-top: 2px; }
    .weekly-row-btn:hover { background: var(--bg-tonal); }
    .weekly-day { font-size: 0.85em; font-weight: 600; color: var(--text-primary); }
    .weekly-day small { display: block; font-size: 0.78em; font-weight: 500; color: var(--text-tertiary); }
    .weekly-sky { display: flex; align-items: center; gap: 4px; font-size: 0.74em; color: var(--rain-color); font-weight: 600; }
    .weekly-min { font-size: 0.85em; color: var(--temp-cool); font-weight: 600; text-align: right; }
    .weekly-max { font-size: 0.85em; color: var(--temp-warm); font-weight: 700; text-align: left; }
    .range-track { height: 7px; border-radius: var(--radius-pill); background: var(--bg-tonal); position: relative; overflow: hidden; }
    .range-fill { position: absolute; top: 0; bottom: 0; border-radius: var(--radius-pill); background: linear-gradient(90deg, var(--temp-cool), var(--temp-warm)); }

    .app-shell.narrow-320 .weekly-row-btn { grid-template-columns: 60px 58px 28px minmax(34px, 1fr) 28px; gap: 4px; }
    .app-shell.scale-200 .weekly-row-btn { grid-template-columns: auto minmax(56px, 1fr) auto; row-gap: 8px; column-gap: 8px; }
    .app-shell.scale-200 .weekly-row-btn .weekly-day { grid-column: 1 / 3; }
    .app-shell.scale-200 .weekly-row-btn .weekly-sky { grid-column: 3 / 4; justify-self: end; }
    .app-shell.scale-200 .weekly-row-btn .weekly-min { grid-column: 1 / 2; text-align: left; }
    .app-shell.scale-200 .weekly-row-btn .range-track { grid-column: 2 / 3; height: 9px; }
    .app-shell.scale-200 .weekly-row-btn .weekly-max { grid-column: 3 / 4; text-align: right; }

    /* 오류 · 빈 상태 · 스켈레톤 */
    .section-error-box {
      padding: 10px 12px; border-radius: var(--radius-md); border: 1px dashed var(--status-err-border);
      background: var(--status-err-bg); color: var(--status-err-fg);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 0.83em;
    }
    .empty-state-panel {
      margin: 24px var(--page-gutter); padding: 28px 18px; background: var(--bg-surface);
      border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
      text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .empty-state-panel h2 { margin: 0; font-size: 1.05em; }
    .empty-state-panel p { margin: 0; font-size: 0.86em; color: var(--text-secondary); max-width: 28ch; }
    .skeleton {
      background: linear-gradient(90deg, var(--bg-tonal) 25%, var(--bg-tonal-strong) 50%, var(--bg-tonal) 75%);
      background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; border-radius: 8px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ==========================================================================
       6. 공통 버튼 · 평평한 목록 (P6 상자 대신 선 · P8 정렬선 · P9 누르는 영역)
       ========================================================================== */
    .page-pad { padding: 14px var(--page-gutter); display: flex; flex-direction: column; gap: 16px; }
    .group-heading {
      font-size: 0.8em;
      font-weight: 700;
      color: var(--text-secondary);
      margin: 0 0 6px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    /* P6: 목록은 상자 없이 위·아래 진한 경계선, 사이는 옅은 선 전체 폭 */
    .flat-list {
      border-top: 1px solid var(--border-strong);
      border-bottom: 1px solid var(--border-strong);
      display: flex;
      flex-direction: column;
    }
    .flat-list > * + * {
      border-top: 1px solid var(--border-subtle);
    }

    .primary-btn {
      min-height: 44px; padding: 0 16px; border-radius: var(--radius-pill); border: 1px solid transparent;
      background: var(--accent-primary); color: var(--text-on-accent); font-size: 0.88em; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .primary-btn:hover { background: var(--accent-primary-hover); }

    .secondary-btn {
      min-height: 44px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--border-strong);
      background: transparent; color: var(--text-primary); font-size: 0.86em; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .secondary-btn:hover { background: var(--bg-tonal); }

    /* P9: 보이는 크기는 조밀, 누르는 높이는 44px 유지하는 인라인 외곽선·텍스트 버튼 */
    .compact-outline-btn {
      min-height: 44px;
      padding: 6px 0;
      border: 0;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .compact-outline-btn > span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text-primary);
      font-size: 0.82em;
      font-weight: 600;
      white-space: nowrap;
      transition: background var(--motion-fast);
    }
    .compact-outline-btn:hover:not(:disabled) > span { background: var(--bg-tonal); }
    .compact-outline-btn.danger > span { border-color: var(--destructive); color: var(--destructive); }
    .compact-outline-btn.danger:hover:not(:disabled) > span { background: var(--status-err-bg); }

    .compact-text-btn {
      min-height: 44px;
      padding: 6px 8px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.82em;
      font-weight: 600;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .compact-text-btn:hover { color: var(--text-primary); background: var(--bg-tonal); }

    .destructive-btn {
      min-height: 44px; padding: 0 16px; border-radius: var(--radius-pill); border: 1px solid var(--destructive);
      background: transparent; color: var(--destructive); font-size: 0.88em; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .destructive-btn.solid { background: var(--destructive); color: #ffffff; }
    html[data-theme="dark"] .destructive-btn.solid,
    html[data-theme="high-contrast"] .destructive-btn.solid { color: #000000; }

    .link-cue { font-size: 0.8em; font-weight: 700; color: var(--accent-primary); display: inline-flex; align-items: center; gap: 2px; }
    .chevron { color: var(--text-tertiary); font-size: 1.15em; line-height: 1; flex-shrink: 0; }

    /* ==========================================================================
       7. 과거 날씨 탭 (어제 비교 · 최근 10일 · P6 전체 폭 구분선 목록)
       ========================================================================== */
    .compare-table-wrap { overflow-x: auto; }
    .compare-table { width: 100%; border-collapse: collapse; font-size: 0.84em; }
    .compare-table th, .compare-table td { padding: 8px 4px; text-align: right; border-bottom: 1px solid var(--border-subtle); }
    .compare-table th:first-child, .compare-table td:first-child { text-align: left; font-weight: 600; color: var(--text-secondary); padding-left: 0; }
    .compare-table th:last-child, .compare-table td:last-child { padding-right: 0; }
    .compare-table thead th { color: var(--text-secondary); font-weight: 700; font-size: 0.9em; }
    .compare-table tr:last-child td { border-bottom: 0; }
    .compare-footnote { margin: 10px 0 0; font-size: 0.76em; color: var(--text-tertiary); line-height: 1.5; }

    .preset-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip-btn {
      min-height: 40px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--border-subtle);
      background: var(--bg-tonal); color: var(--text-primary); font-size: 0.84em; font-weight: 600;
    }
    .chip-btn[aria-pressed="true"] { background: var(--accent-primary); color: var(--text-on-accent); border-color: var(--accent-primary); }

    .date-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-items: end; }
    .field-group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field-label { font-size: 0.78em; font-weight: 600; color: var(--text-secondary); }
    .text-input {
      min-height: 44px; width: 100%; padding: 8px 10px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--text-primary); font-size: 0.88em;
    }
    .text-input[aria-invalid="true"] { border-color: var(--status-err-border); background: var(--status-err-bg); }
    .field-error {
      margin-top: 8px; font-size: 0.82em; font-weight: 600; color: var(--status-err-fg);
      background: var(--status-err-bg); border: 1px solid var(--status-err-border); padding: 8px 10px; border-radius: var(--radius-sm);
    }

    .chart-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.78em; color: var(--text-secondary); margin-bottom: 8px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-swatch { width: 12px; height: 4px; border-radius: 2px; }
    .legend-swatch.bar { width: 10px; height: 10px; border-radius: 2px; }
    .chart-scroll { overflow-x: auto; padding-bottom: 4px; }
    .history-svg { display: block; width: 100%; min-width: 280px; height: 210px; }
    .trend-svg { display: block; width: 100%; min-width: 320px; height: 184px; }
    .chart-hit-dot { cursor: pointer; }
    .chart-summary-box {
      margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-sm);
      background: var(--bg-tonal); font-size: 0.8em; color: var(--text-primary); line-height: 1.5;
    }

    .history-day-list { margin-top: 12px; }
    .history-day-btn {
      width: 100%; min-height: 44px; padding: 8px 0; border: 0; background: transparent;
      display: grid; grid-template-columns: 84px 1fr auto; align-items: center; gap: 8px; text-align: left; font-size: 0.84em;
    }
    .history-day-btn:hover { background: var(--bg-tonal); }

    /* ==========================================================================
       8. 지역 탭 (P6 평평한 목록 · P7 입력창 밖 분리 · P8 정렬선 일치 · P11 말줄임)
       ========================================================================== */
    .search-row { display: flex; gap: 8px; align-items: center; }
    .search-hint { margin: 6px 0 0; font-size: 0.78em; color: var(--text-tertiary); }

    .loc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0; /* P8: 좌우 여백 없음 = 구분선 끝과 내용 끝 일치 */
    }
    .loc-row-main {
      flex: 1; min-width: 0; min-height: 44px; border: 0; background: transparent; text-align: left;
      padding: 2px 0; display: flex; flex-direction: column; justify-content: center; gap: 2px;
    }
    .loc-row-title {
      font-size: 0.92em; font-weight: 700; color: var(--text-primary);
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .loc-row-name-clamp {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .loc-row-sub { font-size: 0.78em; color: var(--text-secondary); }
    .primary-pill {
      font-size: 0.72em; padding: 1px 7px; border-radius: var(--radius-pill);
      background: var(--accent-soft); color: var(--accent-on-soft); font-weight: 700;
    }
    .icon-btn.danger { color: var(--destructive); }
    .icon-btn.danger:hover { background: var(--status-err-bg); }

    /* ==========================================================================
       9. 설정 탭 — SETTINGS_SIGNATURE_GUIDE.md 100% 시그니처 구현
       (묶음 제목 바깥 위 + 섹션 카드 1개 + 구분선 행 + 실측 1줄/2줄 + 시그니처 세그먼트)
       ========================================================================== */
    .settings-page {
      padding: 14px var(--page-gutter) 24px;
      display: flex;
      flex-direction: column;
      gap: 20px; /* 섹션 경계는 넉넉한 여백 */
    }
    .setting-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .setting-section-title {
      margin: 0;
      padding-left: 12px; /* 카드 안쪽 글자 시작선(16px)보다 살짝 안쪽(12px) */
      font-size: 0.78em;
      font-weight: 700;
      color: var(--text-secondary);
      line-height: 1.3;
    }
    .setting-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    html[data-theme="high-contrast"] .setting-card { border-width: 2px; }

    /* 설정 행: 모든 행 동일 좌우 패딩(16px), 행 사이 옅은 구분선 카드 전체 폭 */
    .setting-row {
      padding: 12px 16px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .setting-row:first-child { border-top: 0; }
    .setting-row.is-stacked {
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    .setting-row.is-stacked .setting-ctrl {
      align-self: flex-start;
    }
    .setting-row.is-stacked .setting-ctrl.full-on-stack {
      align-self: stretch;
      width: 100%;
    }

    .setting-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .setting-label {
      font-size: 0.92em;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
      white-space: nowrap;
    }
    .setting-row.is-stacked .setting-label {
      white-space: normal;
    }
    .setting-desc {
      font-size: 0.78em;
      color: var(--text-tertiary);
      line-height: 1.4;
    }
    .setting-ctrl {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    /* 설정 링크형 행 (문서·하위 화면: 행 전체 클릭 + 오른쪽 ›, 설명 없음) */
    .setting-link-row {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border: 0;
      border-top: 1px solid var(--border-subtle);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      transition: background var(--motion-fast);
    }
    .setting-link-row:first-child { border-top: 0; }
    .setting-link-row:hover { background: var(--bg-tonal); }

    /* 시그니처 세그먼트: 기본은 한 줄 오른쪽 자연 폭, 넘칠 때만 아래 줄 전체 폭 (§5, P7) */
    .sig-segmented {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: 10px;
      background: var(--bg-tonal);
      gap: 2px;
      max-width: 100%;
    }
    .setting-row.is-stacked .sig-segmented {
      display: flex;
      width: 100%;
    }
    .setting-row.is-stacked .sig-segmented.palette-seg {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      width: 100%;
    }
    .app-shell.scale-200 .setting-row.is-stacked .sig-segmented.palette-seg,
    .app-shell.narrow-320 .setting-row.is-stacked .sig-segmented.palette-seg,
    .app-shell.font-xl .setting-row.is-stacked .sig-segmented.palette-seg {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .app-shell.scale-200 .setting-row.is-stacked .sig-segmented:not(.palette-seg) {
      flex-wrap: wrap;
    }
    .palette-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(15, 23, 42, 0.22);
    }
    html[data-theme="dark"] .palette-dot {
      border-color: rgba(255, 255, 255, 0.28);
    }
    .sig-seg-btn {
      min-height: 34px;
      padding: 4px 8px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.78em;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      flex: 0 0 auto;
      transition: background var(--motion-fast), color var(--motion-fast), border-color var(--motion-fast);
    }
    .setting-row.is-stacked .sig-seg-btn {
      flex: 1 1 auto;
    }
    .sig-segmented.palette-seg .sig-seg-btn {
      padding: 4px 7px;
      gap: 4px;
    }
    .sig-seg-btn[aria-pressed="true"] {
      background: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-strong);
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    html[data-theme="high-contrast"] .sig-seg-btn[aria-pressed="true"] {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    /* 권한 상태 · 보장 안심 행 (§5) */
    .perm-ok-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82em;
      font-weight: 700;
      color: var(--status-ok);
      white-space: nowrap;
    }
    .assurance-row {
      padding: 11px 16px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.78em;
      color: var(--text-secondary);
      line-height: 1.45;
    }
    .assurance-row svg { color: var(--status-ok); flex-shrink: 0; margin-top: 2px; }

    /* ==========================================================================
       10. 하단 내비게이션 · 스낵바 · 바텀시트/문서 창 · 접이식 라이선스
       ========================================================================== */
    .bottom-nav {
      min-height: var(--nav-height); flex-shrink: 0; background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      padding: 4px 6px max(6px, env(safe-area-inset-bottom)); z-index: 5;
    }
    .nav-btn {
      border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; min-height: 48px; padding: 4px 2px; color: var(--text-secondary); font-size: 0.76em; font-weight: 600; border-radius: var(--radius-md);
    }
    .nav-pill { width: 52px; height: 28px; border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; transition: background var(--motion-fast); }
    .nav-btn[aria-current="page"] { color: var(--text-primary); font-weight: 700; }
    .nav-btn[aria-current="page"] .nav-pill { background: var(--accent-soft); color: var(--accent-on-soft); }
    html[data-theme="high-contrast"] .nav-btn[aria-current="page"] .nav-pill { border: 2px solid var(--accent-primary); }

    .snackbar {
      position: absolute; left: 12px; right: 12px; bottom: calc(var(--nav-height) + 12px);
      background: #1e293b; color: #f8fafc; border-radius: var(--radius-md); padding: 10px 14px;
      display: none; align-items: center; justify-content: space-between; gap: 10px;
      font-size: 0.84em; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28); z-index: 20;
    }
    .snackbar.visible { display: flex; }
    html[data-theme="high-contrast"] .snackbar { background: #000000; border: 2px solid #ffe600; color: #ffffff; }
    .snackbar-action { min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #93c5fd; font-weight: 700; flex-shrink: 0; }
    html[data-theme="high-contrast"] .snackbar-action { color: #ffe600; border: 1px solid #ffe600; }

    /* P14: 두 테마 동일 반투명 어두운 막 */
    .modal-backdrop {
      position: absolute; inset: 0; background: var(--scrim-modal);
      display: none; align-items: flex-end; justify-content: center; z-index: 30; padding: 12px;
    }
    .modal-backdrop.open { display: flex; }

    .sheet-dialog {
      width: 100%; max-height: 88%; overflow-y: auto;
      background: var(--bg-surface); color: var(--text-primary);
      border: 1px solid var(--border-subtle); border-radius: 20px; padding: 18px;
      box-shadow: var(--shadow-sheet); display: flex; flex-direction: column; gap: 12px;
      font-size: 1em; /* P13: 앱 글씨 크기 배율 그대로 상속 */
    }
    html[data-theme="high-contrast"] .sheet-dialog { border: 2px solid #ffffff; }
    .sheet-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sheet-title { margin: 0; font-size: 1.04em; font-weight: 700; }

    .detail-kv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .detail-kv { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--bg-tonal); display: flex; flex-direction: column; gap: 2px; }
    .detail-kv-label { font-size: 0.75em; color: var(--text-secondary); }
    .detail-kv-val { font-size: 0.96em; font-weight: 700; }

    /* P11: 상세 정보 창 항목 이름(작은 보조색) + 값 세로 나열 */
    .meta-list { display: flex; flex-direction: column; border-top: 1px solid var(--border-subtle); }
    .meta-list-row {
      display: flex; justify-content: space-between; gap: 10px; padding: 8px 0;
      border-bottom: 1px solid var(--border-subtle); font-size: 0.83em; flex-wrap: wrap;
    }
    .meta-list-key { color: var(--text-secondary); font-weight: 600; }
    .meta-list-val { color: var(--text-primary); font-weight: 600; text-align: right; }

    .sheet-note-box { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--bg-tonal); font-size: 0.8em; color: var(--text-secondary); line-height: 1.5; }

    /* 문서 창 (§11) */
    .doc-section { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .doc-section h3 { margin: 0; font-size: 0.88em; font-weight: 700; color: var(--text-primary); }
    .doc-section p, .doc-section ul { margin: 0; font-size: 0.82em; color: var(--text-secondary); line-height: 1.55; }
    .doc-section ul { padding-left: 18px; }
    .doc-date { margin: 4px 0 0; font-size: 0.76em; color: var(--text-tertiary); }

    .license-item { border-top: 1px solid var(--border-subtle); }

    .license-item summary {

      display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.85em;
    }
    .license-item summary::-webkit-details-marker { display: none; }
    .license-item summary .lic-chev { transition: transform var(--motion-fast); color: var(--text-tertiary); }
    .license-item[open] summary .lic-chev { transform: rotate(90deg); }
    .license-body { padding: 0 0 10px; font-size: 0.78em; color: var(--text-secondary); line-height: 1.5; }

    .trend-hour-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
    .trend-hour-pill {
      min-height: 36px; padding: 4px 10px; border-radius: var(--radius-pill); border: 1px solid var(--border-subtle);
      background: var(--bg-tonal); color: var(--text-primary); font-size: 0.78em; font-weight: 600; white-space: nowrap; flex-shrink: 0;
    }
    .trend-hour-pill[aria-pressed="true"] { background: var(--accent-primary); color: var(--text-on-accent); border-color: var(--accent-primary); }

    .android-wallpaper-mock {
      padding: 18px 14px; border-radius: 16px;
      background: linear-gradient(135deg, #274472 0%, #41729f 55%, #5885af 100%);
      display: flex; flex-direction: column; gap: 12px;
    }
    .glance-widget {

      color: var(--text-secondary); border-top: 1px solid var(--border-subtle); padding-top: 8px; flex-wrap: wrap; gap: 6px;

    function addDaysIso(isoDate, deltaDays) {
      const dt = new Date(`${isoDate}T00:00:00Z`);
      dt.setUTCDate(dt.getUTCDate() + deltaDays);
      return dt.toISOString().slice(0, 10);
    }

    function dayDiffInclusive(startIso, endIso) {
      const s = new Date(`${startIso}T00:00:00Z`);
      const e = new Date(`${endIso}T00:00:00Z`);
      return Math.round((e - s) / 86400000) + 1;
    }

    function koreanWeekday(isoDate) {
      return ["일", "월", "화", "수", "목", "금", "토"][new Date(`${isoDate}T00:00:00Z`).getUTCDay()];
    }

    function formatReceivedLabel(minutesAgo, isSuccess) {
      if (!isSuccess) return `${minutesAgo}분 전 수신 (갱신 실패)`;

      return `${minutesAgo}분 전 수신`;

    function roundHalfUp1(val) {
      if (!Number.isFinite(val)) return null;
      const absRounded = Math.floor(Math.abs(val) * 10 + 0.5) / 10;
      const signed = val < 0 ? -absRounded : absRounded;
      return Object.is(signed, -0) || signed === 0 ? 0 : signed;
    }

    function calculateApparentTemperature(ta, rh, windMs, month) {
      const isSummer = month >= 5 && month <= 9;
      if (isSummer) {
        if (!Number.isFinite(ta) || !Number.isFinite(rh)) {
          return {
            status: "insufficient", displayText: "자료 부족", seasonLabel: "여름철(5~9월) 습도 기준",
            reason: "같은 시각의 기온 또는 습도 관측값이 비어 있어 계산할 수 없습니다."
          };
        }
        if (ta < 0 || ta > 50 || rh < 5 || rh > 99) {
          return {
            status: "out_of_range", displayText: "적용 범위 밖", seasonLabel: "여름철(5~9월) 습도 기준",
            reason: `현재 조건(기온 ${ta.toFixed(1)}℃, 습도 ${rh}%)이 여름철 적용 범위(0~50℃, 5~99%)를 벗어났습니다.`
          };
        }
        const tw = ta * Math.atan(0.151977 * Math.sqrt(rh + 8.313659))
          + Math.atan(ta + rh) - Math.atan(rh - 1.67633)
          + 0.00391838 * Math.pow(rh, 1.5) * Math.atan(0.023101 * rh) - 4.686035;
        const raw = -0.2442 + 0.55399 * tw + 0.45535 * ta - 0.0022 * tw * tw + 0.00278 * tw * ta + 3.0;
        const rounded = roundHalfUp1(raw);
        return {
          status: "ok", value: rounded, tw: roundHalfUp1(tw), displayText: `${rounded.toFixed(1)}℃`,
          seasonLabel: "여름철(5~9월) 습도 기준",
          formulaSummary: "기온과 상대습도로 습구온도를 근사 산출한 여름철 체감온도 공식을 적용했습니다."
        };
      }
      if (!Number.isFinite(ta) || !Number.isFinite(windMs) || windMs < 0) {
        return {
          status: "insufficient", displayText: "자료 부족", seasonLabel: "겨울철(10~4월) 풍속 기준",
          reason: "같은 시각의 기온 또는 풍속 관측값이 비어 있어 계산할 수 없습니다."
        };
      }
      if (ta > 10 || windMs < 1.3) {
        return {
          status: "out_of_range", displayText: "적용 범위 밖", seasonLabel: "겨울철(10~4월) 풍속 기준",
          reason: `현재 조건(기온 ${ta.toFixed(1)}℃, 풍속 ${windMs.toFixed(1)}m/s)이 겨울철 적용 범위(10℃ 이하, 1.3m/s 이상)에 해당하지 않습니다.`
        };
      }
      const vKmh = windMs * 3.6;
      const vPow = Math.pow(vKmh, 0.16);
      const raw = 13.12 + 0.6215 * ta - 11.37 * vPow + 0.3965 * ta * vPow;
      const rounded = roundHalfUp1(raw);
      return {
        status: "ok", value: rounded, vKmh: roundHalfUp1(vKmh), displayText: `${rounded.toFixed(1)}℃`,
        seasonLabel: "겨울철(10~4월) 풍속 기준",
        formulaSummary: "기온과 풍속(km/h 환산)을 반영한 겨울철 풍속 기반 체감온도 공식을 적용했습니다."
      };
    }

    function seededWave(seed, step) {
      const x = Math.sin(seed * 12.9898 + step * 78.233) * 43758.5453;
      return x - Math.floor(x);
    }

    function buildHourlyData(region, clock) {
      const list = [];
      const seed = region.nx * 7 + region.ny + (state.seasonMode === "summer" ? 31 : 0);
      const startHour = clock.nowHour;
      const startDiurnal = -Math.cos(((startHour - 5) / 24) * Math.PI * 2) * 3.6;
      for (let i = 0; i < 48; i++) {
        const totalHour = startHour + i;
        const h = totalHour % 24;
        const dayOffset = Math.floor(totalHour / 24);
        const dateIso = addDaysIso(clock.todayStr, dayOffset);
        const diurnal = -Math.cos(((h - 5) / 24) * Math.PI * 2) * 3.6 - startDiurnal;
        const temp = i === 0 ? region.baseTemp : Number((region.baseTemp + diurnal + (seededWave(seed, i) - 0.5) * 1.1).toFixed(1));
        let pop;
        if (region.sky === "rain" || region.sky === "sleet") {
          pop = i < 8 ? (i === 2 ? 70 : 60) : (i % 5 === 0 ? 40 : 20);
        } else {
          const w = seededWave(seed + 5, i);
          pop = w > 0.78 ? 60 : w > 0.58 ? 30 : w > 0.36 ? 20 : 0;
        }
        if (i === 0 && region.rn1 === 0) pop = 10;
        let rainText = "강수 없음";
        if (pop >= 70) rainText = "5~9mm";
        else if (pop >= 60) rainText = "1~4mm";
        else if (pop >= 30 && seededWave(seed + 17, i) > 0.55) rainText = "1mm 미만";
        else if (i === 0 && region.rn1 > 0) rainText = `${region.rn1.toFixed(1)}mm`;
        const sky = i === 0 ? region.sky : (pop >= 60 ? (temp <= 0.5 ? "sleet" : "rain") : pop >= 30 ? "cloudy" : (h >= 7 && h <= 17 ? (pop >= 20 ? "partly" : "clear") : "partly"));
        const ptyLabel = sky === "sleet" ? "비/눈" : sky === "rain" ? "비" : "없음";
        const isUltra = i < 6;
        list.push({
          idx: i, regionId: region.id, dateIso, dayOffset, hour: h,
          timeStr: `${String(h).padStart(2, "0")}:00`,
          label: i === 0 ? "지금" : (h === 0 ? (dayOffset === 1 ? "내일 0시" : "모레 0시") : `${h}시`),
          shortHourLabel: `${h}시`, isUltra,
          sourceLabel: isUltra ? "기상청 초단기예보" : "기상청 단기예보",
          releaseTime: isUltra ? `${clock.todayStr} ${clock.obsTimeStr}` : `${clock.todayStr} ${clock.fcstReleaseStr}`,
          mergedNote: isUltra && i === 4 ? "강수확률은 단기예보 값으로 보완했습니다." : "",
          temp, pop, rainText, sky, ptyLabel
        });
      }
      return list;
    }

    function buildForecastSummary(hourly) {
      const candidates = hourly.slice(1, 7);
      if (candidates.length === 0) return { available: false, text: "예보 요약 자료 없음", targetIdx: null };
      const withPop = candidates.filter(h => Number.isFinite(h.pop));
      if (withPop.length > 0) {
        let best = withPop[0];
        for (let i = 1; i < withPop.length; i++) if (withPop[i].pop > best.pop) best = withPop[i];
        const parts = [`${best.shortHourLabel} 예보`, `강수확률 ${best.pop}%`];
        if (best.rainText && best.rainText !== "강수 없음") parts.push(`예상 강수량 ${best.rainText}`);
        else if (Number.isFinite(best.temp)) parts.push(`기온 ${best.temp.toFixed(1)}℃`);
        return { available: true, text: parts.join(" · "), targetIdx: best.idx };
      }
      const withTemp = candidates.find(h => Number.isFinite(h.temp));
      if (withTemp) return { available: true, text: `${withTemp.shortHourLabel} 예보 · 기온 ${withTemp.temp.toFixed(1)}℃`, targetIdx: withTemp.idx };
      return { available: false, text: "예보 요약 자료 없음", targetIdx: null };
    }

    function buildWeeklyData(region, clock) {
      const seed = region.nx + region.ny * 3 + (state.seasonMode === "summer" ? 19 : 0);
      const result = [];
      for (let d = 0; d <= 10; d++) {
        const dateIso = addDaysIso(clock.todayStr, d);
        const mm = Number(dateIso.slice(5, 7));
        const dd = Number(dateIso.slice(8, 10));
        const dayLabel = d === 0 ? "오늘" : d === 1 ? "내일" : koreanWeekday(dateIso);
        const trend = Math.sin(d * 0.72 + seed) * 2.6;
        const min = Math.round(region.lo + trend - d * 0.12);
        const max = Math.max(min + 3, Math.round(region.hi + trend - d * 0.1));
        const isMid = d >= 4;
        if (d >= 8) {
          const wholePop = seededWave(seed + 13, d) > 0.68 ? 60 : seededWave(seed + 4, d) > 0.42 ? 30 : 20;
          const wholeSky = wholePop >= 60 ? "rain" : wholePop >= 30 ? "cloudy" : "partly";
          result.push({
            d, dateIso, dayLabel, dateLabel: `${mm}.${dd}`, isMid: true, resolution: "whole", hasHourlyLink: false,
            min, max, wholePop, wholeSky, displayPop: wholePop, displaySky: wholeSky,
            sourceLabel: "기상청 중기예보 (종일)", releaseTime: `${clock.todayStr} ${clock.midReleaseStr}`
          });
        } else {
          const amPop = d === 0 && (region.sky === "rain" || region.sky === "sleet") ? 70 : (seededWave(seed + 11, d) > 0.68 ? 60 : (seededWave(seed + 3, d) > 0.4 ? 20 : 10));
          const pmPop = seededWave(seed + 19, d) > 0.72 ? 70 : (seededWave(seed + 7, d) > 0.45 ? 30 : 10);
          const amSky = amPop >= 60 ? "rain" : amPop >= 30 ? "cloudy" : "clear";
          const pmSky = pmPop >= 60 ? "rain" : pmPop >= 30 ? "cloudy" : "partly";
          const maxPop = Math.max(amPop, pmPop);
          const displaySky = maxPop >= 60 ? "rain" : maxPop >= 30 ? "cloudy" : (amSky === "clear" && pmSky === "clear" ? "clear" : "partly");
          result.push({
            d, dateIso, dayLabel, dateLabel: `${mm}.${dd}`, isMid, resolution: "ampm", hasHourlyLink: d <= 1,
            min, max, amPop, pmPop, amSky, pmSky, displayPop: maxPop, displaySky,
            sourceLabel: isMid ? "기상청 중기예보 (오전·오후)" : "기상청 단기예보 (오전·오후)",
            releaseTime: isMid ? `${clock.todayStr} ${clock.midReleaseStr}` : `${clock.todayStr} ${clock.fcstReleaseStr}`
          });
        }
      }
      return result;
    }

    function buildYesterdayComparison(region, clock) {
      const seed = region.nx * 3 + region.ny + (state.seasonMode === "summer" ? 23 : 0);
      const yMax = Number((region.hi + 2.3 + (seededWave(seed, 1) - 0.5) * 1.4).toFixed(1));
      const yMin = Number((region.lo + 1.5 + (seededWave(seed, 2) - 0.5) * 1.2).toFixed(1));
      const yAvg = Number(((yMax + yMin) / 2).toFixed(1));
      const yRain = seededWave(seed, 3) > 0.58 ? Number((seededWave(seed, 4) * 8.4 + 0.4).toFixed(1)) : 0.0;
      return {
        today: { label: `${clock.todayStr} (예보)`, max: region.hi, min: region.lo },
        yesterday: { label: `${clock.yesterdayStr} (관측)`, max: yMax, min: yMin, avg: yAvg, rain: yRain },
        diffMax: Number((region.hi - yMax).toFixed(1)),
        diffMin: Number((region.lo - yMin).toFixed(1))
      };
    }

    function formatDeltaText(label, delta) {
      if (Math.abs(delta) < 0.05) return `${label}와 비슷`;
      return `${label}보다 ${Math.abs(delta).toFixed(1)}℃ ${delta > 0 ? "높음" : "낮음"}`;
    }

    function buildHistorySeries(region, startStr, endStr) {
      const diffDays = dayDiffInclusive(startStr, endStr);
      const seed = Number(region.asosId) || 108;
      const rows = [];
      for (let i = 0; i < diffDays; i++) {
        const iso = addDaysIso(startStr, i);
        const mm = Number(iso.slice(5, 7));
        const dd = Number(iso.slice(8, 10));
        const trend = (diffDays - i) * 0.25;
        const wave = Math.sin(i * 0.65 + seed) * 2.4;
        const maxTa = Number((region.hi + trend + wave).toFixed(1));
        const minTa = Number((region.lo + trend + wave - 0.5).toFixed(1));
        const avgTa = Number(((maxTa + minTa) / 2).toFixed(1));
        const isMissingRain = diffDays >= 8 && i === 3;
        const isMissingWind = diffDays >= 7 && i === Math.floor(diffDays / 2);
        const rainChance = seededWave(seed + 13, i);
        const sumRn = isMissingRain ? null : (rainChance > 0.66 ? Number((seededWave(seed + 29, i) * 16 + 0.5).toFixed(1)) : 0.0);
        rows.push({
          date: iso, shortDate: `${mm}.${dd}`, avgTa, maxTa, minTa, sumRn,
          avgWs: isMissingWind ? null : Number((1.4 + seededWave(seed + 41, i) * 3.6).toFixed(1)),
          avgRhm: Math.round(44 + seededWave(seed + 53, i) * 40)
        });
      }
      return rows;
    }

    function buildAirTrendSeries(region, clock) {
      const useBackup = state.sectionErrors.airQualityFallback;
      const stationName = useBackup ? region.airBackup : region.airStation;
      const count = state.airPartialDemo ? 18 : 24;
      const seed = region.nx * 5 + region.ny + (useBackup ? 17 : 0);
      const endHour = Number(clock.airMeasureStr.slice(0, 2));
      const items = [];
      for (let offset = count - 1; offset >= 0; offset--) {
        let rawH = endHour - offset;
        let dayShift = 0;
        while (rawH < 0) { rawH += 24; dayShift -= 1; }
        const dateIso = addDaysIso(clock.todayStr, dayShift);
        const idxFromStart = count - 1 - offset;
        const wave = Math.sin(idxFromStart * 0.45 + seed);
        let pm10 = Math.max(8, Math.round((useBackup ? Math.max(12, region.pm10 - 3) : region.pm10) + wave * 11));
        let pm25 = Math.max(4, Math.round((useBackup ? Math.max(6, region.pm25 - 2) : region.pm25) + wave * 6));
        if (offset === 0) {
          pm10 = useBackup ? Math.max(12, region.pm10 - 3) : region.pm10;
          pm25 = useBackup ? Math.max(6, region.pm25 - 2) : region.pm25;
        }
        let pm10Flag = null, pm25Flag = null;
        if (state.airPartialDemo && idxFromStart === 7) { pm10 = null; pm10Flag = "점검"; }
        if (state.airPartialDemo && (idxFromStart === 7 || idxFromStart === 12)) { pm25 = null; pm25Flag = "통신장애"; }
        items.push({
          idx: idxFromStart, stationName, dateIso, timeStr: `${String(rawH).padStart(2, "0")}:00`,
          shortLabel: `${rawH}시`, normalizedFrom24: rawH === 0, pm10, pm25, pm10Flag, pm25Flag
        });
      }
      return {
        stationName, isBackup: useBackup, backupDistKm: region.airBackupDist, primaryStationName: region.airStation,
        count: items.length,
        startLabel: `${items[0].dateIso.slice(5)} ${items[0].timeStr}`,
        endLabel: `${items[items.length - 1].dateIso.slice(5)} ${items[items.length - 1].timeStr}`,
        gradeBasis: "1시간 측정 기준", items
      };
    }

    function pmGrade(type, val) {
      if (!Number.isFinite(val)) return { idx: 0, cls: "none", label: "자료 없음", symbol: "—" };
      const limits = type === "pm10" ? [30, 80, 150] : [15, 35, 75];
      if (val <= limits[0]) return { idx: 1, cls: "good", label: "좋음", symbol: "●" };
      if (val <= limits[1]) return { idx: 2, cls: "mod", label: "보통", symbol: "◐" };
      if (val <= limits[2]) return { idx: 3, cls: "bad", label: "나쁨", symbol: "▲" };
      return { idx: 4, cls: "vbad", label: "매우나쁨", symbol: "◆" };
    }

      return { clear: "맑음", partly: "구름많음", cloudy: "흐림", rain: "비", sleet: "비/눈" }[sky] || "구름많음";

    /* ==========================================================================
       4-2. 히어로 날씨 배경 (확정 C안: 순수 2D Canvas 파티클, 점멸 제외)
       ========================================================================== */
    function buildHeroAmbientMarkup(sky, mode) {
      if (mode === "c") {
        return `<div class="hero-ambient mode-c sky-${sky}" aria-hidden="true"><canvas class="hero-particle-canvas" id="heroParticleCanvas"></canvas></div><div class="hero-scrim" aria-hidden="true"></div>`;
      }
      let layers = "";
      if (sky === "clear") layers = `<div class="amb-sun-halo"></div><div class="amb-sun-beam"></div>`;
      else if (sky === "partly") layers = `<div class="amb-sun-halo" style="opacity:0.65; width:175px; height:175px;"></div><div class="amb-cloud c1"></div><div class="amb-cloud c2"></div>`;
      else if (sky === "cloudy") layers = `<div class="amb-cloud dim c1"></div><div class="amb-cloud dim c2"></div><div class="amb-cloud dim c3"></div>`;
      else if (sky === "rain") {
        const drops = Array.from({ length: 12 }, (_, i) => `<span class="amb-rain-drop" style="left:${(6 + i * 8.1).toFixed(1)}%; --dur:${(1.55 + (i % 4) * 0.28).toFixed(2)}s; --delay:${(-(i * 0.37) % 1.9).toFixed(2)}s; --static-y:${14 + ((i * 23) % 62)}%;"></span>`).join("");
        layers = `<div class="amb-cloud dim c1"></div><div class="amb-cloud dim c2"></div>${drops}`;
      } else {
        const drops = Array.from({ length: 7 }, (_, i) => `<span class="amb-rain-drop" style="left:${(8 + i * 13.5).toFixed(1)}%; --dur:${(1.8 + (i % 3) * 0.3).toFixed(2)}s; --delay:${(-(i * 0.41) % 1.8).toFixed(2)}s; --static-y:${16 + ((i * 19) % 58)}%;"></span>`).join("");
        const flakes = Array.from({ length: 8 }, (_, i) => `<span class="amb-snow-dot" style="left:${(11 + i * 11.2).toFixed(1)}%; --dur:${(4.1 + (i % 4) * 0.7).toFixed(2)}s; --delay:${(-(i * 0.63) % 4.0).toFixed(2)}s; --sz:${5 + (i % 3) * 2}px; --static-y:${18 + ((i * 29) % 64)}%;"></span>`).join("");
        layers = `<div class="amb-cloud dim c1"></div><div class="amb-cloud dim c2"></div>${drops}${flakes}`;
      }
      return `<div class="hero-ambient mode-${mode} sky-${sky}" aria-hidden="true">${layers}</div><div class="hero-scrim" aria-hidden="true"></div>`;
    }

    function stopHeroParticleLoop() {
      if (heroParticleRafId !== null) {
        cancelAnimationFrame(heroParticleRafId);
        heroParticleRafId = null;
      }
    }

    function startHeroParticleLoop(sky) {
      stopHeroParticleLoop();
      if (state.heroBgMode !== "c" || state.theme === "high-contrast" || state.activeTab !== "home") return;
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const canvas = document.getElementById("heroParticleCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      const W = Math.max(rect.width || 380, 260);
      const H = Math.max(rect.height || 290, 220);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const isDark = state.theme === "dark";
      const rand = (min, max) => min + Math.random() * (max - min);
      const clouds = Array.from({ length: sky === "cloudy" ? 7 : sky === "clear" ? 0 : 5 }, (_, i) => ({
        x: rand(-60, W + 40), y: rand(12, H * 0.56), r: rand(44, 86),
        vx: rand(0.12, 0.35) * (i % 2 === 0 ? 1 : -0.7), a: isDark ? rand(0.08, 0.16) : rand(0.28, 0.46)
      }));
      const drops = Array.from({ length: sky === "rain" ? 64 : sky === "sleet" ? 32 : 0 }, () => ({
        x: rand(-20, W + 40), y: rand(-40, H), len: rand(16, 32), vy: rand(4.2, 7.4), vx: -rand(0.9, 1.8), a: isDark ? rand(0.18, 0.4) : rand(0.18, 0.36)
      }));
      const motes = Array.from({ length: sky === "sleet" ? 46 : (sky === "clear" ? 28 : sky === "partly" ? 18 : sky === "cloudy" ? 26 : 0) }, () => ({
        x: rand(0, W), y: rand(0, H), r: sky === "sleet" ? rand(1.8, 4.2) : rand(1.5, 4.4),
        vy: sky === "sleet" ? rand(0.8, 2.0) : rand(-0.22, 0.22), vx: sky === "cloudy" ? rand(0.3, 0.8) : rand(-0.35, 0.35),
        phase: rand(0, Math.PI * 2), a: isDark ? rand(0.16, 0.44) : rand(0.22, 0.5)
      }));

      let t = 0;
      function frame() {
        if (state.heroBgMode !== "c" || state.theme === "high-contrast" || state.activeTab !== "home") {
          stopHeroParticleLoop();
          return;
        }
        if (heroParticlePaused) {
          heroParticleRafId = requestAnimationFrame(frame);
          return;
        }
        t += 0.016;
        ctx.clearRect(0, 0, W, H);

        if (sky === "clear" || sky === "partly") {
          const sx = W - 44, sy = 24, beamCount = sky === "clear" ? 8 : 5;
          ctx.save();
          ctx.translate(sx, sy);
          ctx.rotate(t * 0.09);
          for (let i = 0; i < beamCount; i++) {
            ctx.rotate((Math.PI * 2) / beamCount);
            const grad = ctx.createLinearGradient(0, 0, 190, 0);
            grad.addColorStop(0, isDark ? "rgba(251, 191, 36, 0.16)" : "rgba(251, 191, 36, 0.24)");
            grad.addColorStop(1, "rgba(251, 191, 36, 0)");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(0, -10); ctx.lineTo(190, -28); ctx.lineTo(190, 28); ctx.lineTo(0, 10); ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
          const pulse = 96 + Math.sin(t * 1.4) * 14;
          const sunGrad = ctx.createRadialGradient(sx, sy, 8, sx, sy, pulse);
          sunGrad.addColorStop(0, isDark ? "rgba(253, 224, 71, 0.28)" : "rgba(251, 191, 36, 0.42)");
          sunGrad.addColorStop(0.55, isDark ? "rgba(96, 165, 250, 0.12)" : "rgba(253, 224, 71, 0.16)");
          sunGrad.addColorStop(1, "rgba(251, 191, 36, 0)");
          ctx.fillStyle = sunGrad;
          ctx.beginPath(); ctx.arc(sx, sy, pulse, 0, Math.PI * 2); ctx.fill();
        }

        for (const c of clouds) {
          c.x += c.vx;
          if (c.x - c.r > W + 40) c.x = -c.r - 20;
          if (c.x + c.r < -40) c.x = W + c.r + 20;
          const cg = ctx.createRadialGradient(c.x, c.y, c.r * 0.15, c.x, c.y, c.r);
          const rgb = (sky === "rain" || sky === "sleet") ? "100,116,139" : (isDark ? "148,163,184" : "255,255,255");
          cg.addColorStop(0, `rgba(${rgb}, ${c.a})`);
          cg.addColorStop(1, `rgba(${rgb}, 0)`);
          ctx.fillStyle = cg;
          ctx.beginPath(); ctx.ellipse(c.x, c.y, c.r * 1.45, c.r * 0.62, 0, 0, Math.PI * 2); ctx.fill();
        }

        if (drops.length > 0) {
          ctx.lineWidth = 1.3; ctx.lineCap = "round";
          for (const d of drops) {
            d.x += d.vx; d.y += d.vy;
            if (d.y > H + 12) { d.y = -d.len; d.x = rand(-10, W + 40); }
            ctx.strokeStyle = isDark ? `rgba(147, 197, 253, ${d.a})` : `rgba(37, 99, 235, ${d.a})`;
            ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.vx * 2.6, d.y + d.len); ctx.stroke();
          }
        }

        for (const m of motes) {
          m.phase += 0.03;
          m.x += m.vx + (sky === "sleet" ? Math.sin(m.phase) * 0.55 : 0);
          m.y += m.vy;
          if (m.y > H + 8) { m.y = -8; m.x = rand(0, W); }
          if (m.y < -8) m.y = H + 8;
          if (m.x > W + 8) m.x = -8;
          if (m.x < -8) m.x = W + 8;
          const twinkle = sky === "clear" || sky === "partly" ? (0.55 + 0.45 * Math.sin(m.phase * 1.4)) : 1;
          ctx.fillStyle = sky === "clear"
            ? (isDark ? `rgba(253, 224, 71, ${(m.a * twinkle).toFixed(2)})` : `rgba(255, 251, 235, ${(m.a * twinkle).toFixed(2)})`)
            : (isDark ? `rgba(226, 232, 240, ${(m.a * twinkle).toFixed(2)})` : `rgba(255, 255, 255, ${(m.a * twinkle).toFixed(2)})`);
          ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
        }
        heroParticleRafId = requestAnimationFrame(frame);
      }
      heroParticleRafId = requestAnimationFrame(frame);
    }

    function getDataFreshnessState() {
      if (state.scenario === "offline-cached") return { isStale: true, isOffline: true, isRefreshing: false, label: "오프라인 · 오래됨", errorReason: "네트워크 연결 없음" };
      if (state.scenario === "refreshing") return { isStale: true, isOffline: false, isRefreshing: true, label: "오래됨 · 갱신 중", errorReason: null };
      if (state.quotaExceeded) return { isStale: true, isOffline: false, isRefreshing: false, label: "오래됨 · 한도 초과", errorReason: "오늘 조회 한도를 초과해 마지막 성공 자료를 유지합니다." };
      return { isStale: false, isOffline: false, isRefreshing: false, label: "최신 유효 자료", errorReason: null };
    }

    function announce(msg) {
      const el = document.getElementById("liveAnnouncer");

    function showSnackbar(message, actionLabel = null, onAction = null) {
      const bar = document.getElementById("snackbar");
      const text = document.getElementById("snackbarText");
      const btn = document.getElementById("snackbarActionBtn");
      clearTimeout(snackbarTimer);
      text.textContent = message;
      if (actionLabel && onAction) {
        btn.hidden = false; btn.textContent = actionLabel;
        btn.onclick = () => { onAction(); bar.classList.remove("visible"); clearTimeout(snackbarTimer); };
      } else {
        btn.hidden = true; btn.onclick = null;
      }
      bar.classList.add("visible");
      snackbarTimer = setTimeout(() => { bar.classList.remove("visible"); }, 6000);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[ch]));
    }

       5. 화면 렌더링 — 상단바 · 홈 · 과거 · 지역 · 설정

    function syncHistoryWindowWithClock() {
      const clock = getClockContext();
      if (state.historyEnd > clock.yesterdayStr || state.historyStart < clock.minHistoryStr) {
        if (state.historyPreset === "1w") {
          state.historyStart = addDaysIso(clock.yesterdayStr, -6);
          state.historyEnd = clock.yesterdayStr;
        } else {
          state.historyPreset = "10d";
          state.historyStart = clock.minHistoryStr;
          state.historyEnd = clock.yesterdayStr;
        }
        state.historyError = "";
      }
    }

    function renderTopbar() {
      const region = getActiveRegion();
      const topbar = document.getElementById("appTopbar");
      const locBtn = document.getElementById("topbarLocationBtn");

      const actions = document.getElementById("topbarActions");

      const metaEl = document.getElementById("topbarLocationMeta");

      const isSettings = state.activeTab === "settings";
      topbar.classList.toggle("solid-bar", state.activeTab !== "home" || state.scenario === "empty");

      const skyTokenMap = {
        clear: "var(--hero-clear-start)", partly: "var(--hero-partly-start)",

      };
      topbar.style.setProperty("--hero-active-start", skyTokenMap[region.sky] || "var(--bg-hero-start)");

      if (state.scenario === "perm-denied") metaEl.textContent = "직접 선택한 지역";
      else if (state.isUsingCurrentLocation) metaEl.textContent = "현재 위치";
      else metaEl.textContent = state.primaryRegionId === region.id ? "대표 지역" : "저장한 지역";

    function renderHome() {

      const bannersEl = document.getElementById("homeBanners");

      if (state.scenario === "offline-cached") {

          <div class="status-banner" role="status">

          <div class="status-banner" role="status">
            <div class="status-banner-body">
              <span aria-hidden="true">📍</span>
              <span><strong>위치 권한이 꺼져 있습니다.</strong><br/>지역 검색으로 동네 날씨를 확인할 수 있습니다.</span>

      bannersEl.innerHTML = banners.join("");

      const retryOnlineBtn = document.getElementById("bannerRetryOnlineBtn");
      if (retryOnlineBtn) {
        retryOnlineBtn.onclick = () => {
          setScenario("normal");
          announce("최신 날씨 자료를 불러왔습니다.");
          showSnackbar("최신 날씨 자료로 갱신했습니다.");
        };
      }
      const goPermBtn = document.getElementById("bannerGoPermSettingBtn");
      if (goPermBtn) goPermBtn.onclick = () => jumpToSettingSection("setting-location");

      // 2) 빈 상태
      if (state.scenario === "empty") {
        contentEl.innerHTML = `
          <div class="empty-state-panel" role="status">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="M2 2l20 20M8.5 16.5A5 5 0 0 1 7 7h1.3M16.5 17H19a4 4 0 0 0 1-7.87A6 6 0 0 0 10.6 5.2"/>
            </svg>
            <h2>저장된 날씨 자료가 없습니다</h2>
            <p>오프라인 상태이며 저장된 기록이 없습니다.<br/>연결 후 다시 시도해 주세요.</p>
            <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
              <button type="button" class="primary-btn" id="emptyRetryBtn">재시도</button>
              <button type="button" class="secondary-btn" id="emptyGoLocBtn">지역 선택</button>
            </div>
          </div>

        document.getElementById("emptyRetryBtn").onclick = () => { setScenario("normal"); showSnackbar("날씨 자료를 불러왔습니다."); };
        document.getElementById("emptyGoLocBtn").onclick = () => switchTab("locations");
