      }

      // 3) 최초 로딩 스켈레톤
      if (state.scenario === "loading") {
        contentEl.innerHTML = `
          <div class="hero-stage" aria-busy="true" aria-label="현재 날씨 불러오는 중">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div style="display:flex; flex-direction:column; gap:10px;">
                <div class="skeleton" style="width:136px; height:62px;"></div>
                <div class="skeleton" style="width:170px; height:20px;"></div>
              </div>
              <div class="skeleton" style="width:72px; height:72px; border-radius:999px;"></div>
            </div>
            <div class="hero-metrics">
              <div class="skeleton" style="height:36px;"></div><div class="skeleton" style="height:36px;"></div>
              <div class="skeleton" style="height:36px;"></div><div class="skeleton" style="height:36px;"></div>
            </div>
            <div class="hero-air-band"><div class="skeleton" style="height:48px;"></div></div>
          </div>
          <div class="section-stack" aria-busy="true">
            <div class="surface-card"><div class="skeleton" style="height:64px;"></div></div>
            <div class="surface-card"><div class="skeleton" style="height:150px;"></div></div>
            <div class="surface-card"><div class="skeleton" style="height:220px;"></div></div>
          </div>
        `;
        return;
      }

      // 4) 정상 및 부분 상태
      const comp = buildYesterdayComparison(region, clock);
      const hourly = buildHourlyData(region, clock);
      const summary = buildForecastSummary(hourly);
      const weekly = buildWeeklyData(region, clock);
      const airTrend = buildAirTrendSeries(region, clock);
      const apparent = calculateApparentTemperature(region.baseTemp, region.reh, region.wsd, clock.month);

      let selectedIdx = 0;
      if (state.selectedHourlyKey && state.selectedHourlyKey.startsWith(`${region.id}:`)) {
        const parsed = Number(state.selectedHourlyKey.split(":")[1]);
        if (Number.isInteger(parsed) && parsed >= 0 && parsed < hourly.length) selectedIdx = parsed;
      }

      const cellW = 60, svgW = hourly.length * cellW;
      const temps = hourly.map(h => h.temp);
      const tMin = Math.min(...temps), tMax = Math.max(...temps), tSpan = Math.max(tMax - tMin, 2);
      const points = hourly.map((h, i) => ({ x: i * cellW + cellW / 2, y: 36 - ((h.temp - tMin) / tSpan) * 26 }));
      const pathD = points.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
      const dotsSvg = points.map((p, i) => {
        const isSel = i === selectedIdx;
        return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isSel ? 5 : 2.8}" fill="${isSel ? "var(--accent-primary)" : "var(--bg-surface)"}" stroke="var(--accent-primary)" stroke-width="${isSel ? 2.6 : 1.8}"/>`;
      }).join("");

      const latestAir = airTrend.items[airTrend.items.length - 1];
      const g10 = pmGrade("pm10", latestAir.pm10);
      const g25 = pmGrade("pm25", latestAir.pm25);
      const activeStationLabel = airTrend.isBackup ? `${airTrend.stationName} 측정소 (${airTrend.backupDistKm}km · 대체)` : `${airTrend.stationName} 측정소`;

      // 미세먼지 히어로 하단 통합 1안 (확정)
      const heroAirHtml = state.sectionErrors.airQualityHardFail
        ? `
          <div class="hero-air-band" aria-label="미세먼지 및 초미세먼지">
            <div class="section-error-box" role="alert">
              <span>미세먼지 측정 자료 없음 · 근접 측정소 응답 오류</span>
              <button type="button" class="inline-action-btn" id="retryAirBtn">재시도</button>
            </div>
          </div>
        `
        : `
          <div class="hero-air-band" aria-label="미세먼지 및 초미세먼지">
            ${airTrend.isBackup ? `
              <div class="air-fallback-note" role="status">
                ${airTrend.primaryStationName} 측정소 점검으로 ${airTrend.stationName}(${airTrend.backupDistKm}km) 자료를 표시합니다.
              </div>
            ` : ""}
            <button type="button" class="hero-air-grid-btn" id="openAirTrendBtn" aria-label="미세먼지 ${latestAir.pm10 ?? "자료 없음"} ${g10.label}, 초미세먼지 ${latestAir.pm25 ?? "자료 없음"} ${g25.label}, 눌러서 최근 측정 추이 열기">
              <div class="hero-air-col">
                <div class="hero-air-col-head">
                  <span class="air-label">미세먼지 (PM10)</span>
                  <span class="grade-chip ${g10.cls}"><span aria-hidden="true">${g10.symbol}</span> ${g10.label}</span>
                </div>
                <div class="hero-air-val tabular">${latestAir.pm10 === null ? "—" : latestAir.pm10}<span class="air-unit">µg/m³</span></div>
              </div>
              <div class="hero-air-col">
                <div class="hero-air-col-head">
                  <span class="air-label">초미세먼지 (PM2.5)</span>
                  <span class="grade-chip ${g25.cls}"><span aria-hidden="true">${g25.symbol}</span> ${g25.label}</span>
                </div>
                <div class="hero-air-val tabular">${latestAir.pm25 === null ? "—" : latestAir.pm25}<span class="air-unit">µg/m³</span></div>
              </div>
            </button>
            <div class="hero-air-meta-row">
              <button type="button" class="meta-trigger-btn tabular" id="openAirMetaBtn" aria-label="미세먼지 자료 출처 및 시각 상세 보기">
                <span>${activeStationLabel} · 에어코리아 ${clock.airMeasureStr} · 확정 전</span>
                ${freshness.isStale ? `<span class="stale-badge">오래됨</span>` : ""}
                <span aria-hidden="true">ⓘ</span>
              </button>
              <button type="button" class="hero-air-cue-btn" id="openAirTrendCueBtn" aria-label="미세먼지 최근 측정 추이 보기">
                <span>최근 추이 ›</span>
              </button>
            </div>
          </div>
        `;

      const wGlobalMin = Math.min(...weekly.map(w => w.min));
      const wGlobalMax = Math.max(...weekly.map(w => w.max));
      const wSpan = Math.max(wGlobalMax - wGlobalMin, 1);
      const shortRowsHtml = weekly.filter(w => !w.isMid).map(w => renderWeeklyRow(w, wGlobalMin, wSpan)).join("");
      const midRowsHtml = state.sectionErrors.midForecast
        ? `<div class="section-error-box" role="alert" style="margin-top:10px;"><span><strong>중기예보(+4일~+10일) 오류</strong> · ${region.midAreaName} 자료를 불러오지 못했습니다.</span><button type="button" class="inline-action-btn" id="retryMidBtn">재시도</button></div>`
        : weekly.filter(w => w.isMid).map(w => renderWeeklyRow(w, wGlobalMin, wSpan)).join("");

      const diffYCls = comp.diffMax > 0 ? "warm" : (comp.diffMax < 0 ? "cool" : "");
      const diffYArrow = comp.diffMax > 0 ? "▲" : (comp.diffMax < 0 ? "▼" : "—");
      const receivedText = freshness.isRefreshing ? "갱신 중…" : formatReceivedLabel(state.lastUpdatedMinutesAgo, state.lastRefreshSucceeded && !freshness.isOffline && !state.quotaExceeded);

      contentEl.innerHTML = `
        <div class="hero-stage sky-${region.sky}">
          ${buildHeroAmbientMarkup(region.sky, state.heroBgMode)}
          <div class="hero-content">
            <div class="hero-primary-row">
              <div class="hero-temp-block">
                <p class="hero-temp tabular" aria-label="현재 기온 ${region.baseTemp}도">${region.baseTemp.toFixed(1)}°</p>
                <div class="hero-sky-row">
                  <span>${skyLabel(region.sky)}</span>
                  <span class="hero-hilo tabular">최고 ${region.hi.toFixed(0)}° · 최저 ${region.lo.toFixed(0)}°</span>
                </div>
                <span class="hero-sky-note tabular">하늘상태: 예보 보완 (${clock.obsTimeStr} 유효)</span>
              </div>
              <div class="hero-icon-wrap" aria-label="현재 하늘 상태 ${skyLabel(region.sky)}">${weatherIconSvg(region.sky, 66)}</div>
            </div>

            <div class="hero-metrics" aria-label="현재 기상 보조 지표">
              <div class="hero-metric-item">
                <span class="hero-metric-label">습도</span>
                <span class="hero-metric-value tabular">${region.reh}%</span>
              </div>
              <div class="hero-metric-item">
                <span class="hero-metric-label">풍속 · 풍향</span>
                <span class="hero-metric-value tabular">${region.wsd === null ? "관측 없음" : `${region.vec} ${region.wsd.toFixed(1)}m/s`}</span>
              </div>
              <div class="hero-metric-item">
                <span class="hero-metric-label">1시간 강수</span>
                <span class="hero-metric-value tabular">${region.rn1 > 0 ? `${region.rn1.toFixed(1)}mm` : "강수 없음"}</span>
              </div>
              <button type="button" class="hero-metric-btn" id="openApparentDetailBtn" aria-label="계산 체감온도 ${apparent.displayText}, 눌러서 산출식과 입력값 보기">
                <span class="hero-metric-label">계산 체감온도 <span aria-hidden="true">ⓘ</span></span>
                <span class="hero-metric-value tabular ${apparent.status !== "ok" ? "muted-val" : ""}">${apparent.displayText}</span>
              </button>
            </div>

            <div class="hero-release-row">
              <button type="button" class="meta-trigger-btn tabular" id="openNowcastMetaBtn" aria-label="현재 날씨 자료 출처 및 시각 상세 보기">
                <span>기상청 실황 · ${clock.obsTimeStr} 자료 · ${receivedText}</span>
                ${freshness.isStale ? `<span class="stale-badge">오래됨</span>` : ""}
                <span aria-hidden="true">ⓘ</span>
              </button>
            </div>

            ${heroAirHtml}
          </div>
        </div>

        <div class="section-stack">
          <button type="button" class="compare-strip" id="homeCompareBtn" aria-label="어제와 비교 요약, 눌러서 과거 날씨 탭으로 이동">
            <div class="compare-strip-top">
              <span class="compare-kicker">어제와 비교 · 최근 10일</span>
              <span class="chevron" aria-hidden="true">›</span>
            </div>
            <div class="compare-headline">오늘 최고기온은 ${formatDeltaText("어제", comp.diffMax)}</div>
            <div class="compare-deltas tabular">
              <span class="delta-pill ${diffYCls}">${diffYArrow} 최고 ${comp.diffMax > 0 ? "+" : ""}${comp.diffMax.toFixed(1)}℃</span>
              <span class="delta-pill">최저 ${comp.diffMin > 0 ? "+" : ""}${comp.diffMin.toFixed(1)}℃</span>
            </div>
            <div class="compare-station-meta tabular">오늘(예보) · 어제(${region.asosName} 기상관측소 관측 · 약 ${region.asosDistKm}km)</div>
          </button>

          <article class="surface-card" aria-label="48시간 시간별 예보">
            <div class="section-header">
              <div>
                <h2 class="section-title">시간별 예보 (48시간)</h2>
                <button type="button" class="meta-trigger-btn tabular" id="openHourlyMetaBtn" style="padding-top:2px; min-height:28px;">
                  <span>기상청 예보 · ${clock.fcstReleaseStr} 발표</span>
                  ${freshness.isStale ? `<span class="stale-badge">오래됨</span>` : ""}
                  <span aria-hidden="true">ⓘ</span>
                </button>
              </div>
              <div class="hourly-controls">
                <button type="button" class="scroll-mini-btn" id="hourlyPrevBtn" aria-label="이전 시간대로 스크롤">‹</button>
                <button type="button" class="scroll-mini-btn" id="hourlyNextBtn" aria-label="다음 시간대로 스크롤">›</button>
              </div>
            </div>

            ${summary.available ? `
              <button type="button" class="hourly-summary-line hourly-summary-btn tabular" id="hourlySummaryBtn" aria-label="예보 요약 ${summary.text}, 눌러서 해당 시각 상세 보기">
                <span>${summary.text}</span>
                <span class="chevron" aria-hidden="true">›</span>
              </button>
            ` : `
              <div class="hourly-summary-line">
                <span>예보 요약 자료 없음</span>
                <button type="button" class="inline-action-btn" id="retrySummaryBtn">재시도</button>
              </div>
            `}

            <div class="hourly-viewport" id="hourlyViewport" tabindex="0" aria-label="시간별 기온 및 강수확률 목록">

                <div class="hourly-row-top">
                  ${hourly.map(h => `
                    <button type="button" class="hourly-cell-btn ${h.idx === 0 ? "is-now" : ""} ${h.idx === selectedIdx ? "is-selected" : ""}" data-hour-idx="${h.idx}" aria-pressed="${h.idx === selectedIdx}" aria-label="${h.dateIso} ${h.timeStr} ${skyLabel(h.sky)} 기온 ${h.temp}도 강수확률 ${h.pop}%">
                      <span class="hourly-time tabular">${h.label}</span>
                      <span class="hourly-tag">${h.isUltra ? "초단기" : ""}</span>
                      ${weatherIconSvg(h.sky, 24)}
                      <span class="hourly-temp tabular">${Math.round(h.temp)}°</span>
                    </button>
                  `).join("")}
                </div>
                <svg class="hourly-spline-svg" width="${svgW}" height="44" viewBox="0 0 ${svgW} 44" aria-hidden="true">
                  <path d="${pathD}" fill="none" stroke="var(--accent-primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                  ${dotsSvg}
                </svg>
                <div class="hourly-row-bottom">
                  ${hourly.map(h => `<div class="hourly-cell-foot"><span class="hourly-pop tabular ${h.pop === 0 ? "zero" : ""}">${h.pop > 0 ? `💧${h.pop}%` : "0%"}</span></div>`).join("")}
                </div>
              </div>
            </div>
          </article>

          <article class="surface-card" aria-label="오늘부터 10일간 주간 예보">
            <div class="section-header">
              <div>
                <h2 class="section-title">주간 예보 (오늘 ~ +10일)</h2>
                <button type="button" class="meta-trigger-btn tabular" id="openWeeklyMetaBtn" style="padding-top:2px; min-height:28px;">
                  <span>단기 ${clock.fcstReleaseStr} · 중기 ${clock.midReleaseStr} 발표</span>
                  ${freshness.isStale ? `<span class="stale-badge">오래됨</span>` : ""}
                  <span aria-hidden="true">ⓘ</span>
                </button>
              </div>
            </div>
            <div class="weekly-list">${shortRowsHtml}${midRowsHtml}</div>
          </article>
        </div>
      `;

      document.getElementById("homeCompareBtn").onclick = () => switchTab("history");
      document.getElementById("openApparentDetailBtn").onclick = (e) => openApparentTempSheet(region, clock, apparent, e.currentTarget);

      document.getElementById("openNowcastMetaBtn").onclick = (e) => openDataMetaSheet({
        sectionTitle: "현재 날씨 자료 정보",
        source: "기상청 초단기실황 (하늘상태: 초단기예보 보완)",
        kind: "실황 관측 · 예보 보완",
        dataTime: `${clock.todayStr} ${clock.obsTimeStr}`,
        validTime: `${clock.todayStr} ${clock.obsTimeStr} (하늘상태 보완)`,
        receivedTime: receivedText,
        location: region.name,
        freshness
      }, e.currentTarget);

      document.getElementById("openHourlyMetaBtn").onclick = (e) => openDataMetaSheet({
        sectionTitle: "시간별 예보 자료 정보",
        source: "기상청 초단기예보(6시간 이내) · 단기예보",
        kind: "시간별 예보",
        dataTime: `${clock.todayStr} ${clock.fcstReleaseStr}`,
        validTime: `${hourly[0].dateIso} ${hourly[0].timeStr} ~ ${hourly[hourly.length - 1].dateIso} ${hourly[hourly.length - 1].timeStr}`,
        receivedTime: receivedText,
        location: region.name,
        freshness
      }, e.currentTarget);

      const openAirMetaBtn = document.getElementById("openAirMetaBtn");
      if (openAirMetaBtn) {
        openAirMetaBtn.onclick = (e) => openDataMetaSheet({
          sectionTitle: "미세먼지 자료 정보",
          source: "한국환경공단 에어코리아",
          kind: "비확정 실시간 측정 · 1시간 기준 등급",
          dataTime: `${clock.todayStr} ${clock.airMeasureStr}`,
          validTime: `최근 ${airTrend.count}건 (${airTrend.startLabel} ~ ${airTrend.endLabel})`,
          receivedTime: receivedText,
          location: activeStationLabel,
          freshness
        }, e.currentTarget);
      }

      document.getElementById("openWeeklyMetaBtn").onclick = (e) => openDataMetaSheet({
        sectionTitle: "주간 예보 자료 정보",
        source: "기상청 단기예보(+3일까지) · 중기예보(+4~+10일)",
        kind: "일별 예보 (+8~+10일은 종일 단일 제공)",
        dataTime: `단기 ${clock.todayStr} ${clock.fcstReleaseStr} · 중기 ${clock.todayStr} ${clock.midReleaseStr}`,
        validTime: `${weekly[0].dateIso} ~ ${weekly[weekly.length - 1].dateIso} (11일간)`,
        receivedTime: receivedText,
        location: `${region.name} (${region.midAreaName})`,
        freshness
      }, e.currentTarget);

      const hv = document.getElementById("hourlyViewport");
      document.getElementById("hourlyPrevBtn").onclick = () => hv.scrollBy({ left: -240, behavior: "smooth" });
      document.getElementById("hourlyNextBtn").onclick = () => hv.scrollBy({ left: 240, behavior: "smooth" });

      contentEl.querySelectorAll("[data-hour-idx]").forEach(btn => {
        btn.onclick = () => {
          const idx = Number(btn.dataset.hourIdx);
          state.selectedHourlyKey = `${region.id}:${idx}`;
          const savedScroll = hv.scrollLeft;
          renderHome();
          const newHv = document.getElementById("hourlyViewport");
          if (newHv) newHv.scrollLeft = savedScroll;
          openHourlyDetailSheet(region, hourly, idx, document.querySelector(`[data-hour-idx="${idx}"]`));
        };
      });

      const summaryBtn = document.getElementById("hourlySummaryBtn");
      if (summaryBtn && summary.targetIdx !== null) {
        summaryBtn.onclick = (e) => {
          state.selectedHourlyKey = `${region.id}:${summary.targetIdx}`;
          openHourlyDetailSheet(region, hourly, summary.targetIdx, e.currentTarget);
        };
      }
      const retrySummaryBtn = document.getElementById("retrySummaryBtn");
      if (retrySummaryBtn) retrySummaryBtn.onclick = () => { renderHome(); showSnackbar("예보 요약을 다시 불러왔습니다."); };

      const triggerAirTrend = (e) => {
        state.selectedAirTrendIdx = airTrend.items.length - 1;
        openAirTrendSheet(region, clock, airTrend, freshness, e.currentTarget);
      };
      const openAirBtn = document.getElementById("openAirTrendBtn");
      if (openAirBtn) openAirBtn.onclick = triggerAirTrend;
      const openAirCueBtn = document.getElementById("openAirTrendCueBtn");
      if (openAirCueBtn) openAirCueBtn.onclick = triggerAirTrend;

      contentEl.querySelectorAll("[data-week-idx]").forEach(btn => {
        btn.onclick = () => {
          const dayObj = weekly.find(w => w.d === Number(btn.dataset.weekIdx));
          if (dayObj) openWeeklyDetailSheet(region, dayObj, hourly, btn);
        };
      });

      const retryMid = document.getElementById("retryMidBtn");
      if (retryMid) retryMid.onclick = () => { state.sectionErrors.midForecast = false; renderHome(); showSnackbar("중기예보를 다시 불러왔습니다."); };
      const retryAir = document.getElementById("retryAirBtn");
      if (retryAir) retryAir.onclick = () => { state.sectionErrors.airQualityHardFail = false; renderHome(); syncSimulatorButtons(); showSnackbar("미세먼지 자료를 다시 불러왔습니다."); };

      if (state.heroBgMode === "c") {
        heroParticlePaused = false;
        requestAnimationFrame(() => startHeroParticleLoop(region.sky));
      }
    }

    function renderWeeklyRow(w, globalMin, span) {
      const leftPct = ((w.min - globalMin) / span) * 100;
      const widthPct = Math.max(((w.max - w.min) / span) * 100, 10);
      const popLabel = w.resolution === "whole" ? `종일 ${w.wholePop}%` : `${w.displayPop}%`;
      const aria = w.resolution === "whole"
        ? `${w.dateIso} ${w.dayLabel}, 최저 ${w.min}도, 최고 ${w.max}도, 종일 ${skyLabel(w.wholeSky)} 강수확률 ${w.wholePop}%`
        : `${w.dateIso} ${w.dayLabel}, 최저 ${w.min}도, 최고 ${w.max}도, 오전 ${w.amPop}%, 오후 ${w.pmPop}%`;
      return `
        <button type="button" class="weekly-row-btn" data-week-idx="${w.d}" aria-label="${aria}">
          <div class="weekly-day tabular">${w.dayLabel}<small>${w.dateLabel}</small></div>
          <div class="weekly-sky tabular">${weatherIconSvg(w.displaySky, 20)}<span>${popLabel}</span></div>
          <div class="weekly-min tabular">${w.min}°</div>
          <div class="range-track" aria-hidden="true"><div class="range-fill" style="left:${leftPct.toFixed(1)}%; width:${widthPct.toFixed(1)}%;"></div></div>
          <div class="weekly-max tabular">${w.max}°</div>
        </button>
      `;
    }

    /* ==========================================================================
       6. 과거 날씨 탭 (어제 비교 · 최근 10일 · P6 전체 폭 구분선 목록)
       ========================================================================== */
    function renderHistory() {
      const el = document.getElementById("historyContent");
      const region = getActiveRegion();
      const clock = getClockContext();
      const comp = buildYesterdayComparison(region, clock);
      const valid = !state.historyError;
      const series = valid ? buildHistorySeries(region, state.historyStart, state.historyEnd) : [];

      let chartBlock = "";
      if (valid && series.length > 0) {
        const maxTemp = Math.max(...series.map(r => r.maxTa));
        const minTemp = Math.min(...series.map(r => r.minTa));
        const validRainRows = series.filter(r => r.sumRn !== null);
        const maxRain = Math.max(...validRainRows.map(r => r.sumRn), 10);
        const totalRain = validRainRows.reduce((a, b) => a + b.sumRn, 0);
        const missingRainDays = series.length - validRainRows.length;
        const warmest = series.reduce((a, b) => (b.maxTa > a.maxTa ? b : a), series[0]);
        const coldest = series.reduce((a, b) => (b.minTa < a.minTa ? b : a), series[0]);

        const svgW = Math.max(300, series.length * 36), svgH = 210, padL = 34, padR = 16, padT = 18, padB = 30;
        const plotW = svgW - padL - padR, plotH = svgH - padT - padB, tSpan = Math.max(maxTemp - minTemp, 4);
        const xAt = (i) => padL + (series.length === 1 ? plotW / 2 : (i / (series.length - 1)) * plotW);
        const yTemp = (t) => padT + plotH - ((t - minTemp) / tSpan) * (plotH * 0.76) - plotH * 0.16;
        const barMaxH = plotH * 0.32;

        const maxPath = series.map((r, i) => `${i === 0 ? "M" : "L"}${xAt(i).toFixed(1)},${yTemp(r.maxTa).toFixed(1)}`).join(" ");
        const minPath = series.map((r, i) => `${i === 0 ? "M" : "L"}${xAt(i).toFixed(1)},${yTemp(r.minTa).toFixed(1)}`).join(" ");
        const areaPath = `${maxPath} ` + [...series].reverse().map((r, ri) => `L${xAt(series.length - 1 - ri).toFixed(1)},${yTemp(r.minTa).toFixed(1)}`).join(" ") + " Z";

        const barW = Math.max(6, Math.min(14, plotW / Math.max(series.length, 1) * 0.45));
        const barsSvg = series.map((r, i) => {
          if (r.sumRn === null || r.sumRn <= 0) return "";
          const h = Math.max(3, (r.sumRn / maxRain) * barMaxH);
          return `<rect x="${(xAt(i) - barW / 2).toFixed(1)}" y="${(padT + plotH - h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--rain-color)" opacity="0.45"/>`;
        }).join("");

        const tickStep = series.length > 6 ? 2 : 1;
        const xTicks = series.map((r, i) => (i !== 0 && i !== series.length - 1 && i % tickStep !== 0) ? "" : `<text x="${xAt(i).toFixed(1)}" y="${svgH - 8}" text-anchor="middle" font-size="10" fill="var(--text-tertiary)">${r.shortDate}</text>`).join("");
        const yTicks = [maxTemp, (maxTemp + minTemp) / 2, minTemp].map(t => {
          const y = yTemp(t);
          return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${svgW - padR}" y2="${y.toFixed(1)}" stroke="var(--border-subtle)" stroke-dasharray="3 3"/><text x="${padL - 5}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-tertiary)">${Math.round(t)}°</text>`;
        }).join("");

        const hitTargets = series.map((r, i) => {
          const cx = xAt(i);
          return `<g class="chart-hit-dot" data-history-date="${r.date}" tabindex="0" role="button" aria-label="${r.date} 최고 ${r.maxTa}도, 최저 ${r.minTa}도, ${r.sumRn === null ? "강수량 결측" : `강수량 ${r.sumRn}mm`}">
            <circle cx="${cx.toFixed(1)}" cy="${yTemp(r.maxTa).toFixed(1)}" r="4.2" fill="var(--temp-warm)"/>
            <circle cx="${cx.toFixed(1)}" cy="${yTemp(r.minTa).toFixed(1)}" r="3.6" fill="var(--temp-cool)"/>
            <rect x="${(cx - 12).toFixed(1)}" y="${padT}" width="24" height="${plotH}" fill="transparent"/>
          </g>`;
        }).join("");

        const rainSummaryText = missingRainDays > 0
          ? `유효 누적 강수 ${totalRain.toFixed(1)}mm (유효 ${validRainRows.length}/${series.length}일 · 결측 ${missingRainDays}일 제외)`
          : `누적 강수 ${totalRain.toFixed(1)}mm (${series.length}/${series.length}일 유효)`;

        chartBlock = `
          <div class="chart-legend">
            <span class="legend-item"><span class="legend-swatch" style="background:var(--temp-warm);"></span>최고기온</span>
            <span class="legend-item"><span class="legend-swatch" style="background:var(--temp-cool);"></span>최저기온</span>
            <span class="legend-item"><span class="legend-swatch bar" style="background:var(--rain-color); opacity:0.6;"></span>일강수량(mm)</span>
          </div>
          <div class="chart-scroll">
            <svg class="history-svg" viewBox="0 0 ${svgW} ${svgH}" role="img" aria-label="${series.length}일간 최고·최저기온 및 일강수량 그래프">
              ${yTicks}<path d="${areaPath}" fill="var(--accent-primary)" opacity="0.1"/>${barsSvg}
              <path d="${maxPath}" fill="none" stroke="var(--temp-warm)" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="${minPath}" fill="none" stroke="var(--temp-cool)" stroke-width="2.2" stroke-linejoin="round"/>
              ${xTicks}${hitTargets}
            </svg>
          </div>
          <div class="chart-summary-box tabular" aria-live="polite">
            <div><strong>요약 (${series.length}일 · 기온 ${series.length}/${series.length}일):</strong> 최고 ${warmest.maxTa.toFixed(1)}℃(${warmest.shortDate}) · 최저 ${coldest.minTa.toFixed(1)}℃(${coldest.shortDate})</div>
            <div>${rainSummaryText}</div>
          </div>
          <div class="history-day-list flat-list" aria-label="일별 관측 목록">
            ${[...series].reverse().map(r => `
              <button type="button" class="history-day-btn tabular" data-history-date="${r.date}">
                <strong>${r.date}</strong>
                <span>최저 <strong style="color:var(--temp-cool);">${r.minTa.toFixed(1)}°</strong> · 최고 <strong style="color:var(--temp-warm);">${r.maxTa.toFixed(1)}°</strong></span>
                <span style="color:var(--text-secondary);">${r.sumRn === null ? "강수 결측" : `${r.sumRn.toFixed(1)}mm`} <span class="chevron" aria-hidden="true">›</span></span>
              </button>
            `).join("")}
          </div>
        `;
      }

      el.innerHTML = `
        <article class="surface-card" aria-label="어제와 비교">
          <div class="section-header">
            <div>
              <h2 class="section-title">어제와 비교</h2>
              <span class="section-sub tabular">${region.asosName} 기상관측소 · 약 ${region.asosDistKm}km</span>
            </div>
          </div>
          <div class="compare-table-wrap">
            <table class="compare-table tabular">
              <thead><tr><th scope="col">구분</th><th scope="col">최고</th><th scope="col">최저</th><th scope="col">일평균</th><th scope="col">일강수</th></tr></thead>
              <tbody>
                <tr>
                  <td>${comp.today.label}</td>
                  <td><strong style="color:var(--temp-warm);">${comp.today.max.toFixed(1)}°</strong></td>
                  <td><strong style="color:var(--temp-cool);">${comp.today.min.toFixed(1)}°</strong></td>
                  <td style="color:var(--text-tertiary);">미확정</td>
                  <td style="color:var(--text-tertiary);">미확정</td>
                </tr>
                <tr>
                  <td>${comp.yesterday.label}</td>
                  <td>${comp.yesterday.max.toFixed(1)}°</td>
                  <td>${comp.yesterday.min.toFixed(1)}°</td>
                  <td>${comp.yesterday.avg.toFixed(1)}°</td>
                  <td>${comp.yesterday.rain.toFixed(1)}mm</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="compare-deltas tabular" style="margin-top:12px;">
            <span class="delta-pill">최고 · ${formatDeltaText("어제", comp.diffMax)}</span>
            <span class="delta-pill">최저 · ${formatDeltaText("어제", comp.diffMin)}</span>
          </div>
          <p class="compare-footnote">오늘 최고·최저기온은 기상청 예보, 어제 수치는 관측소 일자료 기준입니다.<br/>오늘 일평균과 일강수량은 관측 종료 전까지 미확정으로 표시합니다.</p>
        </article>

        <article class="surface-card" aria-label="최근 10일 날씨 추이">
          <div class="section-header">
            <div>
              <h2 class="section-title">최근 10일 날씨 추이</h2>
              <span class="section-sub tabular">${clock.minHistoryStr} ~ ${clock.yesterdayStr}</span>
            </div>
          </div>
          <div class="preset-row" role="group" aria-label="빠른 기간 선택">
            <button type="button" class="chip-btn" data-preset="1w" aria-pressed="${state.historyPreset === "1w"}">1주</button>
            <button type="button" class="chip-btn" data-preset="10d" aria-pressed="${state.historyPreset === "10d"}">10일</button>
            <button type="button" class="chip-btn" data-preset="custom" aria-pressed="${state.historyPreset === "custom"}">직접 선택</button>
          </div>
          <form id="historyRangeForm" novalidate>
            <div class="date-form-grid">
              <div class="field-group">
                <label class="field-label" for="histStartInput">시작일</label>
                <input type="date" id="histStartInput" class="text-input tabular" min="${clock.minHistoryStr}" max="${clock.yesterdayStr}" value="${state.historyStart}" aria-invalid="${Boolean(state.historyError)}" aria-describedby="historyRangeErr"/>
              </div>
              <div class="field-group">
                <label class="field-label" for="histEndInput">종료일</label>
                <input type="date" id="histEndInput" class="text-input tabular" min="${clock.minHistoryStr}" max="${clock.yesterdayStr}" value="${state.historyEnd}" aria-invalid="${Boolean(state.historyError)}" aria-describedby="historyRangeErr"/>
              </div>
            </div>
            <div style="margin-top:10px; display:flex; justify-content:flex-end;">
              <button type="submit" class="primary-btn">조회</button>
            </div>
            ${state.historyError ? `<div id="historyRangeErr" class="field-error" role="alert">${state.historyError}</div>` : `<div id="historyRangeErr" class="sr-only"></div>`}
          </form>
          <div style="margin-top:14px;">${chartBlock}</div>
        </article>
      `;

      el.querySelectorAll("[data-preset]").forEach(btn => {
        btn.onclick = () => {
          const p = btn.dataset.preset;
          state.historyPreset = p;
          if (p === "1w") { state.historyStart = addDaysIso(clock.yesterdayStr, -6); state.historyEnd = clock.yesterdayStr; state.historyError = ""; renderHistory(); }
          else if (p === "10d") { state.historyStart = clock.minHistoryStr; state.historyEnd = clock.yesterdayStr; state.historyError = ""; renderHistory(); }
          else { renderHistory(); document.getElementById("histStartInput").focus(); }
        };
      });

      document.getElementById("historyRangeForm").onsubmit = (e) => {
        e.preventDefault();
        const sVal = document.getElementById("histStartInput").value;
        const eVal = document.getElementById("histEndInput").value;
        state.historyStart = sVal; state.historyEnd = eVal; state.historyPreset = "custom";
        if (!sVal || !eVal) state.historyError = "시작일과 종료일을 모두 선택해 주세요.";
        else if (sVal < clock.minHistoryStr) state.historyError = `${clock.minHistoryStr}부터 선택할 수 있습니다.`;
        else if (eVal > clock.yesterdayStr) state.historyError = `종료일은 어제(${clock.yesterdayStr})까지만 선택할 수 있습니다.`;
        else if (sVal > eVal) state.historyError = "시작일은 종료일보다 같거나 이전이어야 합니다.";
        else state.historyError = "";
        renderHistory();
        if (state.historyError) announce(state.historyError);
      };

      el.querySelectorAll("[data-history-date]").forEach(node => {
        const openDetail = () => {
          const row = series.find(r => r.date === node.dataset.historyDate);
          if (row) openDateDetailSheet(region, row, node);
        };
        node.onclick = openDetail;
        node.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openDetail(); } };
      });
    }

    /* ==========================================================================
       7. 지역 탭 (P6 상자 대신 선 · P7 입력창 분리 · P8 정렬선 · P11 말줄임)
       ========================================================================== */
    function renderLocations() {
      const el = document.getElementById("locationsContent");
      const q = state.searchQuery;
      const trimmedLen = q.trim().length;

      let searchResultHtml = "";
      if (trimmedLen === 1) {
        searchResultHtml = `<p class="search-hint" role="status">2글자 이상 입력해 주세요.</p>`;
      } else if (trimmedLen >= 2) {
        const matches = REGION_CATALOG.filter(r => r.name.includes(q.trim()) || r.shortName.includes(q.trim()));
        if (matches.length === 0) {
          searchResultHtml = `
            <div style="padding:14px 0; text-align:center;">
              <p style="margin:0 0 8px; font-size:0.86em; color:var(--text-secondary);">'${escapeHtml(q.trim())}' 검색 결과가 없습니다.</p>
              <button type="button" class="secondary-btn" id="clearSearchBtn">지우기</button>
            </div>
          `;
        } else {
          searchResultHtml = `
            <div class="flat-list" role="list" aria-label="지역 검색 결과 ${matches.length}건" style="margin-top:10px;">
              ${matches.map(r => {
                const isFav = state.favorites.includes(r.id);
                return `
                  <div class="loc-row" role="listitem">
                    <button type="button" class="loc-row-main" data-select-region="${r.id}" aria-label="${r.name}, ${skyLabel(r.sky)} ${r.baseTemp.toFixed(1)}도">
                      <span class="loc-row-title"><span class="loc-row-name-clamp">${r.name}</span></span>
                      <span class="loc-row-sub tabular">${skyLabel(r.sky)} · ${r.baseTemp.toFixed(1)}°</span>
                    </button>
                    <button type="button" class="compact-outline-btn" data-toggle-fav="${r.id}" ${isFav ? "disabled" : ""} aria-label="${r.shortName} ${isFav ? "저장됨" : "추가"}">
                      <span>${isFav ? "저장됨" : "추가"}</span>
                    </button>
                  </div>
                `;
              }).join("")}
            </div>
          `;
        }
      } else {
        searchResultHtml = `<p class="search-hint">예: 강남 · 부산 · 제주 · 대구 · 강릉 · 울릉 · 백령</p>`;
      }

      const favRegions = state.favorites.map(id => REGION_CATALOG.find(r => r.id === id)).filter(Boolean);

      el.innerHTML = `
        <div>
          <p class="group-heading"><span>지역 검색</span><span class="section-sub">오프라인 검색</span></p>
          <label class="sr-only" for="regionSearchInput">시, 군, 구, 읍면동 검색</label>
          <div class="search-row">
            <input type="search" id="regionSearchInput" class="text-input" maxlength="30" placeholder="시·군·구·읍면동 입력 (2글자 이상)" value="${escapeHtml(state.searchQuery)}"/>
            ${trimmedLen > 0 ? `<button type="button" class="compact-text-btn" id="clearSearchInlineBtn">지우기</button>` : ""}
          </div>
          ${searchResultHtml}
        </div>

        <div>
          <p class="group-heading"><span>현재 위치</span></p>
          <div class="flat-list">
            <div class="loc-row">
              <button type="button" class="loc-row-main" id="useCurrentLocBtn">
                <span class="loc-row-title">
                  <span>현재 위치 자동 인식</span>
                  ${state.isUsingCurrentLocation && state.scenario !== "perm-denied" ? `<span class="primary-pill">사용 중</span>` : ""}
                </span>
                <span class="loc-row-sub">${state.scenario === "perm-denied" ? "권한이 꺼져 있습니다." : "대략적인 위치로 주변 날씨를 찾습니다."}</span>
              </button>
              <button type="button" class="compact-outline-btn" id="openLocPermSettingBtn"><span>${state.scenario === "perm-denied" ? "설정" : "안내"}</span></button>
            </div>
          </div>
        </div>

        <div>
          <p class="group-heading"><span>즐겨찾기</span><span class="section-sub tabular">${favRegions.length} / 10 · 별표는 위젯 대표</span></p>
          ${favRegions.length === 0 ? `
            <div class="flat-list"><p style="margin:14px 0; font-size:0.85em; color:var(--text-secondary);">저장된 지역이 없습니다.</p></div>
          ` : `
            <div class="flat-list" role="list">
              ${favRegions.map(r => {
                const isPrimary = state.primaryRegionId === r.id;
                const isSelected = state.selectedRegionId === r.id && !state.isUsingCurrentLocation;
                return `
                  <div class="loc-row" role="listitem">
                    <button type="button" class="loc-row-main" data-select-region="${r.id}" aria-label="${r.name}, ${r.baseTemp.toFixed(1)}도 ${skyLabel(r.sky)}">
                      <span class="loc-row-title">
                        <span class="loc-row-name-clamp">${r.shortName}</span>
                        ${isPrimary ? `<span class="primary-pill">대표</span>` : ""}
                        ${isSelected ? `<span class="section-sub">표시 중</span>` : ""}
                      </span>
                      <span class="loc-row-sub tabular">${r.name} · ${r.baseTemp.toFixed(1)}° · ${skyLabel(r.sky)}</span>
                    </button>
                    <div class="edge-icon-group">
                      <button type="button" class="icon-btn" data-set-primary="${r.id}" aria-label="${r.shortName} 대표 지역 지정" aria-pressed="${isPrimary}">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="${isPrimary ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" aria-hidden="true">
                          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                      </button>
                      <button type="button" class="icon-btn danger" data-delete-fav="${r.id}" aria-label="${r.shortName} 즐겨찾기 삭제">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
                        </svg>
                      </button>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          `}
        </div>
      `;

      const searchInput = document.getElementById("regionSearchInput");
      searchInput.oninput = (e) => {
        const pos = e.target.selectionStart;
        state.searchQuery = e.target.value;
        renderLocations();
        const fresh = document.getElementById("regionSearchInput");
        fresh.focus();
        fresh.setSelectionRange(pos, pos);
      };

      const clearAction = () => { state.searchQuery = ""; renderLocations(); document.getElementById("regionSearchInput").focus(); };
      const clearBtn = document.getElementById("clearSearchBtn");

      document.getElementById("openLocPermSettingBtn").onclick = (e) => {
        if (state.scenario === "perm-denied") jumpToSettingSection("setting-location");
        else openPermissionModal(e.currentTarget);
      };

      document.getElementById("useCurrentLocBtn").onclick = () => {
        if (state.scenario === "perm-denied") { openPermissionModal(document.getElementById("useCurrentLocBtn")); return; }
        state.selectedRegionId = "seoul-jongno"; state.isUsingCurrentLocation = true; state.selectedHourlyKey = null;
        switchTab("home");
        showSnackbar("현재 위치(서울 종로구) 날씨로 전환했습니다.");
      };

      el.querySelectorAll("[data-select-region]").forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.selectRegion;
          if (state.scenario === "longest") state.scenario = "normal";
          state.selectedRegionId = id; state.isUsingCurrentLocation = false; state.selectedHourlyKey = null;
          switchTab("home");
          const r = REGION_CATALOG.find(x => x.id === id);
          if (r) showSnackbar(`${r.shortName} 날씨로 전환했습니다.`);
        };
      });

      el.querySelectorAll("[data-toggle-fav]").forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.toggleFav;
          const r = REGION_CATALOG.find(x => x.id === id);
          if (state.favorites.includes(id)) return;
          if (state.favorites.length >= 10) { showSnackbar("즐겨찾기는 최대 10개까지 저장할 수 있습니다."); return; }
          state.favorites.push(id);
          if (!state.primaryRegionId) state.primaryRegionId = id;
          renderAll();
          showSnackbar(`${r.shortName}을(를) 추가했습니다.`);
        };
      });

      el.querySelectorAll("[data-set-primary]").forEach(btn => {
        btn.onclick = () => {
          state.primaryRegionId = btn.dataset.setPrimary;
          const r = REGION_CATALOG.find(x => x.id === state.primaryRegionId);
          renderAll();
          showSnackbar(`${r.shortName}을(를) 대표 지역으로 지정했습니다.`);
        };
      });

      el.querySelectorAll("[data-delete-fav]").forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.deleteFav;
          const idx = state.favorites.indexOf(id);
          if (idx === -1) return;
          const r = REGION_CATALOG.find(x => x.id === id);
          const prevPrimary = state.primaryRegionId;
          state.favorites.splice(idx, 1);

          let notice = `${r.shortName}을(를) 삭제했습니다.`;
          if (prevPrimary === id) {
            if (state.favorites.length > 0) {
              state.primaryRegionId = state.favorites[0];
              const nextP = REGION_CATALOG.find(x => x.id === state.primaryRegionId);
              notice = `${r.shortName} 삭제 · 대표 지역을 ${nextP.shortName}으로 변경했습니다.`;
            } else {
              state.primaryRegionId = null;
              notice = `${r.shortName} 삭제 · 대표 지역이 미지정 상태가 되었습니다.`;
            }
          }
          state.deleteUndoStack.push({ id, index: idx, prevPrimary });
          renderAll();
          showSnackbar(notice, "되돌리기", () => {
            const last = state.deleteUndoStack.pop();
            if (!last) return;
            if (!state.favorites.includes(last.id)) state.favorites.splice(Math.min(last.index, state.favorites.length), 0, last.id);
            state.primaryRegionId = last.prevPrimary;
            renderAll();
            announce("즐겨찾기와 대표 지역 설정을 복원했습니다.");
          });
        };
      });
    }

    /**
     * P7 & 설정 시그니처 §4: 실제 글자 폭 + 컨트롤 자연 폭 측정으로 1줄 기본 / 넘칠 때만 2줄 전환
     */
    function measureSettingRows() {
      const rows = document.querySelectorAll('#settingsContent .setting-row[data-auto-stack="true"]');
      rows.forEach(row => {
        row.classList.remove("is-stacked");
        const textEl = row.querySelector(".setting-text");
        const ctrlEl = row.querySelector(".setting-ctrl");
        if (!textEl || !ctrlEl) return;
        const available = row.clientWidth - 32; // 좌우 패딩 16*2
        if (available <= 0) return;

        const labelEl = textEl.querySelector(".setting-label");
        const descEl = textEl.querySelector(".setting-desc");
        const labelW = labelEl ? Math.ceil(labelEl.getBoundingClientRect().width) : 48;
        const descMinW = descEl ? Math.min(Math.ceil(descEl.getBoundingClientRect().width), 120) : 0;
        const neededTextW = Math.max(labelW, descMinW);
        const ctrlW = Math.ceil(ctrlEl.scrollWidth);
        const ctrlOverflow = ctrlEl.scrollWidth > ctrlEl.clientWidth + 1;

        if (neededTextW + ctrlW + 12 > available || ctrlOverflow) {
          row.classList.add("is-stacked");
        }
      });
    }

       9. 바텀시트 · 상세 정보 창 · 문서 창 (§11 고정 규격)
       ========================================================================== */
    function openModal(title, bodyHtml, triggerEl = null, restoreSelector = null) {
      if (!document.getElementById("modalBackdrop").classList.contains("open")) {
        lastFocusedElement = triggerEl || document.activeElement;
      }
      if (restoreSelector) lastFocusRestoreSelector = restoreSelector;
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = bodyHtml;
      const backdrop = document.getElementById("modalBackdrop");
      backdrop.classList.add("open");
      backdrop.setAttribute("aria-hidden", "false");
      document.getElementById("modalDialog").focus();
    }

    function closeModal() {
      const backdrop = document.getElementById("modalBackdrop");
      if (!backdrop.classList.contains("open")) return;
      backdrop.classList.remove("open");
      backdrop.setAttribute("aria-hidden", "true");
      let target = lastFocusedElement;
      if ((!target || !document.contains(target)) && lastFocusRestoreSelector) target = document.querySelector(lastFocusRestoreSelector);
      if (target && typeof target.focus === "function") target.focus();
      lastFocusedElement = null;
      lastFocusRestoreSelector = null;
    }

      const h = hourly[idx];
      if (!h) return;
      const bodyHtml = `
        <p style="margin:0; font-size:0.84em; color:var(--text-secondary);" class="tabular">${region.shortName} · ${h.dateIso} (${koreanWeekday(h.dateIso)}) ${h.timeStr}</p>

        </div>
      `;
      openModal(`${h.dateIso} ${h.timeStr} 예보`, bodyHtml, triggerEl, `[data-hour-idx="${idx}"]`);
      document.getElementById("closeHourDetailBtn").onclick = closeModal;
      const stepHour = (nextIdx) => {
        const hv = document.getElementById("hourlyViewport");
        const savedScroll = hv ? hv.scrollLeft : 0;
        state.selectedHourlyKey = `${region.id}:${nextIdx}`;
        renderHome();
        const freshHv = document.getElementById("hourlyViewport");
        if (freshHv) freshHv.scrollLeft = savedScroll;
        const freshBtn = document.querySelector(`[data-hour-idx="${nextIdx}"]`);
        if (freshBtn) freshBtn.scrollIntoView({ inline: "nearest", block: "nearest" });
        openHourlyDetailSheet(region, hourly, nextIdx, freshBtn);
      };
      const prevBtn = document.getElementById("prevHourDetailBtn");
      const nextBtn = document.getElementById("nextHourDetailBtn");
      if (prevBtn && idx > 0) prevBtn.onclick = () => stepHour(idx - 1);
      if (nextBtn && idx < hourly.length - 1) nextBtn.onclick = () => stepHour(idx + 1);
    }

    function openAirTrendSheet(region, clock, airTrend, freshness, triggerEl) {
      const items = airTrend.items;
      const selIdx = (state.selectedAirTrendIdx !== null && state.selectedAirTrendIdx < items.length) ? state.selectedAirTrendIdx : items.length - 1;
      const sel = items[selIdx];
      const validVals = [];
      items.forEach(it => { if (it.pm10 !== null) validVals.push(it.pm10); if (it.pm25 !== null) validVals.push(it.pm25); });
      const maxVal = Math.max(...validVals, 50);
      const svgW = Math.max(320, items.length * 24), svgH = 184, padL = 34, padR = 14, padT = 18, padB = 28;
      const plotW = svgW - padL - padR, plotH = svgH - padT - padB;
      const xAt = (i) => padL + (items.length === 1 ? plotW / 2 : (i / (items.length - 1)) * plotW);
      const yAt = (v) => padT + plotH - (v / maxVal) * (plotH * 0.88);
      const buildSegmentedPath = (key) => {
        let d = "", open = false;
        items.forEach((it, i) => {
          if (it[key] === null) { open = false; return; }
          d += `${open ? "L" : "M"}${xAt(i).toFixed(1)},${yAt(it[key]).toFixed(1)} `;
          open = true;
        });
        return d.trim();
      };
      const pm10Path = buildSegmentedPath("pm10"), pm25Path = buildSegmentedPath("pm25");
      const yTicks = [maxVal, Math.round(maxVal / 2), 0].map(v => `<line x1="${padL}" y1="${yAt(v).toFixed(1)}" x2="${svgW - padR}" y2="${yAt(v).toFixed(1)}" stroke="var(--border-subtle)" stroke-dasharray="3 3"/><text x="${padL - 5}" y="${(yAt(v) + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-tertiary)">${v}</text>`).join("");
      const xTicks = items.map((it, i) => (i !== 0 && i !== items.length - 1 && i % 4 !== 0) ? "" : `<text x="${xAt(i).toFixed(1)}" y="${svgH - 8}" text-anchor="middle" font-size="10" fill="var(--text-tertiary)">${it.shortLabel}</text>`).join("");
      const dotsAndHits = items.map((it, i) => {
        const cx = xAt(i), isSel = i === selIdx;
        return `<g class="chart-hit-dot" data-air-idx="${i}" tabindex="0" role="button" aria-label="${it.dateIso} ${it.timeStr} PM10 ${it.pm10 ?? "결측"}, PM2.5 ${it.pm25 ?? "결측"}">
          ${isSel ? `<line x1="${cx.toFixed(1)}" y1="${padT}" x2="${cx.toFixed(1)}" y2="${padT + plotH}" stroke="var(--accent-primary)" stroke-dasharray="2 2" opacity="0.6"/>` : ""}
          ${it.pm10 !== null ? `<circle cx="${cx.toFixed(1)}" cy="${yAt(it.pm10).toFixed(1)}" r="${isSel ? 4.8 : 2.8}" fill="var(--accent-primary)"/>` : ""}
          ${it.pm25 !== null ? `<circle cx="${cx.toFixed(1)}" cy="${yAt(it.pm25).toFixed(1)}" r="${isSel ? 4.4 : 2.6}" fill="var(--pm25-color)"/>` : ""}
          <rect x="${(cx - 10).toFixed(1)}" y="${padT}" width="20" height="${plotH}" fill="transparent"/>
        </g>`;
      }).join("");

      const selG10 = pmGrade("pm10", sel.pm10), selG25 = pmGrade("pm25", sel.pm25);
      const bodyHtml = `
        <p style="margin:0; font-size:0.83em; color:var(--text-secondary);" class="tabular">
          ${airTrend.stationName} 측정소 · 최근 ${airTrend.count}건 (${airTrend.startLabel} ~ ${airTrend.endLabel}) · µg/m³
          ${freshness.isStale ? ` <span class="stale-badge">오래됨</span>` : ""}
        </p>
        <div class="chart-legend">
          <span class="legend-item"><span class="legend-swatch" style="background:var(--accent-primary);"></span>미세먼지 (PM10)</span>
          <span class="legend-item"><span class="legend-swatch" style="background:var(--pm25-color);"></span>초미세먼지 (PM2.5)</span>
        </div>
        <div class="chart-scroll">
          <svg class="trend-svg" viewBox="0 0 ${svgW} ${svgH}" role="img" aria-label="최근 측정 미세먼지 추이 그래프">
            ${yTicks}
            ${pm10Path ? `<path d="${pm10Path}" fill="none" stroke="var(--accent-primary)" stroke-width="2.2" stroke-linejoin="round"/>` : ""}
            ${pm25Path ? `<path d="${pm25Path}" fill="none" stroke="var(--pm25-color)" stroke-width="2.2" stroke-linejoin="round"/>` : ""}
            ${xTicks}${dotsAndHits}
          </svg>
        </div>
        <div class="trend-hour-strip" role="group" aria-label="측정 시각 선택">
          ${[...items].reverse().map(it => `<button type="button" class="trend-hour-pill tabular" data-air-idx="${it.idx}" aria-pressed="${it.idx === selIdx}">${it.timeStr}</button>`).join("")}
        </div>
        <div class="detail-kv-grid tabular">
          <div class="detail-kv"><span class="detail-kv-label">미세먼지 (PM10) · ${sel.timeStr}</span><span class="detail-kv-val">${sel.pm10 === null ? `결측 (${sel.pm10Flag || "자료 없음"})` : `${sel.pm10} µg/m³ · ${selG10.symbol} ${selG10.label}`}</span></div>
          <div class="detail-kv"><span class="detail-kv-label">초미세먼지 (PM2.5) · ${sel.timeStr}</span><span class="detail-kv-val">${sel.pm25 === null ? `결측 (${sel.pm25Flag || "자료 없음"})` : `${sel.pm25} µg/m³ · ${selG25.symbol} ${selG25.label}`}</span></div>
        </div>
        <div class="meta-list tabular">
          <div class="meta-list-row"><span class="meta-list-key">측정 시각</span><span class="meta-list-val">${sel.dateIso} ${sel.timeStr}${sel.normalizedFrom24 ? " (24:00 정규화)" : ""}</span></div>
          <div class="meta-list-row"><span class="meta-list-key">등급 기준</span><span class="meta-list-val">${airTrend.gradeBasis}</span></div>
          <div class="meta-list-row"><span class="meta-list-key">출처</span><span class="meta-list-val">한국환경공단 에어코리아</span></div>
        </div>
        <div class="sheet-note-box">실시간 자료는 확정 전 자료로 변동될 수 있습니다.<br/>결측 시각은 0으로 바꾸지 않고 선을 끊어 표시합니다.</div>
        <div class="sheet-actions"><button type="button" class="primary-btn" id="closeAirTrendBtn">확인</button></div>
      `;
      openModal("최근 측정 추이", bodyHtml, triggerEl);
      document.getElementById("closeAirTrendBtn").onclick = closeModal;
      document.getElementById("modalBody").querySelectorAll("[data-air-idx]").forEach(node => {
        const pick = () => { state.selectedAirTrendIdx = Number(node.dataset.airIdx); openAirTrendSheet(region, clock, airTrend, freshness, triggerEl); };
        node.onclick = pick;
        node.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); } };
      });
    }

    function openWidgetModal(triggerEl) {
      const primary = getPrimaryRegion();
      const widgetCardHtml = !primary

            </div>
          </button>`;

      const bodyHtml = `
        <div class="android-wallpaper-mock">${widgetCardHtml}</div>
        ${state.widgetFailedState ? `<div class="sheet-note-box">일시적인 연결 지연으로 마지막 성공 값과 시각(${state.widgetLastSuccessTime})을 유지합니다.</div>` : ""}

        </div>
      `;

      document.getElementById("closeWidgetModalBtn").onclick = closeModal;

      if (pickBtn) pickBtn.onclick = () => { closeModal(); switchTab("locations"); };

      if (tapBtn && primary) {

          syncSimulatorButtons(); openWidgetModal(triggerEl);
        };

    function openHelpDocModal(triggerEl) {

            <li>시간별 예보 칸이나 주간 예보 행을 누르면 해당 시각·날짜의 상세 정보가 열립니다.</li>
            <li>홈 상단의 미세먼지 영역을 누르면 최근 측정 추이 그래프를 확인할 수 있습니다.</li>
            <li>계산 체감온도를 누르면 적용 계절과 입력 관측값을 확인할 수 있습니다.</li>
          </ul>
        </div>
        <div class="doc-section">
          <h3>홈 위젯 갱신 지연 복구</h3>
          <p>기기 절전 설정에 따라 위젯 자동 갱신이 늦어질 수 있습니다.<br/>앱을 열어 새로고침하거나 기기 배터리 절전 예외를 확인해 주세요.</p>
        </div>
        <p class="doc-date">시행일: 2026-11-24</p>
        <div class="sheet-actions"><button type="button" class="primary-btn" id="closeDocBtn">확인</button></div>
      `;
      openModal("도움말", bodyHtml, triggerEl);
      document.getElementById("closeDocBtn").onclick = closeModal;
    }

    function openPrivacyDocModal(triggerEl) {
      const bodyHtml = `
        <div class="doc-section">
          <h3>한눈에 보기</h3>
          <p>땅버날씨는 회원가입·광고·분석 추적이 없으며, 원본 위치 좌표를 저장하거나 외부 서버로 전송하지 않습니다.</p>
        </div>
        <div class="doc-section">
          <h3>보관 정보</h3>
          <ul>
            <li>즐겨찾기 지역과 대표 지역 설정 (기기 내부)</li>
            <li>오프라인 표시용 날씨·과거 관측 기록 (기기 내부 임시 저장)</li>
          </ul>
        </div>
        <div class="doc-section">
          <h3>연결하는 곳</h3>
          <ul>
            <li>기상청 공공데이터 API (변환된 격자·관측소 ID만 전송)</li>
            <li>한국환경공단 에어코리아 API (근접 측정소명만 전송)</li>
          </ul>
        </div>
        <div class="doc-section">
          <h3>사용하는 권한</h3>
          <p>대략적인 위치 권한만 선택적으로 요청합니다.<br/>정밀 위치와 백그라운드 위치는 사용하지 않습니다.</p>
        </div>
        <div class="doc-section">
          <h3>정보 지우기</h3>
          <p>설정 › 정리 › 저장된 날씨 자료에서 임시 기록을 삭제할 수 있습니다.<br/>앱을 삭제하면 기기 내 모든 설정과 기록이 함께 지워집니다.</p>
        </div>
        <p class="doc-date">시행일: 2026-11-24</p>
        <div class="sheet-actions"><button type="button" class="primary-btn" id="closeDocBtn">확인</button></div>
      `;
      openModal("개인정보 처리방침", bodyHtml, triggerEl);
      document.getElementById("closeDocBtn").onclick = closeModal;
    }

    function openLicenseDocModal(triggerEl) {
      const bodyHtml = `
        <div>
          ${OPEN_SOURCE_LICENSES.map(item => `
            <details class="license-item">
              <summary>
                <span><strong>${item.name}</strong> <span style="color:var(--text-tertiary);">· ${item.license}</span></span>
                <span class="lic-chev" aria-hidden="true">›</span>
              </summary>
              <div class="license-body">
                <div>저작권자: ${item.holder}</div>
                <div>${item.desc}</div>
              </div>
            </details>
          `).join("")}
        </div>
        <p class="doc-date">시행일: 2026-11-24</p>
        <div class="sheet-actions"><button type="button" class="primary-btn" id="closeDocBtn">확인</button></div>
      `;
      openModal("오픈소스 라이선스", bodyHtml, triggerEl);
      document.getElementById("closeDocBtn").onclick = closeModal;
    }

    function openTermsDocModal(triggerEl) {
      const bodyHtml = `
        <div class="doc-section">
          <h3>기상청 공공데이터</h3>
          <p>초단기실황, 초단기·단기·중기예보, 종관기상관측 일자료를 공공누리 제1유형 조건에 따라 제공합니다.</p>
        </div>
        <div class="doc-section">
          <h3>한국환경공단 에어코리아</h3>
          <p>실시간 미세먼지·초미세먼지 수치는 확정 전 자료로 추후 변동될 수 있습니다.</p>
        </div>
        <div class="doc-section">
          <h3>계산 체감온도</h3>
          <p>같은 시각 실황 자료로 공개 산출식을 적용해 계산한 보조 지표이며, 기상청 공식 체감온도와 다를 수 있습니다.</p>
        </div>
        <p class="doc-date">시행일: 2026-11-24</p>
        <div class="sheet-actions"><button type="button" class="primary-btn" id="closeDocBtn">확인</button></div>
      `;
      openModal("이용 안내", bodyHtml, triggerEl);
      document.getElementById("closeDocBtn").onclick = closeModal;
    }

    /* ==========================================================================
       10. 내비게이션 · 테마 · 시뮬레이터 상태 제어 (P19 흐름 유지)
       ========================================================================== */
    function switchTab(tabId) {
      const mainEl = document.getElementById("appMain");
      if (state.activeTab === "home") state.homeScrollTop = mainEl.scrollTop;

      state.activeTab = tabId;
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === `tab-${tabId}`));
      document.querySelectorAll(".nav-btn").forEach(btn => btn.setAttribute("aria-current", btn.dataset.tab === tabId ? "page" : "false"));

      mainEl.scrollTop = tabId === "home" ? state.homeScrollTop : 0;
      renderTopbar();

      if (tabId === "settings") requestAnimationFrame(measureSettingRows);
      if (tabId === "home" && state.heroBgMode === "c") {
        heroParticlePaused = mainEl.scrollTop > 320;
        requestAnimationFrame(() => startHeroParticleLoop(getActiveRegion().sky));
      } else {
        stopHeroParticleLoop();
      }
    }

    function setTheme(theme) {
      state.theme = theme;
      document.documentElement.setAttribute("data-theme", theme);
      renderSettings();
      requestAnimationFrame(measureSettingRows);
      if (state.heroBgMode === "c") {
        if (theme === "high-contrast") stopHeroParticleLoop();
        else if (state.activeTab === "home") requestAnimationFrame(() => startHeroParticleLoop(getActiveRegion().sky));
      }
      syncSimulatorButtons();
    }

    function setPalette(palette) {
      if (state.theme === "high-contrast") return;
      state.palette = palette;
      document.documentElement.setAttribute("data-palette", palette);
      renderSettings();
      requestAnimationFrame(measureSettingRows);
      if (state.heroBgMode === "c" && state.activeTab === "home") {
        requestAnimationFrame(() => startHeroParticleLoop(getActiveRegion().sky));
      }
      syncSimulatorButtons();
    }

    function setScenario(scenario) {
      state.scenario = scenario;
      state.quotaExceeded = (scenario === "partial-fail");
      state.sectionErrors.midForecast = (scenario === "partial-fail");
      state.sectionErrors.airQualityFallback = (scenario === "partial-fail");
      state.sectionErrors.airQualityHardFail = false;

      if (scenario === "offline-cached") { state.lastUpdatedMinutesAgo = 14; state.lastRefreshSucceeded = false; }
      else if (scenario === "refreshing") { state.lastUpdatedMinutesAgo = 35; }
      else if (scenario === "partial-fail") { state.lastUpdatedMinutesAgo = 42; state.lastRefreshSucceeded = false; }
      else if (scenario === "normal" || scenario === "longest") { state.lastUpdatedMinutesAgo = 2; state.lastRefreshSucceeded = true; state.permissionStatus = "granted"; }
      else if (scenario === "perm-denied") { state.permissionStatus = "denied"; }
      renderAll();
    }

    function syncSimulatorButtons() {
      document.querySelectorAll("[data-scenario]").forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.scenario === state.scenario)));
      document.querySelectorAll("[data-theme-pick]").forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.themePick === state.theme)));
      document.querySelectorAll("[data-width]").forEach(btn => btn.setAttribute("aria-pressed", String(Number(btn.dataset.width) === state.widthPreset)));
      document.querySelectorAll("[data-hero-bg]").forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.heroBg === state.heroBgMode)));
      document.querySelectorAll("[data-sky-pick]").forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.skyPick === state.skyOverride)));
      document.getElementById("simScale200Btn").setAttribute("aria-pressed", String(state.scale200));
      document.getElementById("simSeasonBtn").setAttribute("aria-pressed", String(state.seasonMode === "summer"));
      document.getElementById("simApparentMissingBtn").setAttribute("aria-pressed", String(state.apparentMissingWind));
      document.getElementById("simAirPartialBtn").setAttribute("aria-pressed", String(state.airPartialDemo));
      document.getElementById("simAirHardFailBtn").setAttribute("aria-pressed", String(state.sectionErrors.airQualityHardFail));
      document.getElementById("simWidgetFailStateBtn").setAttribute("aria-pressed", String(state.widgetFailedState));

      const clock = getClockContext();
      document.getElementById("simClockNote").textContent = `기준 시각: ${clock.nowDateTimeStr} KST · 오프라인 독립 실행용 예시 기상 데이터`;
    }

    /* ==========================================================================
       11. 초기 이벤트 바인딩
       ========================================================================== */
    document.querySelectorAll(".nav-btn").forEach(btn => { btn.onclick = () => switchTab(btn.dataset.tab); });
    document.getElementById("topbarLocationBtn").onclick = () => switchTab("locations");
    document.getElementById("topbarHelpBtn").onclick = (e) => openHelpDocModal(e.currentTarget);

    document.getElementById("refreshBtn").onclick = () => {
      if (state.scenario === "offline-cached" || state.scenario === "empty") {
        state.lastRefreshSucceeded = false;
        showSnackbar("오프라인 상태입니다. 연결 후 다시 시도해 주세요.");
        return;
      }
      if (state.quotaExceeded) { showSnackbar("오늘 조회 한도를 초과해 마지막 저장 자료를 유지합니다."); return; }
      const prev = state.scenario;
      state.scenario = "refreshing";
      renderTopbar();
      announce("날씨 자료를 새로고침하는 중입니다.");
      setTimeout(() => {
        state.scenario = prev === "refreshing" ? "normal" : prev;
        state.lastUpdatedMinutesAgo = 0; state.lastRefreshSucceeded = true;
        if (state.selectedRegionId === state.primaryRegionId) {
          state.widgetLastSuccessTime = getClockContext().nowDateTimeStr.slice(11, 16);
          state.widgetFailedState = false;
        }
        renderAll();
        showSnackbar("최신 기상청·에어코리아 자료로 갱신했습니다.");
      }, 600);
    };

    document.getElementById("modalCloseBtn").onclick = closeModal;
    document.getElementById("modalBackdrop").onclick = (e) => { if (e.target === e.currentTarget) closeModal(); };
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

    document.getElementById("appMain").addEventListener("scroll", (e) => {
      heroParticlePaused = e.target.scrollTop > 320;
    }, { passive: true });

    window.addEventListener("resize", () => requestAnimationFrame(measureSettingRows));
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(() => measureSettingRows()).observe(document.getElementById("settingsContent"));
    }

    // 외부 시뮬레이터 컨트롤
    document.querySelectorAll("[data-hero-bg]").forEach(btn => {
      btn.onclick = () => {
        state.heroBgMode = btn.dataset.heroBg;
        if (state.activeTab !== "home") switchTab("home");
        if (state.scenario === "empty" || state.scenario === "loading") state.scenario = "normal";
        renderAll();
      };
    });
    document.querySelectorAll("[data-sky-pick]").forEach(btn => {
      btn.onclick = () => {
        state.skyOverride = btn.dataset.skyPick;
        if (state.activeTab !== "home") switchTab("home");
        if (state.scenario === "empty" || state.scenario === "loading") state.scenario = "normal";
        renderAll();
      };
    });
    document.querySelectorAll("[data-scenario]").forEach(btn => {
      btn.onclick = () => {
        setScenario(btn.dataset.scenario);
        if (btn.dataset.scenario !== "perm-denied" && state.activeTab !== "home") switchTab("home");
      };
    });
    document.querySelectorAll("[data-theme-pick]").forEach(btn => { btn.onclick = () => setTheme(btn.dataset.themePick); });
    document.querySelectorAll("[data-width]").forEach(btn => {
      btn.onclick = () => {
        const w = Number(btn.dataset.width);
        state.widthPreset = w;
        document.documentElement.style.setProperty("--app-max-width", `${w}px`);
        document.getElementById("appShell").classList.toggle("narrow-320", w <= 320);
        syncSimulatorButtons();
        requestAnimationFrame(measureSettingRows);
      };
    });
    document.getElementById("simScale200Btn").onclick = () => {
      state.scale200 = !state.scale200;
      renderAll();
    };
    document.getElementById("simSeasonBtn").onclick = () => {
      state.seasonMode = state.seasonMode === "winter" ? "summer" : "winter";
      renderAll();
    };
    document.getElementById("simApparentMissingBtn").onclick = () => {
      state.apparentMissingWind = !state.apparentMissingWind;
      renderAll();
    };
    document.getElementById("simAirPartialBtn").onclick = () => {
      state.airPartialDemo = !state.airPartialDemo;
      renderAll();
      if (state.airPartialDemo) {
        const region = getActiveRegion(), clock = getClockContext(), airTrend = buildAirTrendSeries(region, clock);
        state.selectedAirTrendIdx = airTrend.items.length - 1;
        openAirTrendSheet(region, clock, airTrend, getDataFreshnessState(), document.getElementById("simAirPartialBtn"));
      }
    };
    document.getElementById("simAirHardFailBtn").onclick = () => {
      state.sectionErrors.airQualityHardFail = !state.sectionErrors.airQualityHardFail;
      if (state.activeTab !== "home") switchTab("home");
      renderAll();
    };
    document.getElementById("simWidgetFailStateBtn").onclick = () => {
      state.widgetFailedState = !state.widgetFailedState;
      syncSimulatorButtons();
      openWidgetModal(document.getElementById("simWidgetFailStateBtn"));
    };
    document.getElementById("simPermModalBtn").onclick = (e) => openPermissionModal(e.currentTarget);
    document.getElementById("simWidgetBtn").onclick = (e) => openWidgetModal(e.currentTarget);

    if (window.matchMedia("(max-width: 899px)").matches) {
      document.getElementById("simDrawer").open = false;
    }

    renderAll();
  </script>
</body>
</html>
